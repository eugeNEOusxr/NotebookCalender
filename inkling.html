<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inkling · your evolving model of how the world works</title>
<style>
  :root{
    --bg:#070b14; --panel:rgba(255,255,255,0.04); --panel2:rgba(255,255,255,0.06);
    --line:rgba(255,255,255,0.12); --ink:#e6edf3; --dim:#8b949e; --blue:#9ecbff;
    --pink:#f0abfc; --green:#39d98a; --amber:#fbbf24; --violet:#a78bfa;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font:600 14px/1.5 system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased}
  /* Inkling's galaxy — green & violet nebula (its signature look). */
  body{background:radial-gradient(1050px 640px at 82% -10%,rgba(57,217,138,.13),transparent 58%),
        radial-gradient(900px 620px at 6% 108%,rgba(120,90,255,.15),transparent 58%),
        radial-gradient(700px 700px at 50% 40%,rgba(45,120,90,.06),transparent 60%),var(--bg)}
  a{color:inherit}
  .wrap{max-width:760px;margin:0 auto;padding:22px 16px 90px}
  .top{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:18px}
  .brand{font:800 20px system-ui}
  .brand small{display:block;font:600 11px system-ui;color:var(--dim);margin-top:2px}
  .nav{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .nav button{background:var(--panel);border:1px solid var(--line);color:var(--ink);
    border-radius:999px;padding:7px 13px;font:700 12px system-ui;cursor:pointer}
  .nav button.on{background:rgba(158,203,255,.16);border-color:rgba(158,203,255,.55);color:var(--blue)}
  .back{background:transparent;border:0;color:var(--blue);font:700 12px system-ui;cursor:pointer;padding:0;margin-bottom:12px}
  h1{font:800 22px system-ui;margin:0 0 4px}
  .sub{color:var(--dim);font:600 12px system-ui;margin:0 0 18px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  @media(max-width:560px){.grid{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px;
    cursor:pointer;text-align:left;color:var(--ink);width:100%;transition:transform .08s,border-color .12s}
  .card:hover{transform:translateY(-1px);border-color:rgba(158,203,255,.5)}
  .card .ic{font-size:26px}
  .card .nm{font:800 16px system-ui;margin:7px 0 3px}
  .card .bl{color:var(--dim);font:600 12px system-ui;line-height:1.45}
  .card .meta{margin-top:9px;font:700 11px system-ui;color:var(--blue)}
  .qrow{display:flex;align-items:flex-start;gap:11px;background:var(--panel);border:1px solid var(--line);
    border-radius:12px;padding:13px 14px;margin-bottom:9px;cursor:pointer;text-align:left;color:var(--ink);width:100%}
  .qrow:hover{border-color:rgba(240,171,252,.5)}
  .qrow .dot{flex:0 0 auto;width:10px;height:10px;border-radius:50%;margin-top:5px;background:#3b4252}
  .qrow.done .dot{background:var(--green)}
  .qrow.rev .dot{background:var(--violet)}
  .qrow .qt{font:700 13px system-ui}
  .qrow .qc{font:700 11px system-ui;color:var(--dim);margin-top:2px}
  .qrow .st{margin-left:auto;flex:0 0 auto;font:700 10px system-ui;color:var(--dim);white-space:nowrap;padding-top:2px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
  .qbig{font:800 19px system-ui;line-height:1.35;margin:0 0 4px}
  .concept-tag{display:inline-block;font:700 11px system-ui;color:var(--pink);
    background:rgba(240,171,252,.12);border:1px solid rgba(240,171,252,.4);border-radius:999px;padding:3px 10px;margin-bottom:12px}
  textarea{width:100%;min-height:110px;resize:vertical;background:rgba(0,0,0,.25);border:1px solid var(--line);
    border-radius:11px;padding:12px;color:var(--ink);font:600 14px/1.5 system-ui;outline:none}
  textarea:focus{border-color:rgba(158,203,255,.6)}
  .conf{display:flex;align-items:center;gap:11px;margin:13px 0}
  .conf input{flex:1}
  .conf .lab{font:700 11px system-ui;color:var(--dim);min-width:96px}
  .conf .val{font:800 12px system-ui;color:var(--amber);min-width:104px;text-align:right}
  .btn{background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;border:0;border-radius:11px;
    padding:11px 18px;font:800 13px system-ui;cursor:pointer}
  .btn.pink{background:linear-gradient(135deg,#db2777,#a21caf)}
  .btn.ghost{background:var(--panel2);border:1px solid var(--line);color:var(--ink)}
  .btn:disabled{opacity:.5;cursor:default}
  .reality h3{font:800 13px system-ui;color:var(--green);margin:0 0 7px;text-transform:uppercase;letter-spacing:.04em}
  .reality p{margin:0 0 12px;line-height:1.55;color:#dbe4ee}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin:4px 0 6px}
  .chip{font:700 12px system-ui;border-radius:999px;padding:6px 12px;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--ink);user-select:none}
  .chip.had{background:rgba(57,217,138,.16);border-color:rgba(57,217,138,.6);color:var(--green)}
  .chip.new{background:rgba(251,191,36,.15);border-color:rgba(251,191,36,.55);color:var(--amber)}
  .hint{font:600 11px system-ui;color:var(--dim);margin:2px 0 10px}
  .timeline{border-left:2px solid var(--line);margin:6px 0 4px;padding-left:14px}
  .tl{margin-bottom:12px}
  .tl .when{font:700 11px system-ui;color:var(--violet)}
  .tl .txt{margin-top:3px;color:#dbe4ee;line-height:1.5;white-space:pre-wrap}
  .tl .cf{font:700 10px system-ui;color:var(--dim);margin-top:3px}
  .node{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:14px;margin-bottom:10px}
  .node .nh{display:flex;align-items:baseline;gap:8px;justify-content:space-between}
  .node .nn{font:800 15px system-ui;color:var(--blue)}
  .node .nc{font:700 10px system-ui;color:var(--dim)}
  .node .links{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
  .node .lk{font:700 10px system-ui;color:var(--dim);background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px 9px}
  .empty{color:var(--dim);line-height:1.6;text-align:center;padding:34px 12px}
  .jotwrap{margin-top:10px}
  .jotwrap input{width:100%;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ink);font:600 13px system-ui;outline:none}
  .openq{font:600 12px system-ui;color:#cbd5e1;padding:6px 0 6px 16px;position:relative}
  .openq:before{content:"?";position:absolute;left:0;color:var(--amber);font-weight:800}
  .savedflash{color:var(--green);font:800 12px system-ui;opacity:0;transition:opacity .2s}
  .savedflash.show{opacity:1}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
"use strict";

/* ============================================================
   INKLING — the core learning-intelligence loop.
   Ask what you already think → capture it as a node → reveal the
   reality layer → let you refine (had vs. new) → track how your
   understanding evolves over time.  Self-contained, offline, guest-safe.
   ============================================================ */

const FIELDS = [
  { id:"ee", icon:"⚡", name:"Electrical Engineering",
    blurb:"From what electricity is, down to how a transistor thinks.",
    questions:[
      { id:"ee1", concept:"Electricity", q:"What do you think electricity actually is?",
        reality:{ summary:"Electricity is the flow of electric charge — usually electrons drifting through a conductor, pushed by a difference in electric potential (voltage). The surprising part: the energy is carried by the electromagnetic field around the wire, not by electrons racing along inside it.",
          concepts:["electric charge","electron","voltage","electric field","conductor"] } },
      { id:"ee2", concept:"Voltage & Current", q:"What is the difference between voltage and current?",
        reality:{ summary:"Voltage is the push — a difference in potential energy per unit charge, measured in volts. Current is the flow — how much charge moves per second, measured in amperes. Water helps: voltage is pressure, current is how fast the water flows. Resistance ties them together (Ohm's law: V = I × R).",
          concepts:["potential difference","ampere","resistance","Ohm's law"] } },
      { id:"ee3", concept:"Signal propagation", q:"Why does a light bulb turn on instantly when a switch is flipped?",
        reality:{ summary:"The electrons themselves drift shockingly slowly — millimeters per second. But the electric field that pushes them propagates through the whole circuit at nearly the speed of light, so every electron 'feels the push' almost instantly. The bulb lights because the field arrives, not because an electron traveled from the switch.",
          concepts:["drift velocity","electric field","energy transfer","speed of light"] } },
      { id:"ee4", concept:"Conductors & insulators", q:"How do materials decide whether electricity can flow through them?",
        reality:{ summary:"It comes down to how tightly a material holds its electrons. Conductors (metals) have loosely-bound 'free' electrons that move easily. Insulators hold electrons tightly. Semiconductors sit in between — and crucially, we can control whether they conduct, which is what makes computers possible.",
          concepts:["free electrons","band gap","semiconductor","doping"] } },
      { id:"ee5", concept:"Control & amplification", q:"How does a small electrical signal control something much larger?",
        reality:{ summary:"A tiny signal changes a device's resistance or state at a control terminal — a transistor's gate, or a relay's coil — which gates a much larger current flowing elsewhere. That's amplification and control: little input, big controlled output. It's the idea behind every amplifier, motor controller, and logic gate.",
          concepts:["transistor","gate","relay","amplification","gain"] } },
      { id:"ee6", concept:"Transistor", q:"What do you think a transistor does inside a computer?",
        reality:{ summary:"A transistor is an electrically-controlled switch. A small voltage on its gate either lets current flow (a 1) or blocks it (a 0) — no moving parts. Wire billions of them together and those on/off switches become logic gates, memory, and eventually every decision a computer makes.",
          concepts:["switch","gate voltage","logic gate","on/off states"] } },
      { id:"ee7", concept:"Information as electricity", q:"How does information become represented using electricity?",
        reality:{ summary:"We agree on a convention: a high voltage means 1, a low voltage means 0. Patterns of those bits encode numbers, letters, and instructions. Logic gates transform the patterns, and that transformation IS computation — information becomes physical, then gets reshaped by electricity.",
          concepts:["binary","bit","voltage threshold","encoding","logic"] } }
    ] },

  { id:"ai", icon:"🤖", name:"Artificial Intelligence",
    blurb:"How a machine can 'learn' without ever understanding.",
    questions:[
      { id:"ai1", concept:"Machine learning", q:"What do you think 'learning' means for a machine?",
        reality:{ summary:"Learning for a machine means adjusting a huge set of internal numbers (weights) so its output matches the examples it's shown, over and over. It isn't understanding — it's fitting patterns by nudging numbers to reduce error. Powerful, but mechanical.",
          concepts:["weights","training data","error / loss","gradient"] } },
      { id:"ai2", concept:"Neural network", q:"How does a neural network make a decision?",
        reality:{ summary:"Inputs flow through layers of weighted sums followed by simple nonlinear functions. Each weight tilts the answer a little; stacked together, the layers can carve complex boundaries. The 'decision' is just the number that comes out the far end.",
          concepts:["neuron","weight","activation","layer"] } },
      { id:"ai3", concept:"Model parameters", q:"Where does an AI's 'knowledge' actually live?",
        reality:{ summary:"Not in a database of facts — in the numbers (parameters) learned during training, smeared across the whole network. Knowledge is distributed: no single number holds a fact, the pattern of millions of them does.",
          concepts:["parameters","distributed representation","training"] } },
      { id:"ai4", concept:"Prediction vs understanding", q:"What's the difference between an AI predicting and understanding?",
        reality:{ summary:"A model predicts the most likely next output from patterns it has seen. That can be extremely useful and still not be understanding — the model has no grasp of meaning, only of what tends to follow what. Keeping that distinction sharp is how you use AI wisely.",
          concepts:["prediction","pattern","generalization"] } }
    ] },

  { id:"robotics", icon:"🦾", name:"Robotics & Automation",
    blurb:"Sense, decide, move — and the industrial controls behind it.",
    questions:[
      { id:"rb1", concept:"Feedback & sensing", q:"How does a robot know where its arm is?",
        reality:{ summary:"Sensors called encoders report each joint's position. A control loop constantly compares where the arm SHOULD be to where it IS, and corrects the difference. Without that feedback loop, a robot is blind to its own body.",
          concepts:["encoder","feedback loop","actuator","error"] } },
      { id:"rb2", concept:"Actuation", q:"How does a robot turn a decision into movement?",
        reality:{ summary:"A controller sends signals to motors — often through drivers or variable-frequency drives (VFDs). Current through the motor's coils creates torque, which moves the joint. Decision → signal → current → torque → motion.",
          concepts:["motor","controller","torque","VFD / driver"] } },
      { id:"rb3", concept:"Autonomy", q:"What makes a robot 'autonomous'?",
        reality:{ summary:"A robot is autonomous when it runs its own sense → decide → act loop using an internal model of the world, without a human steering each step. The intelligence is in that loop, not in any single part.",
          concepts:["perception","planning","control loop"] } },
      { id:"rb4", concept:"PLC / industrial control", q:"How does a PLC fit into industrial automation?",
        reality:{ summary:"A PLC (Programmable Logic Controller) is a rugged industrial computer that reads sensor inputs and drives outputs on a fast, repeating scan cycle to control machinery. It's the backbone of industrial controls — the exact world an electrician moves toward in the later years of the trade.",
          concepts:["PLC","ladder logic","I/O","scan cycle"] } }
    ] },

  { id:"cs", icon:"💻", name:"Computer Science",
    blurb:"What a program really is, all the way down to the transistors.",
    questions:[
      { id:"cs1", concept:"Program", q:"What is a program, really?",
        reality:{ summary:"A program is a precise list of instructions the CPU executes one step at a time. No magic — just an ordered recipe, followed exactly, very fast.",
          concepts:["instruction","CPU","execution"] } },
      { id:"cs2", concept:"Memory", q:"How does a computer remember things?",
        reality:{ summary:"Data lives as bits in memory cells, each reachable by a numeric address. RAM is fast but forgets when powered off; storage is slower but persists. 'Remembering' is just reading the bits back from an address.",
          concepts:["bit","RAM","address","storage"] } },
      { id:"cs3", concept:"Execution", q:"What happens when you run code?",
        reality:{ summary:"Your source is translated into machine instructions, loaded into memory, and executed by the CPU as a running process. The words you wrote become numbers the hardware knows how to obey.",
          concepts:["compiler","machine code","process"] } },
      { id:"cs4", concept:"Abstraction stack", q:"How does one line of code become electricity doing work?",
        reality:{ summary:"Layers: your language → machine code → logic gates → transistors switching on and off. Every line you write is an abstraction sitting on top of electricity moving through silicon. This is where computer science and electrical engineering become the same story.",
          concepts:["abstraction","machine code","logic gate","transistor"] } }
    ] },

  { id:"physics", icon:"🌌", name:"Physics",
    blurb:"Energy, force, and fields — the rules underneath everything.",
    questions:[
      { id:"ph1", concept:"Energy", q:"What is energy?",
        reality:{ summary:"Energy is the capacity to do work — to move or change something. It's never created or destroyed, only transformed between forms (motion, heat, electrical, chemical). That conservation is one of physics' deepest rules.",
          concepts:["work","conservation","forms of energy"] } },
      { id:"ph2", concept:"Gravity", q:"Why do things fall?",
        reality:{ summary:"Mass warps spacetime, and objects follow that curvature — which we feel as a force. Near Earth's surface it accelerates everything at about 9.8 m/s² regardless of mass.",
          concepts:["mass","acceleration","force","field"] } },
      { id:"ph3", concept:"Field", q:"What is a field?",
        reality:{ summary:"A field assigns a value to every point in space — electric, magnetic, or gravitational — and that value tells a nearby object what force it will feel. The electric field you meet in EE is the same kind of idea as gravity.",
          concepts:["field","force","potential"] } },
      { id:"ph4", concept:"Electromagnetism", q:"How does light carry energy?",
        reality:{ summary:"Light is an oscillating electric and magnetic field propagating together as a wave — also describable as particles called photons. The same electromagnetism that lights your room runs your circuits.",
          concepts:["wave","photon","EM spectrum"] } }
    ] },

  { id:"math", icon:"📐", name:"Mathematics",
    blurb:"Functions, variables, graphs — the language of relationships.",
    questions:[
      { id:"ma1", concept:"Function", q:"What is a function?",
        reality:{ summary:"A function is a rule that takes each input to exactly one output — a machine: put a number in, get a number out. Almost all of math and physics is really the study of functions.",
          concepts:["input","output","mapping"] } },
      { id:"ma2", concept:"Variables", q:"Why do we use variables like x?",
        reality:{ summary:"A variable is a placeholder for an unknown or changing quantity. It lets you describe a relationship once and apply it to every case at once — that generality is the whole power of algebra.",
          concepts:["variable","relationship","generalization"] } },
      { id:"ma3", concept:"Graphs", q:"What does a graph actually show?",
        reality:{ summary:"A graph is a picture of how one quantity changes as another changes. The shape of the curve IS the relationship — a steep line means fast change, a flat one means none.",
          concepts:["axis","slope","relationship"] } },
      { id:"ma4", concept:"Quadratics", q:"Where would 3x² + 2x show up in real life?",
        reality:{ summary:"Anywhere acceleration, area, or optimization appears: a car's stopping distance grows with the square of speed, a thrown object traces a parabola, and a motor's power curve bends quadratically. The x² term is what makes the change speed up.",
          concepts:["quadratic","rate of change","optimization"] } }
    ] }
];

/* ============================================================
   THE INITIAL UNDERSTANDING PROTOCOL
   A guided onboarding conversation — not a personality test. Each
   answer seeds a typed first node (curiosity / question / goal /
   style / reasoning / future-question / personal-timeline). The goal
   is to understand the LEARNER before guiding the learning.
   ============================================================ */
const PROTOCOL = [
  { cat:"Your current mindset", color:"var(--violet)",
    lead:"No right answers here — Inkling is learning who you are.",
    items:[
      { id:"m1", node:"curiosity",  q:"What is something you wish you understood deeply?" },
      { id:"m2", node:"curiosity",  q:"What topics do you find yourself returning to, again and again?" },
      { id:"m3", node:"question",   q:"What question has stayed with you for years?" },
      { id:"m4", node:"discovery",  q:"What did you learn recently that changed how you see the world?" },
      { id:"m5", node:"confusion",  q:"What feels obvious to everyone else, but confusing to you?" }
    ] },
  { cat:"How you think", color:"var(--blue)",
    lead:"This shapes how Inkling explains things back to you.",
    items:[
      { id:"t1", node:"style", q:"When you learn something new, what works best for you?",
        choices:["Examples","Explanations","Experiments","Visuals","Building things"], multi:true },
      { id:"t2", node:"reasoning", q:"When something doesn't make sense, what usually helps you finally get it?" },
      { id:"t3", node:"style", q:"Do you like the big picture first, or the small mechanisms first?",
        choices:["Big picture first","Small mechanisms first","It depends"], multi:false },
      { id:"t4", node:"reasoning", q:"Think of an explanation that finally made something click. What was it?" }
    ] },
  { cat:"What pulls at you", color:"var(--pink)", fieldsStep:true,
    lead:"Pick the fields you're drawn to — this seeds your first map." },
  { cat:"What you want to understand", color:"var(--amber)",
    lead:"Reach as far as you want. These become questions to chase.",
    items:[
      { id:"q1", node:"future_question", q:"If one person could answer any question about reality, what would you ask?" },
      { id:"q2", node:"goal", q:"If you could understand one technology completely, what would it be?" },
      { id:"q3", node:"goal", q:"What problem in the world would you most want to help solve?" },
      { id:"q4", node:"future_question", q:"What do you think humans still don't understand?" }
    ] },
  { cat:"The story that shaped you", color:"var(--green)",
    lead:"How you learn was shaped by a life. This is part of the record.",
    items:[
      { id:"p1", node:"personal", q:"What experiences shaped the way you think?" },
      { id:"p2", node:"personal", q:"What moment changed your perspective?" },
      { id:"p3", node:"personal", q:"What interest has followed you your whole life?" },
      { id:"p4", node:"personal", q:"What's an idea you've changed your mind about?" }
    ] }
];
// canonical learning spine + field keyword signatures (offline recommendation)
const SPINE = ["math","physics","ee","cs","ai","robotics"];
const FIELD_KW = {
  math:["math","algebra","calculus","equation","number","geometry","function","statistic"],
  physics:["physic","energy","force","atom","matter","quantum","light","gravity","field","wave"],
  ee:["electric","voltage","current","circuit","power","wire","transistor","signal","electronic"],
  cs:["code","coding","program","software","computer","computing","algorithm","data"],
  ai:["ai","artificial intelligence","machine learning","neural","intelligence","model","learn from data","llm"],
  robotics:["robot","automation","motor","arm","plc","industrial control","machine","actuator","autonom"]
};

/* ============================================================
   THE INKLING INTERPRETER — intelligence routing.
   You just say something. Inkling reads it, decides what KIND of
   thing it is, and files it in the right system. You never sort it.
   Conversation → Interpreter → {knowledge, question, path, goal,
   memory, story, reflection, flashcard}. Offline heuristic classifier.
   ============================================================ */
const ROUTES = {
  knowledge:{icon:"🧠",label:"Knowledge node",color:"var(--blue)",system:"Knowledge graph",verb:"added to your knowledge graph"},
  question:{icon:"❓",label:"Question",color:"var(--amber)",system:"Open questions",verb:"filed as an open question to chase"},
  path:{icon:"🧭",label:"Learning path",color:"var(--green)",system:"Study maps",verb:"opened as a learning path"},
  goal:{icon:"🎯",label:"Goal",color:"var(--green)",system:"Goals",verb:"set as a goal"},
  memory:{icon:"📌",label:"Memory",color:"var(--amber)",system:"Memory",verb:"remembered about you"},
  story:{icon:"📖",label:"Story event",color:"var(--violet)",system:"Storybook",verb:"added to your story"},
  reflection:{icon:"🪞",label:"Reflection",color:"var(--violet)",system:"Reflection",verb:"kept as a reflection"},
  flashcard:{icon:"🗂️",label:"Flashcard",color:"var(--pink)",system:"Flashcards",verb:"saved as a study item"}
};
const ROUTE_ORDER=["knowledge","question","path","goal","memory","story","reflection","flashcard"];

function detectLinks(low){
  const found=new Map();  // lowercase key → display label (dedupe case-insensitively)
  const add=v=>{ const k=v.toLowerCase(); if(!found.has(k)) found.set(k,v); };
  FIELDS.forEach(f=>{
    (FIELD_KW[f.id]||[]).forEach(k=>{ if(low.includes(k)) add(f.name); });
    f.questions.forEach(q=>{
      if(low.includes(" "+q.concept.toLowerCase())) add(q.concept);
      (q.reality.concepts||[]).forEach(c=>{ if(low.includes(c.toLowerCase())) add(c); });
    });
  });
  return [...found.values()].slice(0,6);
}
function classify(t){
  const s=t.trim(); const low=" "+s.toLowerCase().replace(/\s+/g," ")+" ";
  const links=detectLinks(low); const has=re=>re.test(low);
  let type="knowledge", reason="It introduces an idea, so Inkling stored it in your knowledge graph.";
  if(has(/\b(i want to|i'd like to|i wanna|help me|i need to) (learn|study|master|understand how)\b/)||has(/\bteach me\b/)||has(/\bget (into|started with)\b/)||has(/\bwhere do i (start|begin)\b/)||has(/\bhow do i learn\b/)){
    type="path"; reason="You're setting out to learn a subject, so Inkling opened a learning path.";
  } else if(has(/\b[a-z]+ means [a-z]+/)||has(/\bstands for\b/)||/^[^?]{2,40}:\s+\S+/.test(s)||has(/\b(i keep|i always) (forget|forgetting|mixing up|confusing)\b/)){
    type="flashcard"; reason="There's a term and a meaning here, so Inkling made it a study item.";
  } else if(has(/\bmy goal\b/)||has(/\bi want to be\b/)||has(/\b(i want to|i'm trying to|i plan to|i hope to|i aim to|one day i|someday i|i will) (build|make|create|become|design|invent|solve|start|launch|work)\b/)){
    type="goal"; reason="You named something you're working toward, so Inkling set it as a goal.";
  } else if(has(/\bi (prefer|learn best|always|usually|tend to|work better)\b/)||has(/\bremember that i\b/)||has(/\bnote that i\b/)||has(/\bfor me,? [a-z]/)||has(/\bi'm the kind of\b/)){
    type="memory"; reason="This is lasting context about you, so Inkling will remember it.";
  } else if(has(/\bit clicked\b/)||has(/\bfinally (understand|get|got|clicked)\b/)||has(/\bnow i (understand|get|see|know)\b/)||has(/\bi used to think\b/)||has(/\bi connected\b/)||has(/\bchanged how i (see|think)\b/)||has(/\bmakes sense now\b/)){
    type="story"; reason="This is a real shift in your understanding, so Inkling added it to your story.";
  } else if(has(/\bi (feel|realized|realize|realised|noticed)\b/)||has(/\bi've been thinking\b/)||has(/\blately\b/)){
    type="reflection"; reason="This reads as a reflection, so Inkling kept it as one.";
  } else if(/\?\s*$/.test(s)||has(/^ (how|why|what|when|where|who|which|does|do|can|could|is|are|should|would|will|if)\b/)){
    type="question"; reason="You asked something, so Inkling filed it as an open question to chase.";
  }
  return {type,links,reason};
}

/* ---- storage ---- */
const KEY = "inkling-mind-v1";
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; } }
function save(d){ try{ localStorage.setItem(KEY, JSON.stringify(d)); }catch(e){} }
let DB = load();
DB.answers = DB.answers || {};   // {qid:[{text,conf,at}]}
DB.refine  = DB.refine  || {};   // {qid:{had:[i],new:[i]}}
DB.openQs  = DB.openQs  || {};   // {qid:[str]}
DB.breakthroughs = DB.breakthroughs || {};  // {qid:[timestamp,...]} — moments it clicked
DB.profile = DB.profile || { answers:{}, fields:[], done:false, startedAt:0, completedAt:0 };
DB.captures = DB.captures || [];  // interpreter output: [{id,text,type,links,reason,at}]
DB.chat = DB.chat || [];          // conversation transcript: [{role,text|html,route,links,actions,at}]
DB.conversations = DB.conversations || []; // imported AI chats: [{id,title,provider,summary,concepts,relations,quiz,messageCount,at}]
DB.proposals = DB.proposals || [];   // NEXARIS Approval Gate inbox: AI changes waiting for your OK (never applied until approved)
DB.revisions = DB.revisions || [];   // append-only history — every applied change keeps the value it replaced (nothing is ever lost)
DB.events = DB.events || [];         // NEXARIS event log — append-only stream of every decision (the "nervous system")
function persist(){ save(DB); }

/* NEXARIS event bus (P1): append-only log of everything that happens. Small,
   tamper-simple, replayable. Every Gate action emits one event here. */
const EVENT_META = { "proposal.proposed":{icon:"📥",verb:"Proposed"}, "proposal.approved":{icon:"✅",verb:"Approved"},
  "proposal.rejected":{icon:"🚫",verb:"Rejected"}, "proposal.undone":{icon:"↩",verb:"Undone"} };
function emit(topic, payload){
  DB.events = DB.events || [];
  DB.events.push(Object.assign({ id:"evt_"+Date.now().toString(36)+Math.random().toString(36).slice(2,6), ts:Date.now(), topic }, payload||{}));
  if(DB.events.length>1000) DB.events = DB.events.slice(-1000); // storage guard (keeps the most recent 1000)
  persist();
}

/* ============================================================
   NEXARIS P0 — THE APPROVAL GATE  (human final authority)
   AI passes no longer write straight into your graph. They PROPOSE.
   Each proposal carries an "explain" block (why / confidence / risks)
   and a list of before→after changes. Nothing changes until YOU approve.
   Every applied change is logged to DB.revisions with the old value,
   so history is never overwritten and every decision is reversible (Undo).
   ============================================================ */
const GATE_KINDS = { summary:{icon:"✨",agent:"Summarizer",label:"Summaries & tags"},
  extract:{icon:"🔮",agent:"Extractor",label:"Extracted knowledge"},
  edge:{icon:"🔗",agent:"Relationship Labeler",label:"Relationship labels"} };
function newId(p){ return (p||"id")+"_"+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
const Gate = {
  propose(p){ p.id=newId("prop"); p.ts=Date.now(); p.status="pending";
    p.changes=(p.changes||[]).filter(ch=>Gate._diff(ch)); if(!p.changes.length) return null;
    DB.proposals.unshift(p); persist();
    emit("proposal.proposed",{ proposalId:p.id, kind:p.kind, agent:p.agent, title:p.title, changes:p.changes.length, demo:!!p.demo });
    return p.id; },
  pending(kind){ return (DB.proposals||[]).filter(p=>p.status==="pending"&&(!kind||p.kind===kind)); },
  applied(){ return (DB.proposals||[]).filter(p=>p.status==="applied"); },
  find(id){ return (DB.proposals||[]).find(p=>p.id===id); },
  // is a change actually a change? (skip no-ops)
  _diff(ch){ const f=ch.fields||{}; return Object.keys(f).some(k=>JSON.stringify(f[k].from)!==JSON.stringify(f[k].to)); },
  _target(ch){ if(ch.target.type==="conversation") return (DB.conversations||[]).find(c=>String(c.id)===String(ch.target.id));
    if(ch.target.type==="edgeLabel"){ DB.edgeLabels=DB.edgeLabels||{}; return DB.edgeLabels; } return null; },
  _read(ch,field){ const t=Gate._target(ch); if(!t) return undefined;
    return ch.target.type==="edgeLabel" ? t[ch.target.key] : t[field]; },
  _write(ch,field,val){ const t=Gate._target(ch); if(!t) return;
    if(ch.target.type==="edgeLabel") t[ch.target.key]=val; else t[field]=val; },
  approve(id){ const p=Gate.find(id); if(!p||p.status!=="pending") return;
    p.revIds=[];
    (p.changes||[]).forEach(ch=>{ const f=ch.fields||{}; Object.keys(f).forEach(field=>{
      const from=Gate._read(ch,field); const to=f[field].to;
      if(JSON.stringify(from)===JSON.stringify(to)) return;
      Gate._write(ch,field,to);
      const rid=newId("rev"); p.revIds.push(rid);
      DB.revisions.push({ id:rid, ts:Date.now(), proposalId:p.id, agent:p.agent, kind:p.kind,
        target:ch.target, label:ch.target.label, field, from, to }); }); });
    // mark source conversations processed so the pass won't re-offer them
    (p.changes||[]).forEach(ch=>{ if(ch.target.type==="conversation"){ const c=(DB.conversations||[]).find(x=>String(x.id)===String(ch.target.id));
      if(c){ if(p.kind==="summary") c.aiSum=true; if(p.kind==="extract") c.aiExtracted=true; } } });
    p.status="applied"; p.decidedAt=Date.now(); persist();
    emit("proposal.approved",{ proposalId:p.id, kind:p.kind, agent:p.agent, title:p.title, changes:(p.changes||[]).length, revisions:(p.revIds||[]).length, demo:!!p.demo }); },
  reject(id){ const p=Gate.find(id); if(!p||p.status!=="pending") return;
    p.status="rejected"; p.decidedAt=Date.now(); persist();
    emit("proposal.rejected",{ proposalId:p.id, kind:p.kind, agent:p.agent, title:p.title, changes:(p.changes||[]).length, demo:!!p.demo }); },
  undo(id){ const p=Gate.find(id); if(!p||p.status!=="applied") return;
    // restore each change's previous value, logged as its own reversal (history preserved)
    (p.revIds||[]).map(rid=>DB.revisions.find(r=>r.id===rid)).filter(Boolean).reverse().forEach(r=>{
      const ch={ target:r.target }; const cur=Gate._read(ch,r.field);
      Gate._write(ch,r.field,r.from);
      DB.revisions.push({ id:newId("rev"), ts:Date.now(), proposalId:p.id, agent:"You (Undo)",
        kind:p.kind, target:r.target, label:r.label, field:r.field, from:cur, to:r.from }); });
    (p.changes||[]).forEach(ch=>{ if(ch.target.type==="conversation"){ const c=(DB.conversations||[]).find(x=>String(x.id)===String(ch.target.id));
      if(c){ if(p.kind==="summary") c.aiSum=false; if(p.kind==="extract") c.aiExtracted=false; } } });
    p.status="undone"; p.undoneAt=Date.now(); persist();
    emit("proposal.undone",{ proposalId:p.id, kind:p.kind, agent:"You (Undo)", title:p.title, changes:(p.changes||[]).length, demo:!!p.demo }); },
  // conversation ids already sitting in a pending proposal of this kind (don't double-offer)
  pendingConvIds(kind){ const s=new Set(); Gate.pending(kind).forEach(p=>(p.changes||[]).forEach(ch=>{
    if(ch.target.type==="conversation") s.add(String(ch.target.id)); })); return s; },
  // edge keys already sitting in a pending relationship-label proposal
  pendingEdgeKeys(){ const s=new Set(); Gate.pending("edge").forEach(p=>(p.changes||[]).forEach(ch=>{
    if(ch.target.type==="edgeLabel") s.add(ch.target.key); })); return s; }
};

function appliedCard(p){
  const k=GATE_KINDS[p.kind]||{icon:"•"}, n=(p.revIds||[]).length;

function eventLine(e){
  const m=EVENT_META[e.topic]||{icon:"•",verb:e.topic}, k=GATE_KINDS[e.kind]||{};

function inkClearDemo(){
  const demoIds=new Set();
  DB.proposals=(DB.proposals||[]).filter(p=>{ if(p.demo){ demoIds.add(p.id); return false; } return true; });

  DB.events=(DB.events||[]).filter(e=>!e.demo && !demoIds.has(e.proposalId));
  DB.conversations=(DB.conversations||[]).filter(c=>!String(c.id).startsWith("demo-ink-"));

}

/* ============================================================
   THE KNOWLEDGE GRAPH (🕸️) — concepts as living nodes.
   A force-directed map of your ideas: top concepts repel and cluster,
   linked by how often they co-occur, sized by importance. Click a node
   to open the conversations where the idea lives, and jump to its chapter.
   (v1: concept graph. Roadmap: timeline slider, realization/question/
   project/person node types, labeled relationships, memory trails.)
   ============================================================ */
const KG_CATCOLOR={consciousness:"#a78bfa",mind:"#c084fc",spiritual:"#f0abfc",growth:"#39d98a",philosophy:"#9ecbff",inkling:"#39d98a",worldweaver:"#f0abfc",ee:"#fbbf24",code:"#39d98a",chain:"#fbbf24",ai:"#a78bfa",creative:"#f0abfc",business:"#ffd166",future:"#7dd3fc",science:"#22d3ee",other:"#9ecbff",
  project:"#ff8a5b",person:"#f0abfc",tech:"#22d3ee",realization:"#ffd166",question:"#9ecbff"};
function buildConceptGraph(){
  const convs=(DB.conversations||[]);
  const freq={}, coocc={}, byConcept={};
  convs.forEach(c=>{ const cs=[...new Set(canonConcepts(c))];
    cs.forEach(x=>{ freq[x]=(freq[x]||0)+1; (byConcept[x]=byConcept[x]||[]).push(c); });
    for(let i=0;i<cs.length;i++)for(let j=i+1;j<cs.length;j++){ const k=cs[i]<cs[j]?cs[i]+""+cs[j]:cs[j]+""+cs[i]; coocc[k]=(coocc[k]||0)+1; } });
  const top=Object.keys(freq).filter(x=>freq[x]>=2).sort((a,b)=>freq[b]-freq[a]).slice(0,60);
  const set=new Set(top), fmax=Math.max(1,...top.map(x=>freq[x]));
  const nodes=top.map(x=>({ id:x, label:titleCase(x), w:freq[x], r:6+16*Math.sqrt(freq[x]/fmax),
    cat:libCatOf({anchor:x,threads:[],convs:byConcept[x]||[]}),
    firstAt:Math.min(...(byConcept[x]||[]).map(c=>c.at||Infinity)), type:"concept" }));
  const TYPES=[ {type:"project",field:"projects",emoji:"🔨",cap:15}, {type:"person",field:"people",emoji:"👤",cap:12},
    {type:"tech",field:"technologies",emoji:"🛠",cap:12}, {type:"realization",field:"realizations",emoji:"💡",cap:15},
    {type:"question",field:"questions",emoji:"❓",cap:12} ];
  TYPES.forEach(T=>{ const byLower={};
    convs.forEach(c=>{ const arr=(c.extract&&c.extract[T.field])||[]; const seen=new Set();
      arr.forEach(x=>{ const k=String(x).trim(); if(!k)return; const lk=k.toLowerCase(); if(seen.has(lk))return; seen.add(lk);
        byLower[lk]=byLower[lk]||{label:k,convs:[]}; byLower[lk].convs.push(c); if(k.length<byLower[lk].label.length) byLower[lk].label=k; }); });
    const items=Object.entries(byLower).map(([lk,v])=>({lk,label:v.label,convs:v.convs,count:v.convs.length})).sort((a,b)=>b.count-a.count).slice(0,T.cap);
    const cmax=Math.max(1,...items.map(it=>it.count));
    items.forEach(it=>{ const id=T.type+"|"+it.lk; nodes.push({ id, label:T.emoji+" "+it.label.slice(0,26), w:it.count, r:5+8*Math.sqrt(it.count/cmax), cat:T.type, type:T.type, firstAt:Math.min(...it.convs.map(c=>c.at||Infinity)) }); byConcept[id]=it.convs; }); });
  const ats=(DB.conversations||[]).map(c=>c.at||0).filter(Boolean);
  const tmin=ats.length?Math.min(...ats):0, tmax=ats.length?Math.max(...ats):Date.now();
  let edges=[]; Object.entries(coocc).forEach(([k,v])=>{ const [a,b]=k.split(""); if(set.has(a)&&set.has(b)&&v>=1) edges.push({a,b,w:v}); });
  edges=edges.sort((p,q)=>q.w-p.w).slice(0,240);
  return { nodes, edges, byConcept, fmax, tmin, tmax };
}
// Memory trail: the connected ideas that led up to a node, earliest first.
function traceTrail(g, key){
  const el=document.getElementById("kgInfo"); if(!el) return;
  const byId={}; g.nodes.forEach(n=>byId[n.id]=n);
  const start=byId[key]; if(!start){ el.style.display="none"; return; }
  const adj={}; g.edges.forEach(e=>{ (adj[e.a]=adj[e.a]||[]).push(e.b); (adj[e.b]=adj[e.b]||[]).push(e.a); });
  const seen=new Set([key]), q=[key]; while(q.length){ const x=q.shift(); (adj[x]||[]).forEach(y=>{ if(!seen.has(y)){ seen.add(y); q.push(y); } }); }
  const comp=[...seen].map(k=>byId[k]).filter(Boolean);
  const before=comp.filter(n=>(n.firstAt||0)<=(start.firstAt||0)).sort((a,b)=>(a.firstAt||0)-(b.firstAt||0));
  const led=before.length>1?before:comp.sort((a,b)=>(a.firstAt||0)-(b.firstAt||0));
  const parts=[]; led.forEach((n,i)=>{
    if(i){ const rel=edgeRel(led[i-1].id, n.id); parts.push(`<span style="color:var(--dim);font-size:11px"> —${rel?esc(rel)+" ":""}→ </span>`); }
    parts.push(`<span onclick="go({name:'graph',focusConcept:'${attrJs(n.id)}'})" style="cursor:pointer;color:${n===start?'#fff':(KG_CATCOLOR[n.cat]||'#9ecbff')};font-weight:${n===start?800:600}">${esc(n.label)}</span>`);
  });
  el.innerHTML=`<div class="panel" style="margin:0;background:rgba(8,12,22,.97)">
    <div style="display:flex;justify-content:space-between;gap:8px;align-items:baseline">
      <span class="nn" style="color:${KG_CATCOLOR[start.cat]||'#9ecbff'}">🧵 Memory trail · ${esc(start.label)}</span>
      <button class="back" style="margin:0" onclick="var e=document.getElementById('kgInfo');if(e)e.style.display='none';window.__kgTrail=null">✕</button></div>
    <div class="hint" style="margin:6px 0 0">How this grew — connected ideas, earliest first:</div>
    <div style="margin-top:6px;line-height:1.9;font-size:13px">${parts.join("")}</div>
    <div class="hint" style="margin-top:6px">Click a concept above to jump to it · tap the node again to also spread its conversations.</div>
  </div>`;
  el.style.display="block"; window.__kgTrail=seen;
}
function kgTypePills(g){
  if(!window.__kgHide) window.__kgHide=new Set(["realization","question"]);
  const counts={}; g.nodes.forEach(n=>{ const t=n.type||"concept"; counts[t]=(counts[t]||0)+1; });
  const defs=[["concept","🔷 Concepts"],["project","🔨 Projects"],["person","👤 People"],["tech","🛠 Tech"],["realization","💡 Realizations"],["question","❓ Questions"]];
  return defs.filter(([t])=>counts[t]).map(([t,label])=>{ const col=KG_CATCOLOR[t]||"#9ecbff", on=!window.__kgHide.has(t);
    return `<button onclick="kgToggleType('${t}',this)" style="opacity:${on?1:0.4};cursor:pointer;border-radius:999px;padding:4px 11px;font:800 10px system-ui;border:1px solid ${col}66;background:${col}22;color:${col}">${label} ${counts[t]}</button>`; }).join("");
}
function kgToggleType(t, btn){ if(!window.__kgHide) window.__kgHide=new Set(); if(window.__kgHide.has(t)) window.__kgHide.delete(t); else window.__kgHide.add(t); if(btn) btn.style.opacity=window.__kgHide.has(t)?"0.4":"1"; }
function renderGraph(){
  if(!(DB.conversations||[]).length){ app.innerHTML=chrome(`<h1>🕸️ Knowledge Graph</h1><div class="empty">No conversations yet.<br><span style="opacity:.8">Import your ChatGPT history (📥 Imports) — your concepts become a living graph here.</span></div>`,"graph"); return; }
  const g=buildConceptGraph();
  if(!g.nodes.length){ app.innerHTML=chrome(`<h1>🕸️ Knowledge Graph</h1><div class="empty">Not enough shared concepts yet.<br><span style="opacity:.8">Import more conversations (or run ✨ Improve summaries) and they'll link up here.</span></div>`,"graph"); return; }
  app.innerHTML=chrome(
    `<h1>🕸️ Knowledge Graph</h1>
     <p class="sub">Walking through your mind — every concept a living node. <b>Click a concept</b> to spread out the conversations inside it; <b>click a conversation</b> (the ringed endpoints) to open its Story. Drag to rearrange.</p>
     <div style="display:flex;gap:8px;align-items:center;margin:0 0 10px">
       <input id="kgSearch" placeholder="Search a concept…" oninput="window.__kgSearch=(this.value||'').toLowerCase()" style="flex:1;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px 11px;font:600 12px system-ui">
       <span class="hint" style="margin:0">${g.nodes.length} nodes · ${g.edges.length} links</span>
     </div>
     <div style="display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px">${kgTypePills(g)}</div>
     <div style="position:relative;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:radial-gradient(900px 500px at 50% 30%,rgba(90,70,180,.15),transparent 60%),#05070e">
       <canvas id="kgraph" style="display:block;width:100%;height:60vh;cursor:grab"></canvas>
       <div id="kgInfo" style="position:absolute;left:12px;right:12px;bottom:12px;display:none"></div>
     </div>
     <div style="display:flex;align-items:center;gap:10px;margin:12px 2px 0">
       <button id="kgPlay" class="back" style="margin:0" onclick="kgTogglePlay(${g.tmin},${g.tmax})">▶ Watch it grow</button>
       <input id="kgTime" type="range" min="${g.tmin}" max="${g.tmax}" value="${g.tmax}" step="86400000"
         oninput="window.__kgCutoff=+this.value; kgStopPlay(); updateKgDate()" style="flex:1">
       <span id="kgDate" class="hint" style="margin:0;min-width:96px;text-align:right">all time</span>
     </div>
     <div class="hint" style="margin-top:8px">Move the timeline to reveal only the ideas that existed up to that point · node size = importance · color = category.</div>`, "graph");
  window.__kgFocus = (view && view.focusConcept) || null;
  setTimeout(()=>startGraph(g), 30);
}
function startGraph(g){
  const canvas=document.getElementById("kgraph"); if(!canvas) return;
  const dpr=window.devicePixelRatio||1, ctx=canvas.getContext("2d");
  const size=()=>{ const r=canvas.getBoundingClientRect(); canvas.width=r.width*dpr; canvas.height=r.height*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); return r; };
  let R=size();
  const concepts=g.nodes; concepts.forEach(n=>{ n.kind="concept"; n.key=n.id; });
  concepts.forEach((n,i)=>{ const a=i/concepts.length*Math.PI*2; n.x=R.width/2+Math.cos(a)*(120+Math.random()*80); n.y=R.height/2+Math.sin(a)*(90+Math.random()*60); n.vx=0; n.vy=0; });
  let convNodes=[], nodes=[], edges=[], byKey={}, adj={}; const expanded=new Set();
  function rebuild(){
    nodes=concepts.concat(convNodes);
    edges=g.edges.concat(convNodes.map(cn=>({a:cn.parent,b:cn.key,w:2,cx:true})));
    byKey={}; nodes.forEach(n=>byKey[n.key]=n);
    adj={}; edges.forEach(e=>{ (adj[e.a]=adj[e.a]||new Set()).add(e.b); (adj[e.b]=adj[e.b]||new Set()).add(e.a); });
  }
  function toggle(cid){ const parent=byKey[cid]; if(!parent||parent.kind!=="concept") return;
    if(expanded.has(cid)) expanded.delete(cid);
    else { expanded.add(cid); (g.byConcept[cid]||[]).slice(0,10).forEach((c,i)=>{ const key=cid+"|"+c.id; if(convNodes.some(x=>x.key===key)) return;
      const a=i/10*Math.PI*2; convNodes.push({ kind:"conv", key, convId:c.id, conv:c, label:(c.title||"Untitled").slice(0,22), r:5, cat:parent.cat, parent:cid, firstAt:c.at||0, x:parent.x+Math.cos(a)*55, y:parent.y+Math.sin(a)*55, vx:0, vy:0 }); }); }
    convNodes=convNodes.filter(cn=>expanded.has(cn.parent)); rebuild();
  }
  rebuild();
  window.__kg={ toggle, nodes:()=>nodes, expanded:()=>[...expanded] };
  window.__kgSearch=""; window.__kgCutoff=g.tmax; let drag=null, hover=null, sel=null, downNode=null, downXY=null, moved=false;
  const at=ev=>{ const r=canvas.getBoundingClientRect(); return {x:ev.clientX-r.left, y:ev.clientY-r.top}; };
  const pick=p=>{ let best=null,bd=1e9; nodes.forEach(n=>{ const d=(n.x-p.x)**2+(n.y-p.y)**2; const rr=Math.max(12,n.r+7); if(d<rr*rr&&d<bd){bd=d;best=n;} }); return best; };
  canvas.onmousedown=e=>{ const p=at(e), n=pick(p); if(n){ drag=n; downNode=n; downXY=p; moved=false; n.fixed=true; canvas.style.cursor="grabbing"; } };
  canvas.onmousemove=e=>{ const p=at(e); if(drag){ if(Math.hypot(p.x-downXY.x,p.y-downXY.y)>4) moved=true; drag.x=p.x; drag.y=p.y; drag.vx=drag.vy=0; } else { hover=pick(p); canvas.style.cursor=hover?"pointer":"grab"; } };
  canvas.onmouseup=()=>{ if(!drag) return; drag.fixed=false; const n=downNode; drag=null; downNode=null; canvas.style.cursor="grab";
    if(n && !moved){ sel=n; if(n.kind==="conv") openConv(n.convId); else { toggle(n.key); traceTrail(g, n.key); } } };
  canvas.onmouseleave=()=>{ if(drag){ drag.fixed=false; drag=null; downNode=null; } hover=null; };
  if(window.__kgFocus){ const fk=window.__kgFocus; window.__kgFocus=null; if(byKey[fk]){ toggle(fk); sel=byKey[fk]; const p=byKey[fk]; if(p){ p.x=R.width/2; p.y=R.height*0.42; } } else { window.__kgSearch=fk; const inp=document.getElementById("kgSearch"); if(inp) inp.value=fk; } }
  function step(){
    if(!document.getElementById("kgraph")) return;
    const M=nodes.length;
    for(let i=0;i<M;i++){ const a=nodes[i]; if(a.fixed) continue;
      for(let j=0;j<M;j++){ if(i===j) continue; const b=nodes[j]; const dx=a.x-b.x, dy=a.y-b.y; const d2=dx*dx+dy*dy+0.01, d=Math.sqrt(d2); const f=(a.kind==="conv"||b.kind==="conv"?650:1600)/d2; a.vx+=dx/d*f; a.vy+=dy/d*f; }
      const g0=a.kind==="conv"?0.0004:0.0010*(0.5+a.w/g.fmax); a.vx+=(R.width/2-a.x)*g0; a.vy+=(R.height/2-a.y)*g0;
    }
    edges.forEach(e=>{ const a=byKey[e.a], b=byKey[e.b]; if(!a||!b) return; const dx=b.x-a.x, dy=b.y-a.y, dist=Math.sqrt(dx*dx+dy*dy)||1, tgt=e.cx?42:72, f=(dist-tgt)*(e.cx?0.01:0.0022)*Math.min(3,e.w);
      if(!a.fixed){ a.vx+=dx/dist*f; a.vy+=dy/dist*f; } if(!b.fixed){ b.vx-=dx/dist*f; b.vy-=dy/dist*f; } });
    nodes.forEach(n=>{ if(n.fixed) return; n.vx*=0.84; n.vy*=0.84; n.x+=n.vx; n.y+=n.vy; n.x=Math.max(n.r,Math.min(R.width-n.r,n.x)); n.y=Math.max(n.r,Math.min(R.height-n.r,n.y)); });
    ctx.clearRect(0,0,R.width,R.height);
    const q=window.__kgSearch||"", anyQ=!!q;
    const m=n=> q && (n.kind==="concept"? n.id.includes(q) : n.label.toLowerCase().includes(q));
    const cut=window.__kgCutoff||g.tmax, hide=window.__kgHide||new Set();
    const vis=n=>{ if((n.firstAt||0)>cut) return false; if(n.kind==="conv"){ const p=byKey[n.parent]; return p ? (!hide.has(p.type||"concept")&&(p.firstAt||0)<=cut) : true; } return !hide.has(n.type||"concept"); };
    const lit=n=> !anyQ ? true : (m(n) || (adj[n.key]&&[...adj[n.key]].some(k=>{ const nb=byKey[k]; return nb&&m(nb); })));
    edges.forEach(e=>{ const a=byKey[e.a], b=byKey[e.b]; if(!a||!b||!vis(a)||!vis(b)) return; const on=!anyQ||m(a)||m(b)||(sel&&(a===sel||b===sel));
      ctx.strokeStyle=e.cx?(on?"rgba(158,203,255,.4)":"rgba(158,203,255,.09)"):(on?"rgba(150,130,255,"+Math.min(.5,.1+.08*e.w)+")":"rgba(150,130,255,.04)");
      ctx.lineWidth=e.cx?1:(on?Math.min(3,0.6+e.w*0.4):0.6); ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); });
    nodes.forEach(n=>{ if(!vis(n)) return; const hi=(n===hover||n===sel), L=lit(n), col=KG_CATCOLOR[n.cat]||"#9ecbff";
      ctx.globalAlpha=L?1:0.16;
      if(n.kind==="conv"){
        ctx.fillStyle=hi?"#fff":col; ctx.beginPath(); ctx.arc(n.x,n.y,hi?6:4.5,0,7); ctx.fill();
        ctx.strokeStyle=col; ctx.lineWidth=1.3; ctx.beginPath(); ctx.arc(n.x,n.y,hi?9:7,0,7); ctx.stroke();
        if(hi){ ctx.fillStyle="#eaf2ff"; ctx.font="700 11px system-ui"; ctx.textAlign="center"; ctx.fillText(n.label+" →", n.x, n.y-12); }
      } else {
        const gg=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,n.r*1.9); gg.addColorStop(0,col); gg.addColorStop(1,"rgba(5,7,14,0)");
        ctx.fillStyle=gg; ctx.beginPath(); ctx.arc(n.x,n.y,n.r*1.9,0,7); ctx.fill();
        ctx.fillStyle=hi?"#fff":col; ctx.beginPath(); ctx.arc(n.x,n.y,n.r*(hi?0.95:0.7),0,7); ctx.fill();
        if(expanded.has(n.key)){ ctx.strokeStyle="rgba(255,255,255,.55)"; ctx.lineWidth=1.4; ctx.beginPath(); ctx.arc(n.x,n.y,n.r*1.15,0,7); ctx.stroke(); }
        if(n.r>10||hi){ ctx.fillStyle="rgba(234,242,255,"+(L?0.95:0.3)+")"; ctx.font=(hi?"800 ":"600 ")+Math.round(Math.min(15,9+n.r*0.22))+"px system-ui"; ctx.textAlign="center"; ctx.fillText(n.label, n.x, n.y-n.r-4); }
      }
      ctx.globalAlpha=1;
    });
    requestAnimationFrame(step);
  }
  window.addEventListener("resize",()=>{ R=size(); });
  step();
}
function showGraphNode(n,g){
  const el=document.getElementById("kgInfo"); if(!el) return;
  const convs=(g.byConcept[n.id]||[]).slice().sort((a,b)=>(b.messageCount||0)-(a.messageCount||0));
  const rows=convs.slice(0,8).map(c=>`<button class="qrow" style="margin:0 0 5px" onclick="openChapterForConv('${c.id}')"><span class="dot done"></span><span><span class="qt">${esc(c.title)}</span> <span style="color:var(--dim);font-weight:600">· ${fmtDate(c.at)}</span></span></button>`).join("");
  const neigh=g.edges.filter(e=>e.a===n.id||e.b===n.id).sort((a,b)=>b.w-a.w).map(e=>e.a===n.id?e.b:e.a).slice(0,8);
  el.innerHTML=`<div class="panel" style="margin:0;background:rgba(8,12,22,.97)">
    <div style="display:flex;justify-content:space-between;gap:8px;align-items:baseline">
      <span class="nn" style="color:${KG_CATCOLOR[n.cat]||'#9ecbff'}">🔷 ${esc(n.label)}</span>
      <button class="back" style="margin:0" onclick="var e=document.getElementById('kgInfo');if(e)e.style.display='none'">✕</button></div>
    <div class="hint" style="margin:4px 0 0">importance ${n.w} · in ${convs.length} conversation${convs.length===1?"":"s"} · ${neigh.length} linked concept${neigh.length===1?"":"s"}</div>
    ${neigh.length?`<div class="lab" style="margin-top:8px">Connected concepts</div><div class="links">${neigh.map(x=>`<span class="lk">${esc(titleCase(x))}</span>`).join("")}</div>`:""}
    <div class="lab" style="margin-top:8px">Conversations</div>
    <div style="max-height:26vh;overflow:auto">${rows||"<span class='hint'>—</span>"}</div>
  </div>`;
  el.style.display="block";
}
function openChapterForConv(id){
  const book=buildBook(); const ch=book.chapters.find(c=>c.convs.some(x=>x.id===id));
  if(ch) openChapterFromLibrary(ch.n); else openConvInGalaxy(id);
}
/* ---- ONE CONVERSATION: read it + have Inkling elaborate (uses the fuller excerpt) ---- */
function openConv(id){ go({name:"conv", convId:id}); }
let _elabId=null;
async function elaborateConv(id){
  const c=(DB.conversations||[]).find(x=>x.id===id); if(!c) return;
  if(!inkToken()){ _elabId="__signin"; renderConvDetail(id); return; }
  _elabId=id; renderConvDetail(id);
  const msg=`Here is one of my past conversations. Elaborate on what I was really exploring — the questions I was asking, the ideas at play, and how they connect to my thinking about consciousness, AI, and the mind. Write 2–3 thoughtful paragraphs grounded ONLY in the text below; where I was uncertain, preserve the uncertainty. Do not invent.\n\nTitle: ${c.title}\n\n${c.excerpt||c.summary||""}`;
  const context="You are Inkling, a thoughtful mentor helping the user understand their own past conversations. Ground everything strictly in the provided text; never invent facts or events. Second person, warm, precise, curious. No headings, no lists.";
  let text=null; try{ text=await chatLLM(msg, context); }catch(e){ text=null; }
  _elabId=null;
  if(text){ DB.elaborations=DB.elaborations||{}; DB.elaborations[id]=text; persist(); }
  else { _elabId="__fail"; }
  renderConvDetail(id);
}
function renderConvDetail(id){
  const c=(DB.conversations||[]).find(x=>x.id===id);
  if(!c){ go({name:"storybook"}); return; }
  const dialogue = c.excerpt
    ? c.excerpt.split("\n").filter(Boolean).map(line=>{ const me=/^Me:/.test(line); return `<div style="margin:0 0 8px;padding:9px 12px;border-radius:12px;max-width:88%;${me?'background:rgba(88,166,255,.14);border:1px solid rgba(88,166,255,.3);margin-left:auto':'background:var(--panel);border:1px solid var(--line)'}"><span class="hint" style="margin:0 0 2px;display:block">${me?'You':'Inkling / AI'}</span><span style="color:#e6edf3;line-height:1.55">${esc(line.replace(/^(Me:|AI:)\s*/,""))}</span></div>`; }).join("")
    : `<div class="hint">Only a short summary was saved for this one. Re-import your export (📥 Imports) to bring in the fuller conversation.</div><p style="color:#dbe4ee;line-height:1.6;margin-top:8px">${esc(c.summary||"")}</p>`;
  const el=(DB.elaborations||{})[id];
  let elab;

  const rf=DB.refine[qid]||{had:[],new:[]};

/* ---- PROVENANCE SPINE (Phase 0): ground each concept to its source snippet ---- */
// A readable snippet around a match — the sentence it lives in, trimmed.
function snippetAround(text, idx, len){
  const s=String(text);
  let a=idx; while(a>0 && !/[.!?\n]/.test(s[a-1]) && idx-a<160) a--;
  let b=idx+len; while(b<s.length && !/[.!?\n]/.test(s[b]) && b-idx<160) b++;
  let snip=s.slice(a,Math.min(b+1,s.length)).trim().replace(/\s+/g," ");
  if(a>0) snip="…"+snip;
  if(b<s.length-1) snip=snip+"…";
  return snip.slice(0,220);
}
// For each concept, find the message(s) that mention it + a verbatim snippet.
// Returns { conceptLower: [{ i, role, snippet }] } — the concept's provenance.
function groundConcepts(concepts, messages){
  const prov={};
  (concepts||[]).forEach(label=>{
    const key=String(label).toLowerCase().trim(); if(!key) return;
    const hits=[];
    (messages||[]).forEach((m,i)=>{
      const text=String(m.markdown||m.text||"");
      const idx=text.toLowerCase().indexOf(key);
      if(idx>=0) hits.push({ i, role:m.role, snippet:snippetAround(text,idx,key.length) });
    });
    if(hits.length) prov[key]=hits.slice(0,3);
  });
  return prov;
}
// The best source snippet for a concept inside one conversation (stored, or grounded on the fly).
function conceptSnippet(conv, conceptLower){
  const stored=(conv.provenance||{})[conceptLower];
  if(stored && stored.length) return stored[0].snippet;
  if(Array.isArray(conv.messages) && conv.messages.length){
    const g=groundConcepts([conceptLower], conv.messages)[conceptLower];
    if(g && g.length) return g[0].snippet;
  }
  return null;
}

/* ---- STORYBOOK: the imported conversations, narrated as chapters by theme ---- */
function clusterConvs(convs){
  const n=convs.length;
  const keys=convs.map(c=>new Set((c.concepts||[]).map(x=>x.toLowerCase())));
  const parent=convs.map((_,i)=>i);
  const find=x=>{ while(parent[x]!==x){ parent[x]=parent[parent[x]]; x=parent[x]; } return x; };
  for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){ for(const k of keys[j]){ if(keys[i].has(k)){ parent[find(i)]=find(j); break; } } }
  const groups={}; convs.forEach((c,i)=>{ const r=find(i); (groups[r]=groups[r]||[]).push(c); });
  return Object.values(groups).map(members=>{
    const counts={}; members.forEach(c=>(c.concepts||[]).forEach(x=>{ counts[x]=(counts[x]||0)+1; }));
    const theme=Object.keys(counts).sort((a,b)=>counts[b]-counts[a])[0]||"Notes";
    const shared=Object.keys(counts).filter(k=>counts[k]>=2).sort((a,b)=>counts[b]-counts[a]);
    return { theme, members, shared };
  }).sort((a,b)=>b.members.length-a.members.length);
}

/* ---- LIVING STORY: revisit old chapters as understanding deepens ----
   A concept met in an early conversation, then met again later alongside NEW
   ideas, is understanding that grew. We surface that then→now shift, grounded in
   your own words. Nothing is rewritten; the old chapters stay — this is the diff. */
function deepenings(){
  const convs=(DB.conversations||[]).slice().sort((a,b)=>a.at-b.at); // oldest first
  if(convs.length<2) return [];
  const byConcept={};
  convs.forEach(c=>{ const seen=new Set();
    (c.concepts||[]).forEach(x=>{ const k=String(x).toLowerCase().trim(); if(!k||seen.has(k))return; seen.add(k);
      (byConcept[k]=byConcept[k]||[]).push(c); }); });
  const out=[];
  Object.keys(byConcept).forEach(k=>{
    const list=byConcept[k]; if(list.length<2) return;
    const first=list[0], recent=list[list.length-1];
    if(recent.at===first.at) return;
    const then=new Set((first.concepts||[]).map(x=>String(x).toLowerCase()).filter(x=>x!==k));
    const nowCount={};
    list.slice(1).forEach(c=>(c.concepts||[]).forEach(x=>{ const kk=String(x).toLowerCase(); if(kk!==k && !then.has(kk)) nowCount[kk]=(nowCount[kk]||0)+1; }));
    const gained=Object.keys(nowCount).sort((a,b)=>nowCount[b]-nowCount[a]);
    if(!gained.length) return; // no real deepening — skip
    const label=(first.concepts||[]).find(x=>String(x).toLowerCase()===k)||k;
    const spanDays=Math.max(1,Math.round((recent.at-first.at)/864e5));
    out.push({ key:k, label, first, recent, list, count:list.length,
      then:[...then], gained, spanDays, score:gained.length*2+list.length+Math.min(6,spanDays/20) });
  });
  return out.sort((a,b)=>b.score-a.score);
}
function deepeningCard(d, hero){
  const thenSnip=conceptSnippet(d.first, d.key), nowSnip=conceptSnippet(d.recent, d.key);
  const thenNb=d.then.slice(0,4), gained=d.gained.slice(0,5);
  const q=s=>s?` <span style="color:var(--dim)">“${esc(s)}”</span>`:"";
  const btns=`<div style="margin-top:10px;display:flex;gap:7px;flex-wrap:wrap">

  if(hero){
    return `<div class="panel" style="border-color:rgba(57,217,138,.4);background:rgba(57,217,138,.05)">
      <h3 style="font:800 12px system-ui;color:#39d98a;margin:0 0 8px;text-transform:uppercase;letter-spacing:.04em">🌱 Inkling revisits · ${esc(d.label)}</h3>

/* ---- THE BOOK: your whole history as a long-form, chapter-by-chapter read ----
   Every recurring theme becomes a chapter; conversations are its pages. Ordered by
   when each theme first appeared, so the book follows your journey through time. */
function titleCase(s){ return String(s||"").replace(/\b[a-z]/g,m=>m.toUpperCase()); }
// --- concept cleanup: drop junk, merge synonyms to a canonical head term ---
const CONCEPT_JUNK=new Set(["data home","home eugeneous","phone computer","usr lib","system out","eugeneous eugeneousvm","internal modules","data data","eugeneousvm","https termux","null undefined","system system"]);
const CONCEPT_PRIMARY=["pixel prodigy","entity software","operating system","smart contract","machine learning","neural network","language model","knowledge graph","unity","solana","blockchain","ethereum","python","javascript","consciousness","quantum","cosmic","electronics","transistor","voltage","robot","website","backend","frontend","game","physics","philosophy","energy"];
function canonConcept(x){
  const s=String(x||"").toLowerCase().trim(); if(!s||CONCEPT_JUNK.has(s)) return null;
  for(const p of CONCEPT_PRIMARY){ if(s===p||s.includes(" "+p)||s.includes(p+" ")||s.startsWith(p)||s.endsWith(p)) return p; }
  return s;
}
function canonConcepts(c){ const out=[], seen=new Set(); (c.concepts||[]).forEach(x=>{ const k=canonConcept(x); if(k&&!seen.has(k)){ seen.add(k); out.push(k); } }); return out; }
// --- Parts: group the many chapters into a few domains ---
const BOOK_PARTS=[
  { id:"build", name:"Building & Product", kw:["pixel prodigy","entity software","app","website","portfolio","backend","frontend","product","startup","launch","deploy","saas","platform","landing"] },
  { id:"chain", name:"Blockchain & Crypto", kw:["solana","smart contract","blockchain","ethereum","token","crypto","wallet","web3","nft","defi","mint"] },
  { id:"ai", name:"AI & Machine Learning", kw:["machine learning","neural network","language model","ai","model","training","llm","gpt","agent","prompt","embedding","gradient"] },
  { id:"game", name:"Games & 3D Worlds", kw:["unity","game","vr","3d","shader","animation","sentis","render","godot","unreal"] },
  { id:"code", name:"Systems & Code", kw:["python","javascript","operating system","linux","code","programming","script","database","server","api","algorithm","memory","cpu"] },
  { id:"hw", name:"Electronics & Hardware", kw:["electronics","voltage","transistor","circuit","arduino","raspberry","sensor","robot","motor","plc"] },
  { id:"cosmos", name:"Mind, Science & Cosmos", kw:["consciousness","quantum","cosmic","energy","physics","universe","light","mind","awareness","philosophy","reality","time"] },
  { id:"life", name:"Learning & Life", kw:["learning","study","habit","goal","health","psychology","note","finance","tax"] },
];
function partOf(ch){
  const hay=(ch.anchor+" "+ch.threads.join(" ")).toLowerCase();
  let best=null, score=0;
  BOOK_PARTS.forEach(p=>{ let s=0; p.kw.forEach(k=>{ if(hay.includes(k)) s++; }); if(s>score){ score=s; best=p; } });
  return best ? best.id : "other";
}
function currentGroupMode(){ return DB.groupMode==="semantic" ? "semantic" : "keyword"; }
function setGroupMode(m){ if(_narrAll.running||_improveRun.running) return; DB.groupMode=(m==="semantic"?"semantic":"keyword"); persist(); renderStorybook(); }
function groupModeToggle(){
  const m=currentGroupMode();
  const pill=(id,label,desc)=>`<button onclick="setGroupMode('${id}')" title="${desc}" style="cursor:pointer;border-radius:999px;padding:5px 12px;font:800 11px system-ui;border:1px solid ${id===m?'rgba(158,203,255,.8)':'var(--line)'};background:${id===m?'rgba(158,203,255,.2)':'transparent'};color:${id===m?'#cfe4ff':'var(--dim)'}">${label}</button>`;
  return `<div style="margin:2px 0 6px;text-align:center"><span class="hint" style="margin:0 6px 0 0">Group chapters by</span>`+
    pill('keyword','🔑 Keywords','Group by a shared concept — exact and fast')+
    pill('semantic','🧭 Meaning','Group by overall similarity — the local vector service')+`</div>`;
}
// Keyword grouping: anchor = a shared concept (fast, exact).
function groupKeyword(convs){
  const cc=new Map(); convs.forEach(c=>cc.set(c, canonConcepts(c)));
  const cf={}; convs.forEach(c=>cc.get(c).forEach(x=>cf[x]=(cf[x]||0)+1));
  const anchor=c=>{ const cs=cc.get(c); for(const x of cs){ if((cf[x]||0)>=3) return x; } return cs[0]||null; };
  const groups={}; convs.forEach(c=>{ const a=anchor(c); const key=a==null?"__brief":a; (groups[key]=groups[key]||[]).push(c); });
  const brief=[], chapters=[];
  Object.entries(groups).forEach(([k,v])=>{ if(k==="__brief"||v.length<2) brief.push(...v); else chapters.push({ anchor:k, convs:v.slice() }); });
  chapters.forEach(ch=>{ const counts={}; ch.convs.forEach(c=>cc.get(c).forEach(x=>{ if(x!==ch.anchor) counts[x]=(counts[x]||0)+1; }));
    ch.threads=Object.keys(counts).filter(k=>counts[k]>=2).sort((a,b)=>counts[b]-counts[a]).slice(0,6); });
  return { chapters, brief };
}
// --- local VECTOR SERVICE: TF-IDF vectors + cosine (kNN) → group by MEANING ---
function stemTok(w){ if(w.length<=4) return w; const s=w.replace(/(ational|ization|iveness|ousness|fulness|ing|edly|ies|ied|ily|ness| ments|ment|tions|tion|sions|sion|ers|ors|est|ed|es|s)$/,""); return s.length>=3?s:w; }
function convTF(c){ const tf={}; const add=(t,w)=>{ const s=stemTok(String(t)); if(s&&s.length>2) tf[s]=(tf[s]||0)+w; };
  cgTok((c.title||"")+" "+(c.summary||"")).forEach(t=>add(t,1));
  canonConcepts(c).forEach(t=>String(t).split(/\s+/).forEach(w=>{ if(w) add(w,2); }));
  return tf; }
function groupSemantic(convs){
  const tfs=convs.map(convTF), N=convs.length, df={};
  tfs.forEach(tf=>Object.keys(tf).forEach(t=>df[t]=(df[t]||0)+1));
  const vecs=tfs.map(tf=>{ const v={}; let n=0; for(const t in tf){ const idf=Math.log((N+1)/((df[t]||0)+1))+1; const w=tf[t]*idf; v[t]=w; n+=w*w; } n=Math.sqrt(n)||1; for(const t in v) v[t]/=n; return v; });
  const cos=(a,b)=>{ const [x,y]=Object.keys(a).length<Object.keys(b).length?[a,b]:[b,a]; let s=0; for(const t in x){ if(y[t]!==undefined) s+=x[t]*y[t]; } return s; };
  // k-nearest-neighbour edges (adapts to the data's scale better than a fixed cutoff)
  const K=6, FLOOR=0.02, MAX=30, edges=[];
  for(let i=0;i<N;i++){ const sims=[];
    for(let j=0;j<N;j++){ if(j===i) continue; const s=cos(vecs[i],vecs[j]); if(s>FLOOR) sims.push([s,j]); }
    sims.sort((a,b)=>b[0]-a[0]); sims.slice(0,K).forEach(([s,j])=>edges.push([s,i,j])); }
  edges.sort((a,b)=>b[0]-a[0]);
  const par=convs.map((_,i)=>i), sz=convs.map(()=>1), find=x=>{ while(par[x]!==x){ par[x]=par[par[x]]; x=par[x]; } return x; };
  edges.forEach(([s,i,j])=>{ const a=find(i),b=find(j); if(a!==b && sz[a]+sz[b]<=MAX){ par[a]=b; sz[b]+=sz[a]; } });
  const byRoot={}; convs.forEach((c,i)=>{ const r=find(i); (byRoot[r]=byRoot[r]||[]).push(i); });
  const brief=[], chapters=[];
  Object.values(byRoot).forEach(idxs=>{ if(idxs.length<2){ idxs.forEach(i=>brief.push(convs[i])); return; }
    const rank={}; idxs.forEach(i=>(convs[i].concepts||[]).forEach(x=>{ const k=canonConcept(x); if(k) rank[k]=(rank[k]||0)+1; }));
    let terms=Object.keys(rank).sort((a,b)=>rank[b]-rank[a]);
    if(!terms.length){ // fall back to centroid vector terms
      const cent={}; idxs.forEach(i=>{ for(const t in vecs[i]) cent[t]=(cent[t]||0)+vecs[i][t]; });
      terms=Object.keys(cent).sort((a,b)=>cent[b]-cent[a]); }
    chapters.push({ anchor:terms[0]||"threads", convs:idxs.map(i=>convs[i]), threads:terms.slice(1,7) }); });
  return { chapters, brief };
}
function buildBook(){
  const convs=(DB.conversations||[]).slice();
  const g=(currentGroupMode()==="semantic" && convs.length>=6) ? groupSemantic(convs) : groupKeyword(convs);
  const chapters=g.chapters, brief=g.brief;
  chapters.forEach(ch=>{ ch.convs.sort((a,b)=>(a.at||0)-(b.at||0)); ch.title=titleCase(ch.anchor); ch.threads=ch.threads||[];
    ch.span=[ch.convs[0].at, ch.convs[ch.convs.length-1].at]; });
  const byPart={}; chapters.forEach(ch=>{ (byPart[partOf(ch)]=byPart[partOf(ch)]||[]).push(ch); });
  const nameById={}; BOOK_PARTS.forEach(p=>nameById[p.id]=p.name); nameById.other="Other Explorations";
  let parts=Object.entries(byPart).map(([id,chs])=>({ id, name:nameById[id]||"Other",
    chapters:chs.sort((a,b)=>(a.span[0]||0)-(b.span[0]||0)), first:Math.min(...chs.map(c=>c.span[0]||Infinity)) }));
  parts.sort((a,b)=>a.first-b.first);
  let n=0; parts.forEach(p=>p.chapters.forEach(ch=>ch.n=++n));
  const ordered=[].concat(...parts.map(p=>p.chapters));
  return { chapters:ordered, parts, brief:brief.sort((a,b)=>(a.at||0)-(b.at||0)), total:convs.length, mode:currentGroupMode(),
    span:[Math.min(...convs.map(c=>c.at||Infinity)), Math.max(...convs.map(c=>c.at||0))] };
}
function fmtSpan(a,b){ const A=fmtDate(a), B=fmtDate(b); return A===B?A:`${A} – ${B}`; }

function narrEntry(anchor){ const e=(DB.narration||{})[anchor]; if(!e) return null; if(typeof e.text==="string") return currentGenre()==="literary"?{text:e.text,sig:e.sig}:null; return e[currentGenre()]||null; }

    messages: Array.isArray(data.messages) ? data.messages : null,

const CG_STOP=new Set("the a an and or but if then else of to in on for with as at by from into about over under is are was were be been being do does did will would can could should may might must have has had this that these those it its i you he she they we me my your our their his her them us not no yes so just really very much many more most some any all cant dont didnt im youre lets what which who whom whose when where why how get got make made want need know think see say said tell told use used using like also thanks thank please okay sure yeah yep nope hey hi hello chatgpt gpt able way ways thing things stuff lot lots one two three first second next new good great best better help kind sort right left going go come came take took give gave put set find found feel felt look looked here there now today etc via per vs let create creating created build building built work working works given show shows based needs add added following below above example examples note step steps section part parts full".split(" "));
const CG_NOISE=new Set("http https www com net org html css json xml sql termux aarch64 sudo apt npm npx node cd mkdir chmod git cli bash sh cmd pkg pip run script log error null undefined const var function return true false def print import export div span src href png jpg svg amp lt gt nbsp quot code file files line lines output input value values type types name names usr lib bin out".split(" "));
const CG_GENERIC=new Set("app website project system page setup request conversation design guide idea ideas concept home environment portfolio platform platforms feature features version update question answer response overview explanation exploration thing user users data process method approach content result results option options info detail details".split(" "));
function cgStrip(s){ return String(s||"").replace(/```[\s\S]*?```/g," ").replace(/`[^`]*`/g," ").replace(/https?:\/\/\S+/g," ").replace(/^[#>*\-\s]+/gm," ").replace(/[*_#>|~]+/g," "); }
function cgClean(s){ return cgStrip(s).toLowerCase().replace(/[^a-z0-9+\s-]/g," ").replace(/\s+/g," ").trim(); }
function cgBase(w){ return /[a-z]/.test(w)&&/^[a-z][a-z0-9+-]*[a-z0-9]$/.test(w)&&w.length>=3&&w.length<=22&&!CG_STOP.has(w)&&!CG_NOISE.has(w); }
function cgTok(s){ return cgClean(s).split(" ").filter(cgBase); }
function cgMessages(c){
  const msgs=[];
  for(const nd of Object.values(c.mapping||{})){ const m=nd.message; if(!m||!m.content||m.content.content_type!=="text")continue;
    const role=m.author&&m.author.role; if(role!=="user"&&role!=="assistant")continue;
    const t=(m.content.parts||[]).filter(p=>typeof p==="string").join(" ").trim(); if(!t)continue;

// A richer excerpt of the actual back-and-forth (kept local; ~2k chars) so the AI
// passes have real material — not just the first message.
function cgExcerpt(msgs){
  const out=[]; let len=0;
  for(const m of msgs){ if(len>1900) break; const line=(m.role==="user"?"Me: ":"AI: ")+m.t.replace(/\s+/g," ").slice(0,340); out.push(line); len+=line.length+1; }
  return out.join("\n").slice(0,2100);
}
function cgConvText(c){
  const msgs=cgMessages(c); let user=[], asst=[], first="";
  msgs.forEach(m=>{ if(m.role==="user"){ user.push(m.t); if(!first) first=m.t; } else asst.push(m.t); });
  return { user:user.join("\n").slice(0,14000), asst:asst.join("\n").slice(0,16000), first, n:msgs.length, msgs };
}
function cgTopTerms(text){ const w=cgTok(text); const uni={}, bi={};
  for(let i=0;i<w.length;i++){ if(!CG_GENERIC.has(w[i])) uni[w[i]]=(uni[w[i]]||0)+1;
    if(i+1<w.length && w[i]!==w[i+1]) bi[w[i]+" "+w[i+1]]=(bi[w[i]+" "+w[i+1]]||0)+1; }
  return { biTop:Object.entries(bi).filter(([k,v])=>v>=2).sort((a,b)=>b[1]-a[1]).map(x=>x[0]),
           uniTop:Object.entries(uni).filter(([k,v])=>v>=2).sort((a,b)=>b[1]-a[1]).map(x=>x[0]) }; }
function cgConcepts(c, txt){ const weighted=(txt.user+"\n").repeat(3)+txt.asst; const {biTop,uniTop}=cgTopTerms(weighted);
  const tc=cgTok(c.title).filter(w=>!CG_GENERIC.has(w)); const tp=tc.slice(0,4).join(" ");
  const out=[], seen=new Set(); const add=t=>{ t=String(t||"").trim(); if(!t||t.split(" ").length>4||seen.has(t))return; seen.add(t); out.push(t); };
  biTop.slice(0,3).forEach(add); if(tp && tp.split(" ").length>=2) add(tp); tc.forEach(add);
  uniTop.forEach(t=>{ if(out.length<6) add(t); });

const cgReadText=f=>new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(r.error); r.readAsText(f); });
function cgStatus(msg){ const el=document.getElementById("cgStatus"); if(el) el.innerHTML=msg; }
// Minimal in-browser ZIP reader (reads the central directory; inflates DEFLATE via
// the native DecompressionStream). Lets you pick the export .zip directly.
async function cgZipEntries(file){
  const buf=new Uint8Array(await file.arrayBuffer());
  const dv=new DataView(buf.buffer);
  let eocd=-1;
  for(let i=buf.length-22; i>=Math.max(0,buf.length-65557); i--){ if(dv.getUint32(i,true)===0x06054b50){ eocd=i; break; } }
  if(eocd<0) throw new Error("no EOCD");
  const cdOffset=dv.getUint32(eocd+16,true), cdCount=dv.getUint16(eocd+10,true);
  const entries=[]; let p=cdOffset;
  for(let n=0;n<cdCount;n++){
    if(dv.getUint32(p,true)!==0x02014b50) break;
    const method=dv.getUint16(p+10,true), compSize=dv.getUint32(p+20,true);
    const nameLen=dv.getUint16(p+28,true), extraLen=dv.getUint16(p+30,true), commentLen=dv.getUint16(p+32,true);
    const lho=dv.getUint32(p+42,true);
    const name=new TextDecoder().decode(buf.subarray(p+46,p+46+nameLen));
    entries.push({ name, method, compSize, lho });
    p+=46+nameLen+extraLen+commentLen;
  }
  return { buf, dv, entries };
}
async function cgEntryText(buf, dv, e){
  if(dv.getUint32(e.lho,true)!==0x04034b50) throw new Error("bad local header");
  const nameLen=dv.getUint16(e.lho+26,true), extraLen=dv.getUint16(e.lho+28,true);
  const start=e.lho+30+nameLen+extraLen;
  const data=buf.subarray(start, start+e.compSize);
  if(e.method===0) return new TextDecoder().decode(data);
  const ds=new DecompressionStream("deflate-raw");
  const ab=await new Response(new Blob([data]).stream().pipeThrough(ds)).arrayBuffer();
  return new TextDecoder().decode(ab);
}
async function importChatGPT(fileList){
  const files=[...fileList]; const sources=[]; // {name, get:()=>Promise<string>}

      cgStatus(`Opening ${esc(f.name)}…`); await new Promise(r=>setTimeout(r,10));
      let z; try{ z=await cgZipEntries(f); }catch(err){ cgStatus("⚠ Couldn't read that .zip. Try unzipping it and picking the conversations-*.json files."); return; }
      z.entries.filter(e=>/(^|\/)conversations(-\d+)?\.json$/i.test(e.name)).forEach(e=>sources.push({ name:e.name, get:()=>cgEntryText(z.buf,z.dv,e) }));
    } else if(/\.json$/i.test(f.name)){

  }
  if(!sources.length){ cgStatus("No conversations found — pick your <b>chatgptconvo.zip</b> (or the <b>conversations-*.json</b> files inside it)."); return; }
  DB.conversations=DB.conversations||[];
  const byId={}; DB.conversations.forEach(c=>byId[c.id]=c); let added=0, updated=0, scanned=0;
  for(let i=0;i<sources.length;i++){
    cgStatus(`Reading ${i+1}/${sources.length} — ${esc(sources[i].name)}… <span style="color:var(--dim)">${added} new · ${updated} refreshed</span>`);
    await new Promise(r=>setTimeout(r,10));
    let arr; try{ arr=JSON.parse(await sources[i].get()); }catch(e){ continue; }
    if(!Array.isArray(arr)) arr=[arr];
    for(const c of arr){ if(!c||!c.mapping)continue; scanned++;
      const rec=cgRecord(c); const ex=byId[rec.id];
      if(ex){ // re-import: refresh the excerpt + message count; keep AI-improved summary/concepts
        ex.excerpt=rec.excerpt; ex.messageCount=rec.messageCount;
        if(!ex.aiSum){ ex.summary=rec.summary; ex.concepts=rec.concepts; }
        updated++;
      } else { byId[rec.id]=rec; DB.conversations.push(rec); added++; }
    }
    arr=null;
  }
  DB.conversations.sort((a,b)=>b.at-a.at);
  try{ persist(); }catch(e){ cgStatus("⚠ Storage got full — imported what fit."); }
  cgStatus(`✅ ${added} new · ${updated} refreshed with fuller text (${scanned} scanned). Opening your library…`);
  DB.storyView="library"; try{ persist(); }catch(e){}
  setTimeout(()=>go({name:"storybook"}), 900);
}
