/* ---- GALAXY: imported conversations as stars, clustered by shared concepts ---- */
function conceptKey(s){ return String(s||"").toLowerCase().trim(); }

function renderGalaxy(){
  const convs=(DB.conversations||[]).slice();
  if(!convs.length){
    app.innerHTML=chrome(`<h1>🌌 Galaxy</h1><div class="empty">No conversations yet.<br><span style="opacity:.8">Import a few from ChatGPT/Claude/Gemini and Save them — they become stars here.</span></div>`, "galaxy");
    return;
  }
  window.__spotlightConcept=null;
  const cc={}; convs.forEach(c=>(c.concepts||[]).forEach(x=>{ cc[x]=(cc[x]||0)+1; }));
  const topConcepts=Object.keys(cc).sort((a,b)=>cc[b]-cc[a]).slice(0,12);
  const conceptBar = topConcepts.length? `<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 12px">
      <span class="hint" style="margin:0">Pull a thread:</span>
      ${topConcepts.map(k=>`<button class="lk" style="cursor:pointer" onclick="spotlightConcept('${attrJs(k)}')">${esc(k)} <span style="opacity:.55">${cc[k]}</span></button>`).join("")}
    </div>`:"";
  app.innerHTML=chrome(
    `<h1>🌌 Your conversation galaxy</h1>
     <p class="sub">Each star is a conversation. Shared concepts cluster them — tap a star for its digest, or pull a thread below to see every chat that touched an idea.</p>
     ${conceptBar}
     <div style="position:relative;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:radial-gradient(1000px 520px at 50% 25%,rgba(90,70,180,.18),transparent 62%),#05070e">
       <canvas id="galaxy" style="display:block;width:100%;height:64vh;cursor:pointer"></canvas>
       <div id="galaxyInfo" style="position:absolute;left:12px;right:12px;bottom:12px;display:none"></div>
     </div>
     <div class="hint" style="margin-top:8px">${convs.length} conversation${convs.length===1?"":"s"} · lines connect chats that share a concept.</div>`, "galaxy");
  setTimeout(()=>drawGalaxy(convs), 30);
}

function drawGalaxy(convs){
  const canvas=document.getElementById("galaxy"); if(!canvas) return;
  const dpr=window.devicePixelRatio||1;
  const rect=canvas.getBoundingClientRect();
  const W=rect.width, H=rect.height;
  canvas.width=W*dpr; canvas.height=H*dpr;
  const ctx=canvas.getContext("2d"); ctx.setTransform(dpr,0,0,dpr,0,0);

  const n=convs.length;
  const keys=convs.map(c=>new Set((c.concepts||[]).map(conceptKey)));
  // union-find: chats sharing ≥1 concept join the same cluster
  const parent=convs.map((_,i)=>i);
  const find=x=>{ while(parent[x]!==x){ parent[x]=parent[parent[x]]; x=parent[x]; } return x; };
  for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){
    let shared=false; for(const k of keys[j]){ if(keys[i].has(k)){ shared=true; break; } }
    if(shared) parent[find(i)]=find(j);
  }
  const clusters={}; convs.forEach((c,i)=>{ const r=find(i); (clusters[r]=clusters[r]||[]).push(i); });
  const roots=Object.keys(clusters);

  const cx=W/2, cy=H/2, R=Math.min(W,H)*0.30;
  const centers={};
  roots.forEach((r,idx)=>{
    centers[r] = roots.length===1 ? {x:cx,y:cy}
      : {x:cx+Math.cos(idx/roots.length*Math.PI*2)*R, y:cy+Math.sin(idx/roots.length*Math.PI*2)*R};
  });

  const stars=[];
  roots.forEach(r=>{
    const m=clusters[r], c=centers[r];
    m.forEach((idx,k)=>{
      const ang=k*2.399, rad=m.length===1?0:10+Math.sqrt(k)*18;
      stars[idx]={ x:c.x+Math.cos(ang)*rad, y:c.y+Math.sin(ang)*rad, conv:convs[idx] };
    });
  });

  // Spotlight: when a concept is selected, matched chats glow (pink) + their
  // shared threads light up, everything else dims.
  const spot = window.__spotlightConcept || null;
  const matched = (i)=> spot ? keys[i].has(spot) : true;

  // edges between chats sharing concepts. With a big import (hundreds of chats) the
  // O(n²) line pass would freeze the canvas, so require stronger sharing and cap it.
  const need = n>250 ? 2 : 1, MAXL = 4000;
  let drawn=0;
  outer:
  for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){
    let shared=0; for(const k of keys[j]){ if(keys[i].has(k)) shared++; }
    if(shared>=need){
      const both=matched(i)&&matched(j);
      // when spotlighting in a large map, only draw the matched threads
      if(spot && n>250 && !both) continue;
      ctx.strokeStyle = spot ? (both?"rgba(240,171,252,.6)":"rgba(150,130,255,.05)")
                             : "rgba(150,130,255,"+Math.min(.4,.14*shared)+")";
      ctx.lineWidth = spot&&both?1.6:1;
      ctx.beginPath(); ctx.moveTo(stars[i].x,stars[i].y); ctx.lineTo(stars[j].x,stars[j].y); ctx.stroke();
      if(++drawn>=MAXL) break outer;
    }
  }
  // cluster labels = most common concept
  ctx.textAlign="center"; ctx.font="600 12px system-ui";
  roots.forEach(r=>{
    const m=clusters[r], counts={};
    m.forEach(idx=>(convs[idx].concepts||[]).forEach(cc=>{ counts[cc]=(counts[cc]||0)+1; }));
    const top=Object.keys(counts).sort((a,b)=>counts[b]-counts[a])[0];
    if(top){ const c=centers[r]; ctx.fillStyle=spot?"rgba(200,190,255,.28)":"rgba(200,190,255,.65)";
      ctx.fillText(top, c.x, c.y-(m.length===1?26:Math.sqrt(m.length)*18+34)); }
  });
  // stars
  for(let idx=0; idx<n; idx++){
    const s=stars[idx]; if(!s) continue;
    const isM=matched(idx);
    const size=(4+Math.min(7,(s.conv.concepts||[]).length))*(spot&&isM?1.3:1);
    ctx.globalAlpha=(spot&&!isM)?0.16:1;
    const core=(spot&&isM)?"rgba(245,200,255,1)":"rgba(180,215,255,1)";
    const halo=(spot&&isM)?"rgba(240,171,252,.7)":"rgba(120,150,255,.65)";
    const g=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,size*2.6);
    g.addColorStop(0,core); g.addColorStop(.4,halo); g.addColorStop(1,"rgba(120,150,255,0)");
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(s.x,s.y,size*2.6,0,Math.PI*2); ctx.fill();
    ctx.fillStyle="#eaf2ff"; ctx.beginPath(); ctx.arc(s.x,s.y,size*0.6,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=1; s._r=size*2.6;
  }
  // star labels = the conversation's subject (title). Shown when uncrowded, or
  // only for matched stars during a spotlight.
  ctx.textAlign="center"; ctx.font="600 11px system-ui";
  for(let idx=0; idx<n; idx++){
    const s=stars[idx]; if(!s) continue;
    const isM=matched(idx);
    if(spot && !isM) continue;
    if(!spot && n>40) continue;
    let t=String(s.conv.title||""); if(t.length>26) t=t.slice(0,25)+"…";
    ctx.fillStyle=(spot&&isM)?"rgba(245,220,255,.95)":"rgba(230,237,243,.9)";
    ctx.fillText(t, s.x, s.y + s._r + 13);
  }

  canvas.onclick=e=>{
    const rct=canvas.getBoundingClientRect(), mx=e.clientX-rct.left, my=e.clientY-rct.top;
    let best=null,bd=1e9; stars.forEach(s=>{ const d=Math.hypot(s.x-mx,s.y-my); if(d<bd){bd=d;best=s;} });
    if(best && bd<26) showGalaxyInfo(best.conv); else { const el=document.getElementById("galaxyInfo"); if(el) el.style.display="none"; }
  };
}

// Render a list of {role,text} as chat bubbles (user right, AI left).
function bubblesHTML(arr, scroll){
  const mx = scroll ? "max-height:44vh;overflow:auto;padding-right:4px;" : "";
  return `<div style="display:flex;flex-direction:column;gap:8px;${mx}">${(arr||[]).map(d=>{

    return `<div style="align-self:${user?'flex-end':'flex-start'};max-width:84%;padding:8px 11px;border-radius:12px;`+
      (user?'border-top-right-radius:4px;background:rgba(88,166,255,.16);border:1px solid rgba(88,166,255,.35);color:#eaf2ff'
           :'border-top-left-radius:4px;background:rgba(255,255,255,.06);border:1px solid var(--line);color:#dbe4ee')+
      `;line-height:1.5;font-size:13px;white-space:pre-wrap">${esc(d.text)}</div>`;
  }).join("")}</div>`;
}
function convModes(conv){
  const m=[];
  if(conv.digest && conv.digest.length) m.push(["digest","Digest"]);
  m.push(["summary","Summary"]);
  if(conv.messages && conv.messages.length) m.push(["full","Full chat"]);
  return m;
}

// Star / import detail: a "conversation piece" with a Digest / Summary / Full toggle.
function showGalaxyInfo(conv, mode){
  const el=document.getElementById("galaxyInfo"); if(!el) return;
  window.__gConv=conv;
  const modes=convModes(conv);
  if(!mode || !modes.some(m=>m[0]===mode)) mode=modes[0][0];
  const chips=(conv.concepts||[]).slice(0,6).map(x=>`<button class="lk" style="cursor:pointer" onclick="spotlightConcept('${attrJs(x)}')">${esc(x)}</button>`).join("");
  const quizBtn=conv.quiz?`<button class="btn pink" style="padding:6px 12px;font:800 11px system-ui" onclick="openConvQuiz('${conv.id}')">🎓 Study as quiz</button>`:"";
  const tabs=modes.map(([k,label])=>`<button onclick="showGalaxyInfo(window.__gConv,'${k}')" style="padding:4px 11px;border-radius:999px;font:700 11px system-ui;cursor:pointer;border:1px solid ${mode===k?'rgba(158,203,255,.6)':'var(--line)'};background:${mode===k?'rgba(158,203,255,.18)':'transparent'};color:${mode===k?'var(--blue)':'var(--dim)'}">${label}</button>`).join("");
  let body="";
  if(mode==="digest") body=bubblesHTML(conv.digest,false);
  else if(mode==="full") body=bubblesHTML((conv.messages||[]).map(m=>({role:m.role,text:m.markdown||m.text||""})),true);
  else body=`<div style="color:#dbe4ee;line-height:1.55;font-size:13px">${esc(conv.summary||"")}</div>${chips?`<div class="links" style="margin-top:8px">${chips}</div>`:""}`;
  el.innerHTML=`<div class="panel" style="margin:0;background:rgba(8,12,22,.97)">
    <div style="display:flex;justify-content:space-between;gap:8px;align-items:baseline">
      <span class="nn" style="color:var(--blue)">${esc(conv.title)}</span>
      <button class="back" style="margin:0" onclick="document.getElementById('galaxyInfo').style.display='none'">✕</button></div>
    <div style="display:flex;gap:6px;margin:9px 0 10px;flex-wrap:wrap">${tabs}</div>
    ${body}
    ${quizBtn?`<div style="margin-top:10px">${quizBtn}</div>`:""}
  </div>`;
  el.style.display="block";
}

/* ---- STORYBOOK: meaningful moments woven into a narrative (Phase-1 seed) ---- */
function renderStory(){
  const moments=[];
  FIELDS.forEach(f=>f.questions.forEach(q=>{
    const v=versions(q.id); if(!v.length) return;
    const bt=DB.breakthroughs[q.id]||[];
    v.forEach(ver=>{ if(bt.includes(ver.at)) moments.push({at:ver.at, kind:"✦ breakthrough", color:"var(--pink)", txt:`${q.concept} clicked — “${ver.text.slice(0,130)}${ver.text.length>130?"…":""}”`}); });
    if(v.length>1) moments.push({at:v[v.length-1].at, kind:"🌱 grew", color:"var(--green)", txt:`Your understanding of ${q.concept} grew — from “${v[0].text.slice(0,55)}…” to “${v[v.length-1].text.slice(0,55)}…”.`});
    else moments.push({at:v[0].at, kind:"🔎 began", color:"var(--blue)", txt:`You began exploring ${q.concept} by asking “${q.q}”.`});
  }));
  (DB.captures||[]).filter(c=>c.type==="story").forEach(c=>moments.push({at:c.at, kind:"📖 moment", color:"var(--violet)", txt:c.text}));
  moments.sort((a,b)=>a.at-b.at);

  if(!moments.length){
    app.innerHTML=chrome(`<h1>📖 Storybook</h1>
      <div class="empty">Your story hasn't started yet.<br><span style="opacity:.8">As you explore concepts, mark breakthroughs, and revisit ideas, Inkling weaves the meaningful moments into a story of your growth.</span><br><br>
      <button class="btn" onclick="go({name:'paths'})">Begin a study path ›</button></div>`, "story");
    return;
  }
  const first=moments[0], last=moments[moments.length-1];
  const intro=`<div class="panel" style="border-color:rgba(167,139,250,.35)"><div style="font:600 14px/1.6 system-ui;color:#dbe4ee">
     Your journey began ${fmtDate(first.at)}. Since then, Inkling has watched you move through ${new Set(moments.map(m=>m.txt)).size} moments of thinking — questions asked, ideas that clicked, and understanding that deepened. This is the story so far.</div></div>`;
  const list=moments.map(m=>`<div class="tl" style="border:0;padding:0;margin-bottom:13px">
     <div class="when" style="color:${m.color}">${m.kind} · ${fmtDate(m.at)}</div>
     <div class="txt">${esc(m.txt)}</div></div>`).join("");
  app.innerHTML=chrome(
    `<h1>📖 Storybook</h1>
     <p class="sub">Not a copy of your conversations — the meaningful moments, woven into the story of how you grew.</p>
     ${intro}
     <div class="panel"><div class="timeline">${list}</div></div>
     <div class="hint">A later stage turns this into flowing, chapter-by-chapter prose you can export as a real book.</div>`, "story");
}

/* ---- MEMORY: what Inkling remembers about you ---- */
function renderMemory(){
  const P=DB.profile, facts=[];
  if(P.done){
    const A=P.answers;
    if(A.t1&&A.t1.choices&&A.t1.choices.length) facts.push(["learning style","Learns best through "+A.t1.choices.join(", ").toLowerCase()]);
    if(A.t3&&A.t3.choices&&A.t3.choices.length) facts.push(["approach","Prefers the "+A.t3.choices.join(", ").toLowerCase()]);
    if(A.m2&&A.m2.text) facts.push(["recurring interest",A.m2.text]);
    if(A.q2&&A.q2.text) facts.push(["dream to master",A.q2.text]);
    if(A.q3&&A.q3.text) facts.push(["wants to help",A.q3.text]);
    if(A.p3&&A.p3.text) facts.push(["lifelong thread",A.p3.text]);
  }
  (DB.captures||[]).filter(c=>c.type==="memory").forEach(c=>facts.push(["you told Inkling",c.text]));
  if(!facts.length){
    app.innerHTML=chrome(`<h1>🔔 Memory</h1>
      <div class="empty">Inkling doesn't know you yet.<br><span style="opacity:.8">Plant your Seed, or just tell Inkling things in Chat — preferences, goals, how you learn — and it remembers what matters.</span><br><br>
      <button class="btn" onclick="go({name:'onboard',step:0})">🌱 Plant your Seed ›</button></div>`, "memory");
    return;
  }
  const rows=facts.map(([k,v])=>`<div class="node" style="padding:12px 14px">
     <div style="font:700 10px system-ui;color:var(--amber);text-transform:uppercase;letter-spacing:.04em">${esc(k)}</div>
     <div style="margin-top:4px;color:#dbe4ee;line-height:1.5">${esc(v)}</div></div>`).join("");
  app.innerHTML=chrome(
    `<h1>🔔 Memory</h1>
     <p class="sub">The lasting context Inkling holds about you — so it can teach you the way you actually learn.</p>
     ${rows}
     <div class="hint" style="margin-top:8px">From your Seed and anything you tell Inkling in Chat. A later stage lets you edit and add memories directly.</div>`, "memory");
}

/* ============================================================
   THE CONVERSATION ENGINE (💬 Chat).
   You talk; Inkling responds AND extracts. For a question about a
   concept it does the signature move — asks what YOU think first,
   never leading with the answer. Responses are heuristic + templated
   now; inklingRespond() is the single seam where a real LLM drops in.
   ============================================================ */
function matchConcept(t){
  const low=" "+t.toLowerCase()+" ";
  for(const f of FIELDS){ for(const q of f.questions){
    if(low.includes(" "+q.concept.toLowerCase()+" ")||low.includes(" "+q.concept.toLowerCase()+"s ")) return {fid:f.id,qid:q.id,concept:q.concept};
  }}
  for(const f of FIELDS){ for(const q of f.questions){
    for(const c of (q.reality.concepts||[])){ if(low.includes(" "+c.toLowerCase())) return {fid:f.id,qid:q.id,concept:q.concept}; }
  }}
  return null;
}
function matchField(t){
  const low=t.toLowerCase(); let best=null, score=0;
  FIELDS.forEach(f=>{ let sc=0; (FIELD_KW[f.id]||[]).forEach(k=>{ if(low.includes(k)) sc++; }); if(sc>score){ score=sc; best=f; } });
  return best;
}
// The response brain. Returns {html, route, links, actions[], capture?}.
// Swap the body for an LLM call when signed in — the shell doesn't change.
function inklingRespond(t, r){
  const links=r.links, primary=links[0], target=matchConcept(t), field=matchField(t);
  const linkPhrase = links.length? ` I connected it to ${links.slice(0,3).join(", ")}.` : "";
  const act=(label,onclick,kind)=>({label,onclick,kind:kind||"ghost"});
  switch(r.type){
    case "question": {
      const actions=[];
      if(target) actions.push(act(`Explore ${target.concept} →`, `go({name:'question',fid:'${target.fid}',qid:'${target.qid}'})`, "pink"));
      actions.push(act("See my open questions →", `go({name:'model'})`));
      return { route:"question", links, actions,
        html:`That's a great question${target?` about <b>${esc(target.concept)}</b>`:""} — and I've saved it. But before I weigh in: <b>what's your current hunch?</b> Even a rough guess is the most valuable thing here, because Inkling learns by watching how your answer changes.` };
    }
    case "knowledge": {
      const actions=[act("See it in your graph →", `go({name:'model'})`)];
      if(target) actions.push(act(`What do you think about ${target.concept}?`, `go({name:'question',fid:'${target.fid}',qid:'${target.qid}'})`, "pink"));
      return { route:"knowledge", links, actions,
        html:`Good — I added <b>${esc(primary||"that idea")}</b> to your knowledge graph.${linkPhrase} A concept isn't just a fact here; it's your evolving relationship with it. Want to capture what you understand so far?` };
    }
    case "path": {
      const actions=[ field? act(`Start ${field.name} →`, `go({name:'field',fid:'${field.id}'})`, "pink") : act("Open study paths →", `go({name:'paths'})`) ];
      return { route:"path", links, actions,
        html: field
          ? `Let's build that. I opened <b>${esc(field.name)}</b> as a study path — we'll start from what you already believe and grow it from there, step by step.`
          : `Let's turn that into a path. Tell me the subject, or pick where to start.` };
    }
    case "goal": {
      return { route:"goal", links, actions:[act("See what I remember →", `go({name:'memory'})`)],
        html:`That's a real goal — I'm holding onto it.${linkPhrase} As Inkling grows, I'll help turn it into a roadmap with milestones and practice, and keep it connected to what you're learning.` };
    }
    case "memory": {
      return { route:"memory", links, actions:[act("Your memory →", `go({name:'memory'})`)],
        html:`Noted — I'll remember that about you, so I can meet you the way you actually learn.` };
    }
    case "story": {
      return { route:"story", links, actions:[act("Read your story →", `go({name:'story'})`)],
        html:`That sounds like a real shift.${linkPhrase} I added it to your Storybook as a moment in your journey — the kind of thing you'll want to look back on.` };
    }
    case "reflection": {
      return { route:"reflection", links, actions:[],
        html:`Thank you for sharing that. I kept it as a reflection — these quiet observations are often where the biggest patterns hide.` };
    }
    case "flashcard": {
      return { route:"flashcard", links, actions:[act("Open the quiz →", `go({name:'quiz'})`)],
        html:`I'll turn that into a study item so it sticks.${linkPhrase} We can test it as a definition, an application, or in your own words.` };
    }
  }
  return { route:r.type, links, actions:[], html:esc(t) };
}

/* ---- REAL AI: call the Inkling backend LLM (signed-in), fall back to local ---- */
const INK_API = (typeof window!=="undefined" && window.__EUGENEOUS_API__) || "https://inkling-15yf.onrender.com";
function inkToken(){ try{ const s=JSON.parse(localStorage.getItem("eugeneousxr:session")||"null"); return (s&&s.token)?s.token:null; }catch(e){ return null; } }
function stripHtml(h){ const d=document.createElement("div"); d.innerHTML=String(h||""); return (d.textContent||d.innerText||"").trim(); }
function mdToHtml(s){
  let h=esc(String(s||""));
  h=h.replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/`([^`]+)`/g,"<code>$1</code>");
  h=h.replace(/^(?:[-*]\s+)(.*)$/gm,"• $1").replace(/\n/g,"<br>");
  return h;
}
// Compact snapshot of the user's graph so the model answers in context — plus a
// LEARNING-MODE frame (the backend prompt is calendar-flavored; this re-aims it).
// The Inkling identity frame — the distilled charter (see INKLING_CHARTER.md §4).
// This is what makes the model behave AS Inkling without being re-briefed.
const INKLING_FRAME = [
"You are Inkling — not a chatbot or a notebook, but the user's personal instrument for understanding: a living knowledge graph and an evolving autobiography of how their thinking grows. Talking to you should feel like opening the next chapter of their own intellectual journey.",
"How to respond:",
"- Be a curious mentor and thinking partner, never an answer-vending machine.",
"- When they ask about a concept, first ask briefly what they already think, then explain clearly and accurately. Never gatekeep — if they want the answer, give it.",
"- Always connect: tie the idea to what they already know and propose one new connection (an edge) with a one-line why. Value connections over facts.",
"- Treat each exchange as a moment in an evolving story; notice how their understanding is changing and reflect it back.",
"- Cultivate curiosity: explain, question, challenge, inspire. End with at most one inviting question. Be concise, specific, warm. Ground claims; don't fabricate.",
"- This is learning mode — do not propose calendar events or reminders unless explicitly asked. Measure success by understanding and connection, never completion.",
"You're talking to Jeremy — a curiosity-driven systems thinker who learns from first principles and thinks in graphs; his paths span electrical/electronics, AI, and robotics. Meet him big-picture first, then the mechanism."
].join("\n");
function mindSummaryForChat(){
  const parts=[INKLING_FRAME];
  const convs=DB.conversations||[];
  if(convs.length) parts.push("Imported conversations ("+convs.length+"): "+convs.slice(0,12).map(c=>c.title+((c.concepts&&c.concepts.length)?(" ["+c.concepts.slice(0,4).join(", ")+"]"):"")).join("; "));
  const oq=[]; Object.values(DB.openQs||{}).forEach(arr=>(arr||[]).forEach(q=>oq.push(q)));
  if(oq.length) parts.push("Open questions: "+oq.slice(0,8).join("; "));
  if(DB.profile&&DB.profile.fields&&DB.profile.fields.length) parts.push("Focus fields: "+DB.profile.fields.join(", "));
  return parts.join("\n").slice(0,2000);
}
// Returns the LLM result {reply,...} only when the server actually used a model.
async function askInklingAI(t){
  const token=inkToken(); if(!token) return null;
  const history=(DB.chat||[])
    .filter(m=>(m.role==="user"||m.role==="inkling") && !m.thinking)
    .slice(-16)
    .map(m=>({ role:m.role==="user"?"user":"assistant", content:m.role==="user"?String(m.text||""):(m.plain||stripHtml(m.html)||m.text||"") }))
    .filter(m=>m.content);
  try{
    const res=await fetch(INK_API+"/api/inkling/chat",{
      method:"POST",
      headers:{ "Content-Type":"application/json", "Authorization":"Bearer "+token },
      body:JSON.stringify({ message:t, history, mindSummary:mindSummaryForChat(),
        userName:(DB.profile&&DB.profile.name)||undefined, referenceDate:new Date().toISOString().slice(0,10) })
    });
    if(!res.ok) return null;
    const data=await res.json();
    return (data && data.source==="llm" && data.reply) ? data : null;  // guest/mock/capped/etc → local
  }catch(e){ return null; }
}

function chatEmpty(){
  return chatBubble({ role:"inkling", html:`Hi — I'm Inkling. Ask me about something you're curious about, tell me what you learned today, or name a goal you're chasing. I'll respond, and quietly turn what matters into your knowledge graph, open questions, and story.<br><br><span style="color:var(--dim)">Try:</span> <i>"How does a transistor work?"</i> · <i>"I want to learn robotics."</i> · <i>"I finally understand voltage."</i>` });

function chatBubble(m){
  if(m.role==="user"){
    return `<div style="display:flex;justify-content:flex-end;margin-bottom:12px">
      <div style="max-width:82%;background:rgba(88,166,255,.16);border:1px solid rgba(88,166,255,.35);border-radius:14px 14px 4px 14px;padding:10px 13px;color:#eaf2ff;line-height:1.5">${esc(m.text)}</div></div>`;
  }
  if(m.thinking){
    return `<div style="display:flex;gap:9px;margin-bottom:15px">
      <div style="flex:0 0 auto;font-size:20px;line-height:1.4">🌱</div>
      <div style="max-width:88%;background:var(--panel);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:11px 13px">
        <span class="hint" style="margin:0">Inkling is thinking… <span style="opacity:.7">(first reply can take a moment)</span></span></div></div>`;
  }
  const R = m.route? ROUTES[m.route] : null;
  const srcTag = m.source==="llm" ? `<div class="hint" style="margin-top:8px;color:var(--violet)">✦ Inkling AI</div>` : "";
  const extraction = R? `<div class="hint" style="margin-top:8px;color:${R.color}">${R.icon} ${R.verb}</div>` : "";
  const chips = (m.links&&m.links.length)? `<div class="links" style="margin-top:7px">${m.links.map(l=>`<span class="lk">${esc(l)}</span>`).join("")}</div>` : "";
  const actions = (m.actions&&m.actions.length)? `<div style="margin-top:11px;display:flex;gap:7px;flex-wrap:wrap">${m.actions.map(a=>`<button class="btn ${a.kind==='pink'?'pink':'ghost'}" style="padding:7px 13px;font:800 11px system-ui" onclick="${a.onclick}">${esc(a.label)}</button>`).join("")}</div>` : "";
  return `<div style="display:flex;gap:9px;margin-bottom:15px">
    <div style="flex:0 0 auto;font-size:20px;line-height:1.4">🌱</div>
    <div style="max-width:88%;background:var(--panel);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:11px 13px">
      <div style="color:#dbe4ee;line-height:1.55">${m.html||esc(m.text||"")}</div>
      ${srcTag}${extraction}${chips}${actions}</div></div>`;
}
async function interpret(){
  const el=document.getElementById("capText"); const t=(el.value||"").trim(); if(!t){ el.focus(); return; }
  DB.chat=DB.chat||[];
  DB.chat.push({ role:"user", text:t, at:Date.now() });
  const r=classify(t);
  // extract a knowledge node from the conversation (don't save every sentence as its own node type — but do route it)
  DB.captures.push({ id:"c"+Date.now(), text:t, type:r.type, links:r.links, reason:r.reason, at:Date.now() });

  // Signed in? Try the real model, showing a thinking bubble (cold start can be slow).
  if(inkToken()){
    const thinkId="think"+Date.now();
    DB.chat.push({ role:"inkling", thinking:true, id:thinkId, at:Date.now()+1 });
    persist(); renderRouter();
    let ai=null; try{ ai=await askInklingAI(t); }catch(e){ ai=null; }
    DB.chat=(DB.chat||[]).filter(m=>m.id!==thinkId);
    if(ai){
      const tmpl=inklingRespond(t, r);   // reuse the template's helpful nav buttons
      DB.chat.push({ role:"inkling", html:mdToHtml(ai.reply), plain:ai.reply, route:r.type, links:r.links, actions:tmpl.actions, source:"llm", at:Date.now()+2 });
    } else {
      DB.chat.push(Object.assign({ role:"inkling", source:"local", at:Date.now()+2 }, inklingRespond(t, r)));
    }
    persist(); renderRouter(); return;
  }

  // Guest → local responder (sign in on the main app for full AI).
  DB.chat.push(Object.assign({ role:"inkling", source:"local", at:Date.now()+1 }, inklingRespond(t, r)));
  persist(); renderRouter();
}
// Clearing the transcript never deletes extracted knowledge — that stays in your graph.
function clearChat(){ if(confirm("Clear the conversation? Your captured knowledge, questions and story stay.")){ DB.chat=[]; persist(); renderRouter(); } }

/* ---- THE SEED: the Initial Understanding Protocol ---- */
function onbSteps(){
  const s=[{type:"welcome"}];
  PROTOCOL.forEach(cat=>{
    if(cat.fieldsStep){ s.push({type:"fields",cat:cat.cat,color:cat.color,lead:cat.lead}); return; }
    cat.items.forEach(it=> s.push({type:"q",cat:cat.cat,color:cat.color,lead:cat.lead,it}));
  });
  s.push({type:"synth"});
  return s;
}
function onbChip(val,multi){
  let sel=window.__ONBSEL||[];
  if(multi===false) sel=[val];
  else sel = sel.includes(val)? sel.filter(x=>x!==val) : sel.concat(val);
  window.__ONBSEL=sel;
  document.querySelectorAll("[data-onbchip]").forEach(el=>{
    const on=sel.includes(el.getAttribute("data-onbchip"));
    el.className = on?"chip had":"chip";
  });
}
function onbNext(i){
  const STEPS=onbSteps(), step=STEPS[i], P=DB.profile;
  if(step.type==="q"){
    if(step.it.choices){ P.answers[step.it.id]={choices:(window.__ONBSEL||[]).slice(),node:step.it.node,at:Date.now()}; }
    else { const t=(document.getElementById("onbText")||{}).value||""; if(t.trim()) P.answers[step.it.id]={text:t.trim(),node:step.it.node,at:Date.now()}; }
  } else if(step.type==="fields"){ P.fields=(window.__ONBSEL||[]).slice(); }
  persist(); go({name:"onboard",step:i+1});
}
function onbReflection(){
  const P=DB.profile, A=P.answers;
  const text=Object.values(A).map(a=>a.text||(a.choices||[]).join(" ")).join(" ").toLowerCase();
  const chosen=new Set(P.fields||[]); const score={};
  SPINE.forEach(f=>{ let s=chosen.has(f)?3:0; (FIELD_KW[f]||[]).forEach(k=>{ if(text.includes(k)) s+=1; }); score[f]=s; });
  let rel=SPINE.filter(f=>score[f]>0);
  if(!rel.length) rel = chosen.size? [...chosen] : ["ee"];
  rel.sort((a,b)=>SPINE.indexOf(a)-SPINE.indexOf(b));
  return { rel, score };
}
function renderOnboard(){
  const STEPS=onbSteps(); let i=view.step||0; i=Math.max(0,Math.min(i,STEPS.length-1));
  const step=STEPS[i], P=DB.profile;
  if(!P.startedAt){ P.startedAt=Date.now(); persist(); }
  const qTotal=STEPS.filter(s=>s.type==="q"||s.type==="fields").length;
  const qIndex=STEPS.slice(0,i+1).filter(s=>s.type==="q"||s.type==="fields").length;
  const pct = step.type==="welcome"?0 : step.type==="synth"?100 : Math.round(qIndex/qTotal*100);
  const bar = step.type==="welcome"?"" : `<div style="height:5px;border-radius:99px;background:rgba(255,255,255,.1);margin:0 0 16px;overflow:hidden"><div style="height:100%;width:${pct}%;background:linear-gradient(90deg,#39d98a,#a78bfa)"></div></div>`;

  // WELCOME
  if(step.type==="welcome"){
    const done=P.done;
    app.innerHTML=chrome(
      `<div class="panel" style="text-align:center;padding:28px 20px">
        <div style="font-size:46px;line-height:1">🌱</div>
        <h1 style="margin:10px 0 4px">The Seed</h1>
        <p class="sub" style="margin:0 auto 16px;max-width:470px">Before Inkling guides your learning, it wants to understand <b>you</b> — what you're curious about, how you think, what you're chasing. This isn't a test. It's the conversation that plants the first nodes of your knowledge graph.</p>
        ${done? `<div class="hint" style="margin-bottom:12px">You planted your seed on ${fmtDate(P.completedAt||P.startedAt)}. You can revisit and let it keep growing.</div>
          <button class="btn" onclick="go({name:'onboard',step:${STEPS.length-1}})">See your first path ›</button>
          <div style="margin-top:10px"><button class="back" onclick="go({name:'onboard',step:1})">Answer the questions again</button></div>`
        : `<button class="btn" onclick="go({name:'onboard',step:1})">Plant the seed ›</button>
          <div style="margin-top:12px"><button class="back" onclick="go({name:'dashboard'})">Skip for now</button></div>`}
      </div>`, "onboard");
    return;
  }

  // SYNTHESIS — Inkling's first reflection + recommended path
  if(step.type==="synth"){
    if(!P.done){ P.done=true; P.completedAt=Date.now(); persist(); }
    const A=P.answers;
    const say=id=> A[id]&&A[id].text ? A[id].text : "";
    const choiceOf=id=> A[id]&&A[id].choices ? A[id].choices.join(", ") : "";
    const {rel}=onbReflection();
    const relNames=rel.map(f=>`${fieldById(f).icon} ${fieldById(f).name}`);
    // ordered concrete path: up to 2 opening concepts per relevant field, along the spine
    const path=[]; rel.forEach(f=>{ const fd=fieldById(f); fd.questions.slice(0,2).forEach(q=>path.push({icon:fd.icon,c:q.concept,fid:f,qid:q.id})); });
    const questions=[["q1"],["m3"],["q4"],["q3"]].map(([id])=>say(id)).filter(Boolean);
    const reflect=[];
    if(say("m1")) reflect.push(`You most want to understand <b>“${esc(say("m1"))}”</b>.`);
    if(say("m2")) reflect.push(`Your curiosity keeps returning to <b>${esc(say("m2"))}</b>.`);
    if(choiceOf("t1")) reflect.push(`You learn best through <b>${esc(choiceOf("t1")).toLowerCase()}</b>${choiceOf("t3")?`, and you prefer the <b>${esc(choiceOf("t3")).toLowerCase()}</b>`:""}.`);
    if(say("q2")) reflect.push(`If you could master one technology, it'd be <b>${esc(say("q2"))}</b>.`);
    if(say("q3")) reflect.push(`You'd want your learning to help <b>${esc(say("q3"))}</b>.`);
    if(say("p3")) reflect.push(`An interest that has followed you your whole life: <b>${esc(say("p3"))}</b>.`);

    app.innerHTML=chrome(
      `${bar}
       <div style="text-align:center;margin-bottom:6px"><div style="font-size:34px">🌱→🌿</div></div>
       <h1 style="text-align:center;margin-bottom:2px">Your seed is planted</h1>
       <p class="sub" style="text-align:center">Inkling's first reflection of you. This grows every time you learn.</p>

       ${reflect.length? `<div class="panel"><h3 style="font:800 12px system-ui;color:var(--violet);margin:0 0 9px;text-transform:uppercase;letter-spacing:.04em">Who you are, as a learner</h3>
         ${reflect.map(r=>`<div style="padding:6px 0;border-bottom:1px solid var(--line);line-height:1.5;color:#dbe4ee">${r}</div>`).join("")}</div>`:""}

       <div class="panel"><h3 style="font:800 12px system-ui;color:var(--blue);margin:0 0 8px;text-transform:uppercase;letter-spacing:.04em">Your strongest connection areas</h3>
         <div style="font:800 16px system-ui;line-height:1.5">${relNames.join(' <span style="color:var(--dim)">→</span> ')}</div>
         <div class="hint" style="margin-top:6px">These fields build on each other — the same ideas flow from one into the next.</div></div>

       <div class="panel"><h3 style="font:800 12px system-ui;color:var(--green);margin:0 0 10px;text-transform:uppercase;letter-spacing:.04em">Your first exploration path</h3>
         ${path.map((p,n)=>`<button class="qrow" style="margin-bottom:7px" onclick="go({name:'question',fid:'${p.fid}',qid:'${p.qid}'})">
            <span style="flex:0 0 auto;width:22px;height:22px;border-radius:50%;background:rgba(57,217,138,.16);color:var(--green);font:800 11px system-ui;display:flex;align-items:center;justify-content:center">${n+1}</span>
            <span><span class="qt">${p.icon} ${esc(p.c)}</span></span></button>`).join("")}</div>

       ${questions.length? `<div class="panel"><h3 style="font:800 12px system-ui;color:var(--amber);margin:0 0 8px;text-transform:uppercase;letter-spacing:.04em">Your first questions to chase</h3>
         ${questions.map(q=>`<div class="openq">${esc(q)}</div>`).join("")}
         <div class="hint" style="margin-top:8px">Inkling will hold these. As you learn, it'll show you where they get answered.</div></div>`:""}

       <button class="btn" style="width:100%" onclick="go({name:'question',fid:'${path[0]?path[0].fid:'ee'}',qid:'${path[0]?path[0].qid:'ee1'}'})">Begin your first exploration ›</button>
       <div style="text-align:center;margin-top:10px"><button class="back" onclick="go({name:'model'})">Or see your model</button></div>`, "onboard");
    return;
  }

  // A QUESTION (free-text) or FIELDS picker or CHOICE question
  let bodyHTML="";
  if(step.type==="fields"){
    window.__ONBSEL=(P.fields||[]).slice();
    bodyHTML=`<div class="chips">${FIELDS.map(f=>`<span data-onbchip="${f.id}" class="${(P.fields||[]).includes(f.id)?'chip had':'chip'}" onclick="onbChip('${f.id}',true)">${f.icon} ${esc(f.name)}</span>`).join("")}</div>
      <div class="hint" style="margin-top:8px">Pick as many as pull at you — you can always add more later.</div>`;
  } else if(step.it.choices){
    const prev=(P.answers[step.it.id]&&P.answers[step.it.id].choices)||[];
    window.__ONBSEL=prev.slice();
    bodyHTML=`<div class="chips">${step.it.choices.map(c=>`<span data-onbchip="${esc(c)}" class="${prev.includes(c)?'chip had':'chip'}" onclick="onbChip('${esc(c)}',${step.it.multi?'true':'false'})">${esc(c)}</span>`).join("")}</div>
      <div class="hint" style="margin-top:8px">${step.it.multi?"Choose any that fit.":"Choose one."}</div>`;
  } else {
    const prev=(P.answers[step.it.id]&&P.answers[step.it.id].text)||"";
    bodyHTML=`<textarea id="onbText" placeholder="Take your time. Whatever's true for you.">${esc(prev)}</textarea>`;
  }
  const qtext = step.type==="fields" ? "Which of these pull at you?" : step.it.q;
  app.innerHTML=chrome(
    `${bar}
     <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
       <span style="font:800 11px system-ui;color:${step.color};text-transform:uppercase;letter-spacing:.05em">${esc(step.cat)}</span>
       <span class="hint" style="margin:0">${qIndex} of ${qTotal}</span></div>
     <div class="panel">
       <div class="qbig">${esc(qtext)}</div>
       <div class="hint" style="margin:6px 0 12px">${esc(step.lead||"")}</div>
       ${bodyHTML}
       <div style="display:flex;align-items:center;gap:10px;margin-top:14px">
         <button class="btn" onclick="onbNext(${i})">Continue ›</button>
         <button class="back" onclick="go({name:'onboard',step:${i+1}})">Skip</button>
       </div>
     </div>
     <button class="back" onclick="go({name:'onboard',step:${i-1}})">‹ Back</button>`, "onboard");
}

/* ---- CONCEPT TIMELINE: the biography of one idea in your mind ----
   First encounter → the path → breakthroughs → where you are now →
   what's still open.  This is how you meet a past version of yourself. */
function renderTimeline(){
  const f=fieldById(view.fid), q=qById(view.fid,view.qid);
  const vs=versions(q.id);
  if(!vs.length) return go({name:"question",fid:view.fid,qid:view.qid});
  const first=vs[0], now=vs[vs.length-1];
  const bt=DB.breakthroughs[q.id]||[];
  const openQ=DB.openQs[q.id]||[];
  const rf=DB.refine[q.id]||{had:[],new:[]};

  // confidence arc across every version
  const arc = vs.map(v=>`<i title="${fmtDate(v.at)} · ${CONF[v.conf]}" style="width:14px;height:14px;border-radius:50%;background:${CONF_COLOR[v.conf]};box-shadow:0 0 0 3px ${CONF_COLOR[v.conf]}22;flex:0 0 auto"></i>`)
    .join(`<span style="flex:1;height:2px;background:var(--line);min-width:12px"></span>`);
  const arcRow = vs.length>1
    ? `<div class="panel"><h3 style="font:800 12px system-ui;color:var(--amber);margin:0 0 11px;text-transform:uppercase;letter-spacing:.04em">Confidence over time</h3>
        <div style="display:flex;align-items:center;gap:0">${arc}</div>
        <div style="display:flex;justify-content:space-between;font:700 10px system-ui;color:var(--dim);margin-top:7px">
          <span>${CONF[first.conf]} · ${fmtDate(first.at)}</span><span>${CONF[now.conf]} · now</span></div></div>` : "";

  // the path — every version, each markable as a breakthrough
  const path = vs.map((v,i)=>{
    const isBt=bt.includes(v.at);
    const tag = i===0 ? "① first encounter" : (i===vs.length-1 && vs.length>1 ? "where you are now" : "revisited");
    const tagColor = i===0 ? "var(--blue)" : (i===vs.length-1 && vs.length>1 ? "var(--green)" : "var(--violet)");
    return `<div class="tl" style="${isBt?'background:rgba(240,171,252,.06);border-radius:10px;padding:9px 11px;margin-left:-11px':''}">
      <div class="when" style="color:${tagColor}">${tag} · ${fmtDate(v.at)} · ${daysAgo(v.at)}${isBt?" · ✦ breakthrough":""}</div>
      <div class="txt">${esc(v.text)}</div>
      <div class="cf">confidence: ${CONF[v.conf]}
        <button style="margin-left:10px;background:${isBt?'rgba(240,171,252,.16)':'var(--panel2)'};border:1px solid ${isBt?'rgba(240,171,252,.55)':'var(--line)'};color:${isBt?'var(--pink)':'var(--dim)'};border-radius:999px;padding:3px 10px;font:700 10px system-ui;cursor:pointer"
          onclick="toggleBreakthrough('${q.id}',${v.at})">${isBt?"★ breakthrough moment":"✦ mark as breakthrough"}</button></div>
    </div>`;
  }).join("");

  const btBlock = bt.length ? `<div class="panel"><h3 style="font:800 12px system-ui;color:var(--pink);margin:0 0 8px;text-transform:uppercase;letter-spacing:.04em">Breakthrough moments</h3>
    <div class="hint" style="margin:0 0 8px">The times it clicked — when a connection formed and your understanding jumped.</div>
    ${vs.filter(v=>bt.includes(v.at)).map(v=>`<div class="openq" style="color:var(--pink)">${fmtDate(v.at)} — “${esc(v.text.slice(0,110))}${v.text.length>110?"…":""}”</div>`).join("")}</div>` : "";

  const nowBlock = vs.length>1 ? `<div class="panel" style="border-color:rgba(57,217,138,.4)">
    <h3 style="font:800 12px system-ui;color:var(--green);margin:0 0 8px;text-transform:uppercase;letter-spacing:.04em">Where you are now</h3>
    <div class="txt" style="color:#dbe4ee;line-height:1.55">${esc(now.text)}</div>
    <div class="cf" style="margin-top:6px">confidence: ${CONF[now.conf]} · you started at “${CONF[first.conf]}”</div></div>` : "";

  const openBlock = `<div class="panel"><h3 style="font:800 12px system-ui;color:var(--amber);margin:0 0 8px;text-transform:uppercase;letter-spacing:.04em">Questions & challenges this opened</h3>
    <div class="hint" style="margin:0 0 8px">The gaps you noticed — threads to keep pulling.</div>
    ${openQ.length? openQ.map(o=>`<div class="openq">${esc(o)}</div>`).join("") : `<div class="hint">None jotted yet.</div>`}</div>`;

  app.innerHTML = chrome(
    `<button class="back" onclick="go({name:'model'})">‹ Knowledge graph</button>
     <div class="concept-tag">${f.icon} ${esc(f.name)}</div>
     <h1 style="margin-bottom:2px">${esc(q.concept)}</h1>
     <p class="sub">First met ${fmtDate(first.at)} · ${vs.length} version${vs.length>1?"s":""} of your understanding</p>

     <div class="panel"><h3 style="font:800 12px system-ui;color:var(--blue);margin:0 0 7px;text-transform:uppercase;letter-spacing:.04em">The question that started it</h3>
       <div style="font:700 15px system-ui;line-height:1.4">“${esc(q.q)}”</div></div>

     ${arcRow}
     <div class="panel"><h3 style="font:800 12px system-ui;color:var(--violet);margin:0 0 11px;text-transform:uppercase;letter-spacing:.04em">The path your understanding took</h3>
       <div class="timeline">${path}</div></div>
     ${btBlock}
     ${nowBlock}
     ${openBlock}

     <button class="btn pink" onclick="go({name:'question',fid:'${f.id}',qid:'${q.id}'})">Explain it again — add a new version ›</button>`, "graph");
}

function toggleBreakthrough(qid,at){
  const arr=DB.breakthroughs[qid]||[];
  DB.breakthroughs[qid]= arr.includes(at)? arr.filter(x=>x!==at) : arr.concat(at);
  persist(); renderTimeline();
}

/* ---- YOUR MODEL: every captured concept as a living node ---- */
function renderModel(){
  const nodes=[];
  let totalAns=0, totalRevisits=0, openCount=0;
  FIELDS.forEach(f=>f.questions.forEach(q=>{
    const vs=versions(q.id); if(!vs.length) return;
    totalAns++; totalRevisits+=Math.max(0,vs.length-1);
    openCount+=(DB.openQs[q.id]||[]).length;
    const rf=DB.refine[q.id]||{had:[],new:[]};
    nodes.push({f,q,vs,rf});
  }));

  if(!nodes.length){
    const seedLine = DB.profile.done
      ? `<button class="btn" onclick="go({name:'onboard',step:${onbSteps().length-1}})">See your first path ›</button>`
      : `<button class="btn" onclick="go({name:'onboard',step:0})">🌱 Plant The Seed ›</button>`;
    app.innerHTML=chrome(`<h1>🌐 Knowledge graph</h1>
      <div class="empty">Nothing captured yet.<br><span style="opacity:.8">Answer a discovery question and it becomes a living node here — your own map of what you understand, and how it changes.</span><br><br>
      ${seedLine}</div>`, "graph");
    return;
  }

  // stat strip
  const stat=`<div style="display:flex;gap:9px;flex-wrap:wrap;margin-bottom:16px">
    ${[["nodes",nodes.length,"var(--blue)"],["revisits",totalRevisits,"var(--violet)"],["open questions",openCount,"var(--amber)"]]
      .map(([l,n,c])=>`<div style="flex:1;min-width:96px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 13px">
        <div style="font:800 22px system-ui;color:${c}">${n}</div><div style="font:700 11px system-ui;color:var(--dim)">${l}</div></div>`).join("")}
  </div>`;

  const cards=nodes.map(({f,q,vs,rf})=>{
    const latest=vs[vs.length-1];
    const first=vs[0];
    const evo = vs.length>1
      ? `<div style="margin-top:9px;font:600 12px system-ui;color:#cbd5e1;line-height:1.5">
           <span style="color:var(--dim)">then (${fmtDate(first.at)}):</span> “${esc(first.text.slice(0,120))}${first.text.length>120?"…":""}”<br>
           <span style="color:var(--violet)">now (${fmtDate(latest.at)}):</span> “${esc(latest.text.slice(0,120))}${latest.text.length>120?"…":""}”</div>`
      : `<div style="margin-top:9px;font:600 12px system-ui;color:#cbd5e1;line-height:1.5">“${esc(latest.text.slice(0,150))}${latest.text.length>150?"…":""}”</div>`;
    const had=rf.had.map(i=>q.reality.concepts[i]).filter(Boolean);
    const nw =rf.new.map(i=>q.reality.concepts[i]).filter(Boolean);
    const links = q.reality.concepts.map(c=>`<span class="lk">${esc(c)}</span>`).join("");
    const refined = (had.length||nw.length)? `<div style="margin-top:8px;font:700 11px system-ui">
        ${had.length?`<span style="color:var(--green)">✓ had: ${had.map(esc).join(", ")}</span>`:""}
        ${nw.length?`<span style="color:var(--amber);margin-left:8px">✦ new: ${nw.map(esc).join(", ")}</span>`:""}</div>`:"";
    const btN=(DB.breakthroughs[q.id]||[]).length;
    return `<button class="node" style="display:block;width:100%;text-align:left;cursor:pointer;color:var(--ink)" onclick="go({name:'timeline',fid:'${f.id}',qid:'${q.id}'})">
      <div class="nh"><span class="nn">${f.icon} ${esc(q.concept)}</span><span class="nc">${f.name} · ${vs.length>1?vs.length+" versions":"1 capture"}${btN?" · ✦"+btN:""}</span></div>
      ${evo}
      ${refined}
      <div class="links">${links}</div>
      <div style="margin-top:9px;font:700 11px system-ui;color:var(--violet)">📖 Read this concept's timeline ›</div>
    </button>`;
  }).join("");

  // where curiosity keeps returning + unresolved threads across every concept
  const returns = nodes.slice().filter(n=>n.vs.length>1).sort((a,b)=>b.vs.length-a.vs.length).slice(0,5);
  const allOpen=[]; nodes.forEach(n=>(DB.openQs[n.q.id]||[]).forEach(o=>allOpen.push({o, c:n.q.concept, f:n.f})));
  // shared user model: questions you routed through the Interpreter show up here too
  DB.captures.filter(c=>c.type==="question").forEach(c=>allOpen.push({o:c.text, c:"via 💬 Talk", f:{icon:"💬"}}));
  let curiosity="";
  if(returns.length){
    curiosity += `<div class="panel"><h3 style="font:800 12px system-ui;color:var(--violet);margin:0 0 9px;text-transform:uppercase;letter-spacing:.04em">Where your curiosity keeps returning</h3>
      ${returns.map(n=>`<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line);font:700 13px system-ui">
        <span>${n.f.icon} ${esc(n.q.concept)}</span><span style="color:var(--violet)">returned ${n.vs.length}×</span></div>`).join("")}</div>`;
  }
  if(allOpen.length){
    curiosity += `<div class="panel"><h3 style="font:800 12px system-ui;color:var(--amber);margin:0 0 9px;text-transform:uppercase;letter-spacing:.04em">Unresolved threads (${allOpen.length})</h3>
      <div class="hint" style="margin:0 0 8px">The questions you left open — where understanding can keep expanding.</div>
      ${allOpen.slice(0,10).map(t=>`<div class="openq">${esc(t.o)} <span style="color:var(--dim);font-weight:600">· ${esc(t.c)}</span></div>`).join("")}</div>`;
  }

  // "who you are" — carried from The Seed
  let seed="";
  if(DB.profile.done){
    const A=DB.profile.answers;
    const bits=[];
    if(A.m1&&A.m1.text) bits.push(["wants to understand",A.m1.text]);
    if(A.t1&&A.t1.choices&&A.t1.choices.length) bits.push(["learns best by",A.t1.choices.join(", ").toLowerCase()]);
    if(A.q2&&A.q2.text) bits.push(["dream to master",A.q2.text]);
    if(A.p3&&A.p3.text) bits.push(["lifelong thread",A.p3.text]);
    if(bits.length) seed=`<button class="node" style="display:block;width:100%;text-align:left;cursor:pointer;color:var(--ink);background:linear-gradient(135deg,rgba(167,139,250,.10),transparent);border-color:rgba(167,139,250,.35)" onclick="go({name:'onboard',step:${onbSteps().length-1}})">
      <div class="nh"><span class="nn" style="color:var(--violet)">🌱 Who you are, as a learner</span><span class="nc">from The Seed ›</span></div>
      ${bits.map(([k,v])=>`<div style="margin-top:6px;font:600 12px system-ui;color:#cbd5e1"><span style="color:var(--dim)">${k}:</span> ${esc(v)}</div>`).join("")}</button>`;
  }
  app.innerHTML=chrome(
    `<h1>🌐 Knowledge graph</h1>
     <p class="sub">Not what you know — <b>how you came to know it.</b> Every concept keeps its whole history: what you first thought, what changed it, and what's still open. Tap one to read its timeline.</p>
     ${seed}${stat}${curiosity}${cards}`, "graph");
}

// Boot: an ?import=<base64> handoff from the browser extension lands on the chooser.
// The URL carries only the light stuff (digest + concepts); the bulky quiz deck
// arrives right after via postMessage, so the URL never gets long enough to break.
(function boot(){
  try{
    const p = new URLSearchParams(location.search).get("import");
    if(p){
      window.__pendingImport = JSON.parse(decodeURIComponent(escape(atob(p))));
      view = { name:"import" };
      window.addEventListener("message", function(ev){
        if(ev.data && ev.data.type==="inkling-import-extra"){
          if(window.__pendingImport){
            if(ev.data.quiz) window.__pendingImport.quiz = ev.data.quiz;
            if(Array.isArray(ev.data.messages)) window.__pendingImport.messages = ev.data.messages;
          }
          if(view.name==="import") render();
        }
      });
      try{ if(window.opener) window.opener.postMessage({type:"inkling-import-ready"}, "*"); }catch(e){}
    } else {
      const qs = new URLSearchParams(location.search);
      // Deep link straight to a section, e.g. ?view=galaxy or ?view=imports.
      const vw = qs.get("view");
      if(vw && ["dashboard","galaxy","imports","storybook","graph","model","router","paths","quiz","story","memory"].includes(vw)){
        view = { name: vw };
      }
      // Ask from the Atlas: ?ask=<question> opens Chat and sends it (closes the loop).
      const ask = qs.get("ask");
      if(ask){
        view = { name:"router" };
        setTimeout(()=>{ const el=document.getElementById("capText"); if(el){ el.value=ask; interpret(); } try{ history.replaceState(null,"",location.pathname); }catch(e){} }, 60);
      }
    }
  }catch(e){ /* ignore a malformed handoff */ }
  render();
})();
</script>
  <!-- Visitor analytics (GoatCounter — privacy-friendly, no cookies). Owner self-exclude: ?noviews once per device (?countme to undo). Data: eugeneousxr.goatcounter.com -->
  <script>

        var p = new URLSearchParams(location.search);
        if (p.has("noviews")) localStorage.setItem("skipgc", "t");
        if (p.has("countme")) localStorage.removeItem("skipgc");
        if (localStorage.getItem("skipgc") === "t") return;
      } catch (e) { /* ignore */ }
      var s = document.createElement("script");
      s.async = true;
      s.src = "//gc.zgo.at/count.js";
      s.setAttribute("data-goatcounter", "https://eugeneousxr.goatcounter.com/count");
      document.head.appendChild(s);
    })();
