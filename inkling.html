<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inkling · your evolving model of how the world works</title>
<style>
  :root{
    --bg:#070b14; --panel:rgba(255,255,255,0.04); --panel2:rgba(255,255,255,0.06);
    --line:rgba(255,255,255,0.12); --ink:#e6edf3; --dim:#8b949e; --blue:#9ecbff;
    --pink:#f0abfc; --green:#39d98a; --amber:#fbbf24; --violet:#a78bfa;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font:600 14px/1.5 system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased}
  body{background:radial-gradient(1200px 700px at 80% -10%,rgba(120,90,255,.13),transparent 60%),
        radial-gradient(900px 600px at 0% 110%,rgba(0,180,255,.10),transparent 55%),var(--bg)}
  a{color:inherit}
  .wrap{max-width:760px;margin:0 auto;padding:22px 16px 90px}
  .top{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:18px}
  .brand{font:800 20px system-ui}
  .brand small{display:block;font:600 11px system-ui;color:var(--dim);margin-top:2px}
  .nav{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .nav button{background:var(--panel);border:1px solid var(--line);color:var(--ink);
    border-radius:999px;padding:7px 13px;font:700 12px system-ui;cursor:pointer}
  .nav button.on{background:rgba(158,203,255,.16);border-color:rgba(158,203,255,.55);color:var(--blue)}
  .back{background:transparent;border:0;color:var(--blue);font:700 12px system-ui;cursor:pointer;padding:0;margin-bottom:12px}
  h1{font:800 22px system-ui;margin:0 0 4px}
  .sub{color:var(--dim);font:600 12px system-ui;margin:0 0 18px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  @media(max-width:560px){.grid{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px;
    cursor:pointer;text-align:left;color:var(--ink);width:100%;transition:transform .08s,border-color .12s}
  .card:hover{transform:translateY(-1px);border-color:rgba(158,203,255,.5)}
  .card .ic{font-size:26px}
  .card .nm{font:800 16px system-ui;margin:7px 0 3px}
  .card .bl{color:var(--dim);font:600 12px system-ui;line-height:1.45}
  .card .meta{margin-top:9px;font:700 11px system-ui;color:var(--blue)}
  .qrow{display:flex;align-items:flex-start;gap:11px;background:var(--panel);border:1px solid var(--line);
    border-radius:12px;padding:13px 14px;margin-bottom:9px;cursor:pointer;text-align:left;color:var(--ink);width:100%}
  .qrow:hover{border-color:rgba(240,171,252,.5)}
  .qrow .dot{flex:0 0 auto;width:10px;height:10px;border-radius:50%;margin-top:5px;background:#3b4252}
  .qrow.done .dot{background:var(--green)}
  .qrow.rev .dot{background:var(--violet)}
  .qrow .qt{font:700 13px system-ui}
  .qrow .qc{font:700 11px system-ui;color:var(--dim);margin-top:2px}
  .qrow .st{margin-left:auto;flex:0 0 auto;font:700 10px system-ui;color:var(--dim);white-space:nowrap;padding-top:2px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
  .qbig{font:800 19px system-ui;line-height:1.35;margin:0 0 4px}
  .concept-tag{display:inline-block;font:700 11px system-ui;color:var(--pink);
    background:rgba(240,171,252,.12);border:1px solid rgba(240,171,252,.4);border-radius:999px;padding:3px 10px;margin-bottom:12px}
  textarea{width:100%;min-height:110px;resize:vertical;background:rgba(0,0,0,.25);border:1px solid var(--line);
    border-radius:11px;padding:12px;color:var(--ink);font:600 14px/1.5 system-ui;outline:none}
  textarea:focus{border-color:rgba(158,203,255,.6)}
  .conf{display:flex;align-items:center;gap:11px;margin:13px 0}
  .conf input{flex:1}
  .conf .lab{font:700 11px system-ui;color:var(--dim);min-width:96px}
  .conf .val{font:800 12px system-ui;color:var(--amber);min-width:104px;text-align:right}
  .btn{background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;border:0;border-radius:11px;
    padding:11px 18px;font:800 13px system-ui;cursor:pointer}
  .btn.pink{background:linear-gradient(135deg,#db2777,#a21caf)}
  .btn.ghost{background:var(--panel2);border:1px solid var(--line);color:var(--ink)}
  .btn:disabled{opacity:.5;cursor:default}
  .reality h3{font:800 13px system-ui;color:var(--green);margin:0 0 7px;text-transform:uppercase;letter-spacing:.04em}
  .reality p{margin:0 0 12px;line-height:1.55;color:#dbe4ee}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin:4px 0 6px}
  .chip{font:700 12px system-ui;border-radius:999px;padding:6px 12px;cursor:pointer;border:1px solid var(--line);
    background:var(--panel2);color:var(--ink);user-select:none}
  .chip.had{background:rgba(57,217,138,.16);border-color:rgba(57,217,138,.6);color:var(--green)}
  .chip.new{background:rgba(251,191,36,.15);border-color:rgba(251,191,36,.55);color:var(--amber)}
  .hint{font:600 11px system-ui;color:var(--dim);margin:2px 0 10px}
  .timeline{border-left:2px solid var(--line);margin:6px 0 4px;padding-left:14px}
  .tl{margin-bottom:12px}
  .tl .when{font:700 11px system-ui;color:var(--violet)}
  .tl .txt{margin-top:3px;color:#dbe4ee;line-height:1.5;white-space:pre-wrap}
  .tl .cf{font:700 10px system-ui;color:var(--dim);margin-top:3px}
  .node{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:14px;margin-bottom:10px}
  .node .nh{display:flex;align-items:baseline;gap:8px;justify-content:space-between}
  .node .nn{font:800 15px system-ui;color:var(--blue)}
  .node .nc{font:700 10px system-ui;color:var(--dim)}
  .node .links{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
  .node .lk{font:700 10px system-ui;color:var(--dim);background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px 9px}
  .empty{color:var(--dim);line-height:1.6;text-align:center;padding:34px 12px}
  .jotwrap{margin-top:10px}
  .jotwrap input{width:100%;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ink);font:600 13px system-ui;outline:none}
  .openq{font:600 12px system-ui;color:#cbd5e1;padding:6px 0 6px 16px;position:relative}
  .openq:before{content:"?";position:absolute;left:0;color:var(--amber);font-weight:800}
  .savedflash{color:var(--green);font:800 12px system-ui;opacity:0;transition:opacity .2s}
  .savedflash.show{opacity:1}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
"use strict";

/* ============================================================
   INKLING — the core learning-intelligence loop.
   Ask what you already think → capture it as a node → reveal the
   reality layer → let you refine (had vs. new) → track how your
   understanding evolves over time.  Self-contained, offline, guest-safe.
   ============================================================ */

const FIELDS = [
  { id:"ee", icon:"⚡", name:"Electrical Engineering",
    blurb:"From what electricity is, down to how a transistor thinks.",
    questions:[
      { id:"ee1", concept:"Electricity", q:"What do you think electricity actually is?",
        reality:{ summary:"Electricity is the flow of electric charge — usually electrons drifting through a conductor, pushed by a difference in electric potential (voltage). The surprising part: the energy is carried by the electromagnetic field around the wire, not by electrons racing along inside it.",
          concepts:["electric charge","electron","voltage","electric field","conductor"] } },
      { id:"ee2", concept:"Voltage & Current", q:"What is the difference between voltage and current?",
        reality:{ summary:"Voltage is the push — a difference in potential energy per unit charge, measured in volts. Current is the flow — how much charge moves per second, measured in amperes. Water helps: voltage is pressure, current is how fast the water flows. Resistance ties them together (Ohm's law: V = I × R).",
          concepts:["potential difference","ampere","resistance","Ohm's law"] } },
      { id:"ee3", concept:"Signal propagation", q:"Why does a light bulb turn on instantly when a switch is flipped?",
        reality:{ summary:"The electrons themselves drift shockingly slowly — millimeters per second. But the electric field that pushes them propagates through the whole circuit at nearly the speed of light, so every electron 'feels the push' almost instantly. The bulb lights because the field arrives, not because an electron traveled from the switch.",
          concepts:["drift velocity","electric field","energy transfer","speed of light"] } },
      { id:"ee4", concept:"Conductors & insulators", q:"How do materials decide whether electricity can flow through them?",
        reality:{ summary:"It comes down to how tightly a material holds its electrons. Conductors (metals) have loosely-bound 'free' electrons that move easily. Insulators hold electrons tightly. Semiconductors sit in between — and crucially, we can control whether they conduct, which is what makes computers possible.",
          concepts:["free electrons","band gap","semiconductor","doping"] } },
      { id:"ee5", concept:"Control & amplification", q:"How does a small electrical signal control something much larger?",
        reality:{ summary:"A tiny signal changes a device's resistance or state at a control terminal — a transistor's gate, or a relay's coil — which gates a much larger current flowing elsewhere. That's amplification and control: little input, big controlled output. It's the idea behind every amplifier, motor controller, and logic gate.",
          concepts:["transistor","gate","relay","amplification","gain"] } },
      { id:"ee6", concept:"Transistor", q:"What do you think a transistor does inside a computer?",
        reality:{ summary:"A transistor is an electrically-controlled switch. A small voltage on its gate either lets current flow (a 1) or blocks it (a 0) — no moving parts. Wire billions of them together and those on/off switches become logic gates, memory, and eventually every decision a computer makes.",
          concepts:["switch","gate voltage","logic gate","on/off states"] } },
      { id:"ee7", concept:"Information as electricity", q:"How does information become represented using electricity?",
        reality:{ summary:"We agree on a convention: a high voltage means 1, a low voltage means 0. Patterns of those bits encode numbers, letters, and instructions. Logic gates transform the patterns, and that transformation IS computation — information becomes physical, then gets reshaped by electricity.",
          concepts:["binary","bit","voltage threshold","encoding","logic"] } }
    ] },

  { id:"ai", icon:"🤖", name:"Artificial Intelligence",
    blurb:"How a machine can 'learn' without ever understanding.",
    questions:[
      { id:"ai1", concept:"Machine learning", q:"What do you think 'learning' means for a machine?",
        reality:{ summary:"Learning for a machine means adjusting a huge set of internal numbers (weights) so its output matches the examples it's shown, over and over. It isn't understanding — it's fitting patterns by nudging numbers to reduce error. Powerful, but mechanical.",
          concepts:["weights","training data","error / loss","gradient"] } },
      { id:"ai2", concept:"Neural network", q:"How does a neural network make a decision?",
        reality:{ summary:"Inputs flow through layers of weighted sums followed by simple nonlinear functions. Each weight tilts the answer a little; stacked together, the layers can carve complex boundaries. The 'decision' is just the number that comes out the far end.",
          concepts:["neuron","weight","activation","layer"] } },
      { id:"ai3", concept:"Model parameters", q:"Where does an AI's 'knowledge' actually live?",
        reality:{ summary:"Not in a database of facts — in the numbers (parameters) learned during training, smeared across the whole network. Knowledge is distributed: no single number holds a fact, the pattern of millions of them does.",
          concepts:["parameters","distributed representation","training"] } },
      { id:"ai4", concept:"Prediction vs understanding", q:"What's the difference between an AI predicting and understanding?",
        reality:{ summary:"A model predicts the most likely next output from patterns it has seen. That can be extremely useful and still not be understanding — the model has no grasp of meaning, only of what tends to follow what. Keeping that distinction sharp is how you use AI wisely.",
          concepts:["prediction","pattern","generalization"] } }
    ] },

  { id:"robotics", icon:"🦾", name:"Robotics & Automation",
    blurb:"Sense, decide, move — and the industrial controls behind it.",
    questions:[
      { id:"rb1", concept:"Feedback & sensing", q:"How does a robot know where its arm is?",
        reality:{ summary:"Sensors called encoders report each joint's position. A control loop constantly compares where the arm SHOULD be to where it IS, and corrects the difference. Without that feedback loop, a robot is blind to its own body.",
          concepts:["encoder","feedback loop","actuator","error"] } },
      { id:"rb2", concept:"Actuation", q:"How does a robot turn a decision into movement?",
        reality:{ summary:"A controller sends signals to motors — often through drivers or variable-frequency drives (VFDs). Current through the motor's coils creates torque, which moves the joint. Decision → signal → current → torque → motion.",
          concepts:["motor","controller","torque","VFD / driver"] } },
      { id:"rb3", concept:"Autonomy", q:"What makes a robot 'autonomous'?",
        reality:{ summary:"A robot is autonomous when it runs its own sense → decide → act loop using an internal model of the world, without a human steering each step. The intelligence is in that loop, not in any single part.",
          concepts:["perception","planning","control loop"] } },
      { id:"rb4", concept:"PLC / industrial control", q:"How does a PLC fit into industrial automation?",
        reality:{ summary:"A PLC (Programmable Logic Controller) is a rugged industrial computer that reads sensor inputs and drives outputs on a fast, repeating scan cycle to control machinery. It's the backbone of industrial controls — the exact world an electrician moves toward in the later years of the trade.",
          concepts:["PLC","ladder logic","I/O","scan cycle"] } }
    ] },

  { id:"cs", icon:"💻", name:"Computer Science",
    blurb:"What a program really is, all the way down to the transistors.",
    questions:[
      { id:"cs1", concept:"Program", q:"What is a program, really?",
        reality:{ summary:"A program is a precise list of instructions the CPU executes one step at a time. No magic — just an ordered recipe, followed exactly, very fast.",
          concepts:["instruction","CPU","execution"] } },
      { id:"cs2", concept:"Memory", q:"How does a computer remember things?",
        reality:{ summary:"Data lives as bits in memory cells, each reachable by a numeric address. RAM is fast but forgets when powered off; storage is slower but persists. 'Remembering' is just reading the bits back from an address.",
          concepts:["bit","RAM","address","storage"] } },
      { id:"cs3", concept:"Execution", q:"What happens when you run code?",
        reality:{ summary:"Your source is translated into machine instructions, loaded into memory, and executed by the CPU as a running process. The words you wrote become numbers the hardware knows how to obey.",
          concepts:["compiler","machine code","process"] } },
      { id:"cs4", concept:"Abstraction stack", q:"How does one line of code become electricity doing work?",
        reality:{ summary:"Layers: your language → machine code → logic gates → transistors switching on and off. Every line you write is an abstraction sitting on top of electricity moving through silicon. This is where computer science and electrical engineering become the same story.",
          concepts:["abstraction","machine code","logic gate","transistor"] } }
    ] },

  { id:"physics", icon:"🌌", name:"Physics",
    blurb:"Energy, force, and fields — the rules underneath everything.",
    questions:[
      { id:"ph1", concept:"Energy", q:"What is energy?",
        reality:{ summary:"Energy is the capacity to do work — to move or change something. It's never created or destroyed, only transformed between forms (motion, heat, electrical, chemical). That conservation is one of physics' deepest rules.",
          concepts:["work","conservation","forms of energy"] } },
      { id:"ph2", concept:"Gravity", q:"Why do things fall?",
        reality:{ summary:"Mass warps spacetime, and objects follow that curvature — which we feel as a force. Near Earth's surface it accelerates everything at about 9.8 m/s² regardless of mass.",
          concepts:["mass","acceleration","force","field"] } },
      { id:"ph3", concept:"Field", q:"What is a field?",
        reality:{ summary:"A field assigns a value to every point in space — electric, magnetic, or gravitational — and that value tells a nearby object what force it will feel. The electric field you meet in EE is the same kind of idea as gravity.",
          concepts:["field","force","potential"] } },
      { id:"ph4", concept:"Electromagnetism", q:"How does light carry energy?",
        reality:{ summary:"Light is an oscillating electric and magnetic field propagating together as a wave — also describable as particles called photons. The same electromagnetism that lights your room runs your circuits.",
          concepts:["wave","photon","EM spectrum"] } }
    ] },

  { id:"math", icon:"📐", name:"Mathematics",
    blurb:"Functions, variables, graphs — the language of relationships.",
    questions:[
      { id:"ma1", concept:"Function", q:"What is a function?",
        reality:{ summary:"A function is a rule that takes each input to exactly one output — a machine: put a number in, get a number out. Almost all of math and physics is really the study of functions.",
          concepts:["input","output","mapping"] } },
      { id:"ma2", concept:"Variables", q:"Why do we use variables like x?",
        reality:{ summary:"A variable is a placeholder for an unknown or changing quantity. It lets you describe a relationship once and apply it to every case at once — that generality is the whole power of algebra.",
          concepts:["variable","relationship","generalization"] } },
      { id:"ma3", concept:"Graphs", q:"What does a graph actually show?",
        reality:{ summary:"A graph is a picture of how one quantity changes as another changes. The shape of the curve IS the relationship — a steep line means fast change, a flat one means none.",
          concepts:["axis","slope","relationship"] } },
      { id:"ma4", concept:"Quadratics", q:"Where would 3x² + 2x show up in real life?",
        reality:{ summary:"Anywhere acceleration, area, or optimization appears: a car's stopping distance grows with the square of speed, a thrown object traces a parabola, and a motor's power curve bends quadratically. The x² term is what makes the change speed up.",
          concepts:["quadratic","rate of change","optimization"] } }
    ] }
];

/* ============================================================
   THE INITIAL UNDERSTANDING PROTOCOL
   A guided onboarding conversation — not a personality test. Each
   answer seeds a typed first node (curiosity / question / goal /
   style / reasoning / future-question / personal-timeline). The goal
   is to understand the LEARNER before guiding the learning.
   ============================================================ */
const PROTOCOL = [
  { cat:"Your current mindset", color:"var(--violet)",
    lead:"No right answers here — Inkling is learning who you are.",
    items:[
      { id:"m1", node:"curiosity",  q:"What is something you wish you understood deeply?" },
      { id:"m2", node:"curiosity",  q:"What topics do you find yourself returning to, again and again?" },
      { id:"m3", node:"question",   q:"What question has stayed with you for years?" },
      { id:"m4", node:"discovery",  q:"What did you learn recently that changed how you see the world?" },
      { id:"m5", node:"confusion",  q:"What feels obvious to everyone else, but confusing to you?" }
    ] },
  { cat:"How you think", color:"var(--blue)",
    lead:"This shapes how Inkling explains things back to you.",
    items:[
      { id:"t1", node:"style", q:"When you learn something new, what works best for you?",
        choices:["Examples","Explanations","Experiments","Visuals","Building things"], multi:true },
      { id:"t2", node:"reasoning", q:"When something doesn't make sense, what usually helps you finally get it?" },
      { id:"t3", node:"style", q:"Do you like the big picture first, or the small mechanisms first?",
        choices:["Big picture first","Small mechanisms first","It depends"], multi:false },
      { id:"t4", node:"reasoning", q:"Think of an explanation that finally made something click. What was it?" }
    ] },
  { cat:"What pulls at you", color:"var(--pink)", fieldsStep:true,
    lead:"Pick the fields you're drawn to — this seeds your first map." },
  { cat:"What you want to understand", color:"var(--amber)",
    lead:"Reach as far as you want. These become questions to chase.",
    items:[
      { id:"q1", node:"future_question", q:"If one person could answer any question about reality, what would you ask?" },
      { id:"q2", node:"goal", q:"If you could understand one technology completely, what would it be?" },
      { id:"q3", node:"goal", q:"What problem in the world would you most want to help solve?" },
      { id:"q4", node:"future_question", q:"What do you think humans still don't understand?" }
    ] },
  { cat:"The story that shaped you", color:"var(--green)",
    lead:"How you learn was shaped by a life. This is part of the record.",
    items:[
      { id:"p1", node:"personal", q:"What experiences shaped the way you think?" },
      { id:"p2", node:"personal", q:"What moment changed your perspective?" },
      { id:"p3", node:"personal", q:"What interest has followed you your whole life?" },
      { id:"p4", node:"personal", q:"What's an idea you've changed your mind about?" }
    ] }
];
// canonical learning spine + field keyword signatures (offline recommendation)
const SPINE = ["math","physics","ee","cs","ai","robotics"];
const FIELD_KW = {
  math:["math","algebra","calculus","equation","number","geometry","function","statistic"],
  physics:["physic","energy","force","atom","matter","quantum","light","gravity","field","wave"],
  ee:["electric","voltage","current","circuit","power","wire","transistor","signal","electronic"],
  cs:["code","coding","program","software","computer","computing","algorithm","data"],
  ai:["ai","artificial intelligence","machine learning","neural","intelligence","model","learn from data","llm"],
  robotics:["robot","automation","motor","arm","plc","industrial control","machine","actuator","autonom"]
};

/* ============================================================
   THE INKLING INTERPRETER — intelligence routing.
   You just say something. Inkling reads it, decides what KIND of
   thing it is, and files it in the right system. You never sort it.
   Conversation → Interpreter → {knowledge, question, path, goal,
   memory, story, reflection, flashcard}. Offline heuristic classifier.
   ============================================================ */
const ROUTES = {
  knowledge:{icon:"🧠",label:"Knowledge node",color:"var(--blue)",system:"Knowledge graph",verb:"added to your knowledge graph"},
  question:{icon:"❓",label:"Question",color:"var(--amber)",system:"Open questions",verb:"filed as an open question to chase"},
  path:{icon:"🧭",label:"Learning path",color:"var(--green)",system:"Study maps",verb:"opened as a learning path"},
  goal:{icon:"🎯",label:"Goal",color:"var(--green)",system:"Goals",verb:"set as a goal"},
  memory:{icon:"📌",label:"Memory",color:"var(--amber)",system:"Memory",verb:"remembered about you"},
  story:{icon:"📖",label:"Story event",color:"var(--violet)",system:"Storybook",verb:"added to your story"},
  reflection:{icon:"🪞",label:"Reflection",color:"var(--violet)",system:"Reflection",verb:"kept as a reflection"},
  flashcard:{icon:"🗂️",label:"Flashcard",color:"var(--pink)",system:"Flashcards",verb:"saved as a study item"}
};
const ROUTE_ORDER=["knowledge","question","path","goal","memory","story","reflection","flashcard"];

function detectLinks(low){
  const found=new Map();  // lowercase key → display label (dedupe case-insensitively)
  const add=v=>{ const k=v.toLowerCase(); if(!found.has(k)) found.set(k,v); };
  FIELDS.forEach(f=>{
    (FIELD_KW[f.id]||[]).forEach(k=>{ if(low.includes(k)) add(f.name); });
    f.questions.forEach(q=>{
      if(low.includes(" "+q.concept.toLowerCase())) add(q.concept);
      (q.reality.concepts||[]).forEach(c=>{ if(low.includes(c.toLowerCase())) add(c); });
    });
  });
  return [...found.values()].slice(0,6);
}
function classify(t){
  const s=t.trim(); const low=" "+s.toLowerCase().replace(/\s+/g," ")+" ";
  const links=detectLinks(low); const has=re=>re.test(low);
  let type="knowledge", reason="It introduces an idea, so Inkling stored it in your knowledge graph.";
  if(has(/\b(i want to|i'd like to|i wanna|help me|i need to) (learn|study|master|understand how)\b/)||has(/\bteach me\b/)||has(/\bget (into|started with)\b/)||has(/\bwhere do i (start|begin)\b/)||has(/\bhow do i learn\b/)){
    type="path"; reason="You're setting out to learn a subject, so Inkling opened a learning path.";
  } else if(has(/\b[a-z]+ means [a-z]+/)||has(/\bstands for\b/)||/^[^?]{2,40}:\s+\S+/.test(s)||has(/\b(i keep|i always) (forget|forgetting|mixing up|confusing)\b/)){
    type="flashcard"; reason="There's a term and a meaning here, so Inkling made it a study item.";
  } else if(has(/\bmy goal\b/)||has(/\bi want to be\b/)||has(/\b(i want to|i'm trying to|i plan to|i hope to|i aim to|one day i|someday i|i will) (build|make|create|become|design|invent|solve|start|launch|work)\b/)){
    type="goal"; reason="You named something you're working toward, so Inkling set it as a goal.";
  } else if(has(/\bi (prefer|learn best|always|usually|tend to|work better)\b/)||has(/\bremember that i\b/)||has(/\bnote that i\b/)||has(/\bfor me,? [a-z]/)||has(/\bi'm the kind of\b/)){
    type="memory"; reason="This is lasting context about you, so Inkling will remember it.";
  } else if(has(/\bit clicked\b/)||has(/\bfinally (understand|get|got|clicked)\b/)||has(/\bnow i (understand|get|see|know)\b/)||has(/\bi used to think\b/)||has(/\bi connected\b/)||has(/\bchanged how i (see|think)\b/)||has(/\bmakes sense now\b/)){
    type="story"; reason="This is a real shift in your understanding, so Inkling added it to your story.";
  } else if(has(/\bi (feel|realized|realize|realised|noticed)\b/)||has(/\bi've been thinking\b/)||has(/\blately\b/)){
    type="reflection"; reason="This reads as a reflection, so Inkling kept it as one.";
  } else if(/\?\s*$/.test(s)||has(/^ (how|why|what|when|where|who|which|does|do|can|could|is|are|should|would|will|if)\b/)){
    type="question"; reason="You asked something, so Inkling filed it as an open question to chase.";
  }
  return {type,links,reason};
}

/* ---- storage ---- */
const KEY = "inkling-mind-v1";
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; } }
function save(d){ try{ localStorage.setItem(KEY, JSON.stringify(d)); }catch(e){} }
let DB = load();
DB.answers = DB.answers || {};   // {qid:[{text,conf,at}]}
DB.refine  = DB.refine  || {};   // {qid:{had:[i],new:[i]}}
DB.openQs  = DB.openQs  || {};   // {qid:[str]}
DB.breakthroughs = DB.breakthroughs || {};  // {qid:[timestamp,...]} — moments it clicked
DB.profile = DB.profile || { answers:{}, fields:[], done:false, startedAt:0, completedAt:0 };
DB.captures = DB.captures || [];  // interpreter output: [{id,text,type,links,reason,at}]
function persist(){ save(DB); }

/* ---- helpers ---- */
const CONF = ["Just guessing","A rough idea","Fairly confident","I understand it","I could teach it"];
const CONF_COLOR = ["#64748b","#3b82f6","#22d3ee","#39d98a","#f0abfc"];
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function fieldById(id){ return FIELDS.find(f=>f.id===id); }
function qById(fid,qid){ return (fieldById(fid).questions||[]).find(q=>q.id===qid); }
function fmtDate(ts){ const d=new Date(ts); return d.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}); }
function daysAgo(ts){ const d=Math.floor((Date.now()-ts)/86400000); return d<=0?"today":d===1?"1 day ago":d+" days ago"; }
function answered(qid){ return (DB.answers[qid]||[]).length>0; }
function versions(qid){ return DB.answers[qid]||[]; }

/* ---- router ---- */
let view = { name:"home", fid:null, qid:null };
const app = document.getElementById("app");
function go(v){ view=Object.assign({name:"home",fid:null,qid:null},v); render(); window.scrollTo(0,0); }

function chrome(inner, active){
  return `<div class="top">
      <div class="brand">🌱 Inkling<small>your evolving model of how the world works</small></div>
      <div class="nav">
        <button class="${active==='onboard'?'on':''}" onclick="go({name:'onboard',step:0})">🌱 Seed</button>
        <button class="${active==='router'?'on':''}" onclick="go({name:'router'})">💬 Talk</button>
        <button class="${active==='home'?'on':''}" onclick="go({name:'home'})">⚡ Fields</button>
        <button class="${active==='model'?'on':''}" onclick="go({name:'model'})">🧠 Model</button>
      </div>
    </div>${inner}`;
}

function render(){
  if(view.name==="onboard") return renderOnboard();
  if(view.name==="router") return renderRouter();
  if(view.name==="home") return renderHome();
  if(view.name==="field") return renderField();
  if(view.name==="question") return renderQuestion();
  if(view.name==="timeline") return renderTimeline();
  if(view.name==="model") return renderModel();
}

/* ---- QUESTION: capture → reality → refine ---- */
function renderQuestion(){
  const f=fieldById(view.fid), q=qById(view.fid,view.qid);
  const vs=versions(q.id);
  const hasAns=vs.length>0;
  const latest=hasAns?vs[vs.length-1]:null;

  // prior-answer timeline (evolution)
  let tl="";
  if(hasAns){
    tl=`<div class="panel"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 9px">
        <h3 style="font:800 12px system-ui;color:var(--violet);margin:0;text-transform:uppercase;letter-spacing:.04em">How your thinking has evolved</h3>
        <button class="btn ghost" style="padding:6px 12px;font:800 11px system-ui" onclick="go({name:'timeline',fid:'${f.id}',qid:'${q.id}'})">📖 Full timeline ›</button></div>
      <div class="timeline">${vs.map(v=>`<div class="tl">
        <div class="when">${fmtDate(v.at)} · ${daysAgo(v.at)}</div>
        <div class="txt">${esc(v.text)}</div>
        <div class="cf">confidence: ${CONF[v.conf]}</div></div>`).join("")}</div></div>`;
  }

  const promptTitle = hasAns ? "Explain it again — how do you see it now?" : "In your own words, what do you think?";
  const startConf = latest? latest.conf : 1;

  app.innerHTML = chrome(
    `<button class="back" onclick="go({name:'field',fid:'${f.id}'})">‹ ${esc(f.name)}</button>
     <div class="panel">
       <div class="concept-tag">${esc(q.concept)}</div>
       <div class="qbig">${esc(q.q)}</div>
       <div class="hint" style="margin-top:8px">${promptTitle}</div>
       <textarea id="ans" placeholder="Don't look anything up — just say what you believe right now. Being wrong here is the whole point.">${hasAns?"":""}</textarea>
       <div class="conf">
         <span class="lab">How sure are you?</span>
         <input id="conf" type="range" min="0" max="4" value="${startConf}" oninput="document.getElementById('cv').textContent=window.__CONF[this.value]">
         <span class="val" id="cv">${CONF[startConf]}</span>
       </div>
       <div style="display:flex;align-items:center;gap:12px">
         <button class="btn" onclick="captureAnswer('${f.id}','${q.id}')">${hasAns?"Save new version":"Capture my thinking"}</button>
         <span class="savedflash" id="saved">✓ saved to your model</span>
       </div>
     </div>
     ${tl}
     <div id="realityHost">${hasAns?realityHTML(f,q):""}</div>`, "home");
  window.__CONF=CONF;
}

function captureAnswer(fid,qid){
  const t=document.getElementById("ans").value.trim();
  if(!t){ document.getElementById("ans").focus(); return; }
  const conf=parseInt(document.getElementById("conf").value,10)||0;
  DB.answers[qid]=DB.answers[qid]||[];
  DB.answers[qid].push({ text:t, conf:conf, at:Date.now() });
  persist();
  const f=fieldById(fid), q=qById(fid,qid);
  const s=document.getElementById("saved"); s.classList.add("show"); setTimeout(()=>s.classList.remove("show"),1600);
  // reveal reality layer + refresh evolution timeline
  document.getElementById("ans").value="";
  document.getElementById("realityHost").innerHTML=realityHTML(f,q);
  document.getElementById("realityHost").scrollIntoView({behavior:"smooth",block:"start"});
  // re-render dot state next time field is viewed (data already saved)
}

function realityHTML(f,q){
  const rf=DB.refine[q.id]||{had:[],new:[]};
  const chips=q.reality.concepts.map((c,i)=>{
    const cls = rf.had.includes(i)?"chip had": rf.new.includes(i)?"chip new":"chip";
    const badge = rf.had.includes(i)?" ✓": rf.new.includes(i)?" ✦":"";
    return `<span class="${cls}" onclick="cycleChip('${f.id}','${q.id}',${i})">${esc(c)}${badge}</span>`;
  }).join("");
  const oqs=(DB.openQs[q.id]||[]);
  const oqHTML = oqs.length? `<div style="margin-top:6px">${oqs.map((o,i)=>`<div class="openq">${esc(o)}</div>`).join("")}</div>`:"";
  return `<div class="panel reality">
    <h3>◈ The reality layer</h3>
    <p>${esc(q.reality.summary)}</p>
    <h3 style="color:var(--pink)">Concepts this introduces</h3>
    <div class="hint">Tap each one: <b style="color:var(--green)">✓ I already had this</b> · tap again <b style="color:var(--amber)">✦ new to me</b>. This is your refinement — what shifted.</div>
    <div class="chips">${chips}</div>
    <h3 style="color:var(--amber);margin-top:14px">Questions this opens up</h3>
    <div class="hint">What are you still wondering? These become threads to pull later.</div>
    ${oqHTML}
    <div class="jotwrap"><input id="oq" placeholder="I still don't get… / what about…" onkeydown="if(event.key==='Enter')addOpenQ('${f.id}','${q.id}')"></div>
  </div>`;
}

function cycleChip(fid,qid,i){
  const rf=DB.refine[qid]||{had:[],new:[]};
  const inHad=rf.had.includes(i), inNew=rf.new.includes(i);
  rf.had=rf.had.filter(x=>x!==i); rf.new=rf.new.filter(x=>x!==i);
  if(!inHad&&!inNew) rf.had.push(i);        // none → had
  else if(inHad) rf.new.push(i);            // had → new
  // new → none
  DB.refine[qid]=rf; persist();
  document.getElementById("realityHost").innerHTML=realityHTML(fieldById(fid),qById(fid,qid));
}
function addOpenQ(fid,qid){
  const el=document.getElementById("oq"); const t=el.value.trim(); if(!t) return;
  DB.openQs[qid]=DB.openQs[qid]||[]; DB.openQs[qid].push(t); persist();
  document.getElementById("realityHost").innerHTML=realityHTML(fieldById(fid),qById(fid,qid));
  const nx=document.getElementById("oq"); if(nx) nx.focus();
}

/* ---- THE INTERPRETER surface: say anything, Inkling routes it ---- */
function renderRouter(){
  const caps=DB.captures.slice().sort((a,b)=>b.at-a.at);
  const counts={}; caps.forEach(c=>counts[c.type]=(counts[c.type]||0)+1);
  const strip = caps.length? `<div style="display:flex;gap:7px;flex-wrap:wrap;margin:2px 0 16px">
    ${ROUTE_ORDER.filter(t=>counts[t]).map(t=>`<span class="lk" style="border-color:${ROUTES[t].color}55;color:${ROUTES[t].color}">${ROUTES[t].icon} ${counts[t]} · ${ROUTES[t].system}</span>`).join("")}</div>`:"";
  const feed = caps.length
    ? caps.map(c=>capCard(c, window.__justCap===c.id)).join("")
    : `<div class="empty">Nothing yet.<br><span style="opacity:.8">Type a thought above — a question, something you learned, a goal. Inkling decides where it belongs.</span></div>`;
  app.innerHTML=chrome(
    `<h1>💬 Talk to Inkling</h1>
     <p class="sub">Say anything — a question, an idea, a thing that clicked, a goal. You never sort it: Inkling reads it and files it in the right system for you.</p>
     <div class="panel">
       <textarea id="capText" placeholder="e.g.  How does intelligence emerge from simple systems?   ·   I finally understand what a transistor does.   ·   I want to learn robotics." style="min-height:82px" onkeydown="if(event.key==='Enter'&&(event.metaKey||event.ctrlKey))interpret()"></textarea>
       <div style="display:flex;align-items:center;gap:10px;margin-top:12px">
         <button class="btn" onclick="interpret()">Interpret ›</button>
         <span class="hint" style="margin:0">Routes to: knowledge · question · path · goal · memory · story · reflection · card</span>
       </div>
     </div>
     ${strip}
     ${feed}`, "router");
}
function capCard(c, fresh){
  const R=ROUTES[c.type]||ROUTES.knowledge;
  const links=(c.links||[]).map(l=>`<span class="lk">${esc(l)}</span>`).join("");
  const reclass = ROUTE_ORDER.map(t=>`<span class="chip" title="${ROUTES[t].label}" style="padding:3px 8px;font-size:12px;${t===c.type?`background:${ROUTES[t].color}22;border-color:${ROUTES[t].color}`:''}" onclick="reclassify('${c.id}','${t}')">${ROUTES[t].icon}</span>`).join("");
  return `<div class="node" style="${fresh?`border-color:${R.color};box-shadow:0 0 0 1px ${R.color}66`:''}">
    <div class="nh"><span class="nn" style="color:${R.color}">${R.icon} ${R.label}</span><span class="nc">${R.verb} · ${daysAgo(c.at)}</span></div>
    <div style="margin-top:7px;color:#dbe4ee;line-height:1.5">${esc(c.text)}</div>
    ${fresh&&c.reason?`<div class="hint" style="margin-top:6px;color:${R.color}">✦ ${esc(c.reason)}</div>`:''}
    ${links?`<div class="links" style="margin-top:8px">${links}</div>`:''}
    <div style="margin-top:10px;display:flex;align-items:center;gap:5px;flex-wrap:wrap">
      <span class="hint" style="margin:0 3px 0 0">not right?</span>${reclass}
      <button class="back" style="margin-left:auto;color:var(--dim)" onclick="deleteCapture('${c.id}')">remove</button>
    </div>
  </div>`;
}
function interpret(){
  const el=document.getElementById("capText"); const t=(el.value||"").trim(); if(!t){ el.focus(); return; }
  const r=classify(t); const id="c"+Date.now();
  DB.captures.push({id,text:t,type:r.type,links:r.links,reason:r.reason,at:Date.now()});
  persist(); window.__justCap=id; renderRouter(); window.scrollTo(0,0);
}
function reclassify(id,type){
  const c=DB.captures.find(x=>x.id===id); if(!c) return;
  c.type=type; c.reason="You reclassified this — Inkling moved it to "+ROUTES[type].system+".";
  persist(); window.__justCap=id; renderRouter();
}
function deleteCapture(id){ DB.captures=DB.captures.filter(x=>x.id!==id); persist(); renderRouter(); }

/* ---- THE SEED: the Initial Understanding Protocol ---- */
function onbSteps(){
  const s=[{type:"welcome"}];
  PROTOCOL.forEach(cat=>{
    if(cat.fieldsStep){ s.push({type:"fields",cat:cat.cat,color:cat.color,lead:cat.lead}); return; }
    cat.items.forEach(it=> s.push({type:"q",cat:cat.cat,color:cat.color,lead:cat.lead,it}));
  });
  s.push({type:"synth"});
  return s;
}
function onbChip(val,multi){
  let sel=window.__ONBSEL||[];
  if(multi===false) sel=[val];
  else sel = sel.includes(val)? sel.filter(x=>x!==val) : sel.concat(val);
  window.__ONBSEL=sel;
  document.querySelectorAll("[data-onbchip]").forEach(el=>{
    const on=sel.includes(el.getAttribute("data-onbchip"));
    el.className = on?"chip had":"chip";
  });
}
function onbNext(i){
  const STEPS=onbSteps(), step=STEPS[i], P=DB.profile;
  if(step.type==="q"){
    if(step.it.choices){ P.answers[step.it.id]={choices:(window.__ONBSEL||[]).slice(),node:step.it.node,at:Date.now()}; }
    else { const t=(document.getElementById("onbText")||{}).value||""; if(t.trim()) P.answers[step.it.id]={text:t.trim(),node:step.it.node,at:Date.now()}; }
  } else if(step.type==="fields"){ P.fields=(window.__ONBSEL||[]).slice(); }
  persist(); go({name:"onboard",step:i+1});
}
function onbReflection(){
  const P=DB.profile, A=P.answers;
  const text=Object.values(A).map(a=>a.text||(a.choices||[]).join(" ")).join(" ").toLowerCase();
  const chosen=new Set(P.fields||[]); const score={};
  SPINE.forEach(f=>{ let s=chosen.has(f)?3:0; (FIELD_KW[f]||[]).forEach(k=>{ if(text.includes(k)) s+=1; }); score[f]=s; });
  let rel=SPINE.filter(f=>score[f]>0);
  if(!rel.length) rel = chosen.size? [...chosen] : ["ee"];
  rel.sort((a,b)=>SPINE.indexOf(a)-SPINE.indexOf(b));
  return { rel, score };
}
function renderOnboard(){
  const STEPS=onbSteps(); let i=view.step||0; i=Math.max(0,Math.min(i,STEPS.length-1));
  const step=STEPS[i], P=DB.profile;
  if(!P.startedAt){ P.startedAt=Date.now(); persist(); }
  const qTotal=STEPS.filter(s=>s.type==="q"||s.type==="fields").length;
  const qIndex=STEPS.slice(0,i+1).filter(s=>s.type==="q"||s.type==="fields").length;
  const pct = step.type==="welcome"?0 : step.type==="synth"?100 : Math.round(qIndex/qTotal*100);
  const bar = step.type==="welcome"?"" : `<div style="height:5px;border-radius:99px;background:rgba(255,255,255,.1);margin:0 0 16px;overflow:hidden"><div style="height:100%;width:${pct}%;background:linear-gradient(90deg,#39d98a,#a78bfa)"></div></div>`;

  // WELCOME
  if(step.type==="welcome"){
    const done=P.done;
    app.innerHTML=chrome(
      `<div class="panel" style="text-align:center;padding:28px 20px">
        <div style="font-size:46px;line-height:1">🌱</div>
        <h1 style="margin:10px 0 4px">The Seed</h1>
        <p class="sub" style="margin:0 auto 16px;max-width:470px">Before Inkling guides your learning, it wants to understand <b>you</b> — what you're curious about, how you think, what you're chasing. This isn't a test. It's the conversation that plants the first nodes of your knowledge graph.</p>
        ${done? `<div class="hint" style="margin-bottom:12px">You planted your seed on ${fmtDate(P.completedAt||P.startedAt)}. You can revisit and let it keep growing.</div>
          <button class="btn" onclick="go({name:'onboard',step:${STEPS.length-1}})">See your first path ›</button>
          <div style="margin-top:10px"><button class="back" onclick="go({name:'onboard',step:1})">Answer the questions again</button></div>`
        : `<button class="btn" onclick="go({name:'onboard',step:1})">Plant the seed ›</button>
          <div style="margin-top:12px"><button class="back" onclick="go({name:'home'})">Skip for now</button></div>`}
      </div>`, "onboard");
    return;
  }

  // SYNTHESIS — Inkling's first reflection + recommended path
  if(step.type==="synth"){
    if(!P.done){ P.done=true; P.completedAt=Date.now(); persist(); }
    const A=P.answers;
    const say=id=> A[id]&&A[id].text ? A[id].text : "";
    const choiceOf=id=> A[id]&&A[id].choices ? A[id].choices.join(", ") : "";
    const {rel}=onbReflection();
    const relNames=rel.map(f=>`${fieldById(f).icon} ${fieldById(f).name}`);
    // ordered concrete path: up to 2 opening concepts per relevant field, along the spine
    const path=[]; rel.forEach(f=>{ const fd=fieldById(f); fd.questions.slice(0,2).forEach(q=>path.push({icon:fd.icon,c:q.concept,fid:f,qid:q.id})); });
    const questions=[["q1"],["m3"],["q4"],["q3"]].map(([id])=>say(id)).filter(Boolean);
    const reflect=[];
    if(say("m1")) reflect.push(`You most want to understand <b>“${esc(say("m1"))}”</b>.`);
    if(say("m2")) reflect.push(`Your curiosity keeps returning to <b>${esc(say("m2"))}</b>.`);
    if(choiceOf("t1")) reflect.push(`You learn best through <b>${esc(choiceOf("t1")).toLowerCase()}</b>${choiceOf("t3")?`, and you prefer the <b>${esc(choiceOf("t3")).toLowerCase()}</b>`:""}.`);
    if(say("q2")) reflect.push(`If you could master one technology, it'd be <b>${esc(say("q2"))}</b>.`);
    if(say("q3")) reflect.push(`You'd want your learning to help <b>${esc(say("q3"))}</b>.`);
    if(say("p3")) reflect.push(`An interest that has followed you your whole life: <b>${esc(say("p3"))}</b>.`);

    app.innerHTML=chrome(
      `${bar}
       <div style="text-align:center;margin-bottom:6px"><div style="font-size:34px">🌱→🌿</div></div>
       <h1 style="text-align:center;margin-bottom:2px">Your seed is planted</h1>
       <p class="sub" style="text-align:center">Inkling's first reflection of you. This grows every time you learn.</p>

       ${reflect.length? `<div class="panel"><h3 style="font:800 12px system-ui;color:var(--violet);margin:0 0 9px;text-transform:uppercase;letter-spacing:.04em">Who you are, as a learner</h3>
         ${reflect.map(r=>`<div style="padding:6px 0;border-bottom:1px solid var(--line);line-height:1.5;color:#dbe4ee">${r}</div>`).join("")}</div>`:""}

       <div class="panel"><h3 style="font:800 12px system-ui;color:var(--blue);margin:0 0 8px;text-transform:uppercase;letter-spacing:.04em">Your strongest connection areas</h3>
         <div style="font:800 16px system-ui;line-height:1.5">${relNames.join(' <span style="color:var(--dim)">→</span> ')}</div>
         <div class="hint" style="margin-top:6px">These fields build on each other — the same ideas flow from one into the next.</div></div>

       <div class="panel"><h3 style="font:800 12px system-ui;color:var(--green);margin:0 0 10px;text-transform:uppercase;letter-spacing:.04em">Your first exploration path</h3>
         ${path.map((p,n)=>`<button class="qrow" style="margin-bottom:7px" onclick="go({name:'question',fid:'${p.fid}',qid:'${p.qid}'})">
            <span style="flex:0 0 auto;width:22px;height:22px;border-radius:50%;background:rgba(57,217,138,.16);color:var(--green);font:800 11px system-ui;display:flex;align-items:center;justify-content:center">${n+1}</span>
            <span><span class="qt">${p.icon} ${esc(p.c)}</span></span></button>`).join("")}</div>

       ${questions.length? `<div class="panel"><h3 style="font:800 12px system-ui;color:var(--amber);margin:0 0 8px;text-transform:uppercase;letter-spacing:.04em">Your first questions to chase</h3>
         ${questions.map(q=>`<div class="openq">${esc(q)}</div>`).join("")}
         <div class="hint" style="margin-top:8px">Inkling will hold these. As you learn, it'll show you where they get answered.</div></div>`:""}

       <button class="btn" style="width:100%" onclick="go({name:'question',fid:'${path[0]?path[0].fid:'ee'}',qid:'${path[0]?path[0].qid:'ee1'}'})">Begin your first exploration ›</button>
       <div style="text-align:center;margin-top:10px"><button class="back" onclick="go({name:'model'})">Or see your model</button></div>`, "onboard");
    return;
  }

  // A QUESTION (free-text) or FIELDS picker or CHOICE question
  let bodyHTML="";
  if(step.type==="fields"){
    window.__ONBSEL=(P.fields||[]).slice();
    bodyHTML=`<div class="chips">${FIELDS.map(f=>`<span data-onbchip="${f.id}" class="${(P.fields||[]).includes(f.id)?'chip had':'chip'}" onclick="onbChip('${f.id}',true)">${f.icon} ${esc(f.name)}</span>`).join("")}</div>
      <div class="hint" style="margin-top:8px">Pick as many as pull at you — you can always add more later.</div>`;
  } else if(step.it.choices){
    const prev=(P.answers[step.it.id]&&P.answers[step.it.id].choices)||[];
    window.__ONBSEL=prev.slice();
    bodyHTML=`<div class="chips">${step.it.choices.map(c=>`<span data-onbchip="${esc(c)}" class="${prev.includes(c)?'chip had':'chip'}" onclick="onbChip('${esc(c)}',${step.it.multi?'true':'false'})">${esc(c)}</span>`).join("")}</div>
      <div class="hint" style="margin-top:8px">${step.it.multi?"Choose any that fit.":"Choose one."}</div>`;
  } else {
    const prev=(P.answers[step.it.id]&&P.answers[step.it.id].text)||"";
    bodyHTML=`<textarea id="onbText" placeholder="Take your time. Whatever's true for you.">${esc(prev)}</textarea>`;
  }
  const qtext = step.type==="fields" ? "Which of these pull at you?" : step.it.q;
  app.innerHTML=chrome(
    `${bar}
     <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
       <span style="font:800 11px system-ui;color:${step.color};text-transform:uppercase;letter-spacing:.05em">${esc(step.cat)}</span>
       <span class="hint" style="margin:0">${qIndex} of ${qTotal}</span></div>
     <div class="panel">
       <div class="qbig">${esc(qtext)}</div>
       <div class="hint" style="margin:6px 0 12px">${esc(step.lead||"")}</div>
       ${bodyHTML}
       <div style="display:flex;align-items:center;gap:10px;margin-top:14px">
         <button class="btn" onclick="onbNext(${i})">Continue ›</button>
         <button class="back" onclick="go({name:'onboard',step:${i+1}})">Skip</button>
       </div>
     </div>
     <button class="back" onclick="go({name:'onboard',step:${i-1}})">‹ Back</button>`, "onboard");
}

/* ---- CONCEPT TIMELINE: the biography of one idea in your mind ----
   First encounter → the path → breakthroughs → where you are now →
   what's still open.  This is how you meet a past version of yourself. */
function renderTimeline(){
  const f=fieldById(view.fid), q=qById(view.fid,view.qid);
  const vs=versions(q.id);
  if(!vs.length) return go({name:"question",fid:view.fid,qid:view.qid});
  const first=vs[0], now=vs[vs.length-1];
  const bt=DB.breakthroughs[q.id]||[];
  const openQ=DB.openQs[q.id]||[];
  const rf=DB.refine[q.id]||{had:[],new:[]};

  // confidence arc across every version
  const arc = vs.map(v=>`<i title="${fmtDate(v.at)} · ${CONF[v.conf]}" style="width:14px;height:14px;border-radius:50%;background:${CONF_COLOR[v.conf]};box-shadow:0 0 0 3px ${CONF_COLOR[v.conf]}22;flex:0 0 auto"></i>`)
    .join(`<span style="flex:1;height:2px;background:var(--line);min-width:12px"></span>`);
  const arcRow = vs.length>1
    ? `<div class="panel"><h3 style="font:800 12px system-ui;color:var(--amber);margin:0 0 11px;text-transform:uppercase;letter-spacing:.04em">Confidence over time</h3>
        <div style="display:flex;align-items:center;gap:0">${arc}</div>
        <div style="display:flex;justify-content:space-between;font:700 10px system-ui;color:var(--dim);margin-top:7px">
          <span>${CONF[first.conf]} · ${fmtDate(first.at)}</span><span>${CONF[now.conf]} · now</span></div></div>` : "";

  // the path — every version, each markable as a breakthrough
  const path = vs.map((v,i)=>{
    const isBt=bt.includes(v.at);
    const tag = i===0 ? "① first encounter" : (i===vs.length-1 && vs.length>1 ? "where you are now" : "revisited");
    const tagColor = i===0 ? "var(--blue)" : (i===vs.length-1 && vs.length>1 ? "var(--green)" : "var(--violet)");
    return `<div class="tl" style="${isBt?'background:rgba(240,171,252,.06);border-radius:10px;padding:9px 11px;margin-left:-11px':''}">
      <div class="when" style="color:${tagColor}">${tag} · ${fmtDate(v.at)} · ${daysAgo(v.at)}${isBt?" · ✦ breakthrough":""}</div>
      <div class="txt">${esc(v.text)}</div>
      <div class="cf">confidence: ${CONF[v.conf]}
        <button style="margin-left:10px;background:${isBt?'rgba(240,171,252,.16)':'var(--panel2)'};border:1px solid ${isBt?'rgba(240,171,252,.55)':'var(--line)'};color:${isBt?'var(--pink)':'var(--dim)'};border-radius:999px;padding:3px 10px;font:700 10px system-ui;cursor:pointer"
          onclick="toggleBreakthrough('${q.id}',${v.at})">${isBt?"★ breakthrough moment":"✦ mark as breakthrough"}</button></div>
    </div>`;
  }).join("");

  const btBlock = bt.length ? `<div class="panel"><h3 style="font:800 12px system-ui;color:var(--pink);margin:0 0 8px;text-transform:uppercase;letter-spacing:.04em">Breakthrough moments</h3>
    <div class="hint" style="margin:0 0 8px">The times it clicked — when a connection formed and your understanding jumped.</div>
    ${vs.filter(v=>bt.includes(v.at)).map(v=>`<div class="openq" style="color:var(--pink)">${fmtDate(v.at)} — “${esc(v.text.slice(0,110))}${v.text.length>110?"…":""}”</div>`).join("")}</div>` : "";

  const nowBlock = vs.length>1 ? `<div class="panel" style="border-color:rgba(57,217,138,.4)">
    <h3 style="font:800 12px system-ui;color:var(--green);margin:0 0 8px;text-transform:uppercase;letter-spacing:.04em">Where you are now</h3>
    <div class="txt" style="color:#dbe4ee;line-height:1.55">${esc(now.text)}</div>
    <div class="cf" style="margin-top:6px">confidence: ${CONF[now.conf]} · you started at “${CONF[first.conf]}”</div></div>` : "";

  const openBlock = `<div class="panel"><h3 style="font:800 12px system-ui;color:var(--amber);margin:0 0 8px;text-transform:uppercase;letter-spacing:.04em">Questions & challenges this opened</h3>
    <div class="hint" style="margin:0 0 8px">The gaps you noticed — threads to keep pulling.</div>
    ${openQ.length? openQ.map(o=>`<div class="openq">${esc(o)}</div>`).join("") : `<div class="hint">None jotted yet.</div>`}</div>`;

  app.innerHTML = chrome(
    `<button class="back" onclick="go({name:'model'})">‹ Your model</button>
     <div class="concept-tag">${f.icon} ${esc(f.name)}</div>
     <h1 style="margin-bottom:2px">${esc(q.concept)}</h1>
     <p class="sub">First met ${fmtDate(first.at)} · ${vs.length} version${vs.length>1?"s":""} of your understanding</p>

     <div class="panel"><h3 style="font:800 12px system-ui;color:var(--blue);margin:0 0 7px;text-transform:uppercase;letter-spacing:.04em">The question that started it</h3>
       <div style="font:700 15px system-ui;line-height:1.4">“${esc(q.q)}”</div></div>

     ${arcRow}
     <div class="panel"><h3 style="font:800 12px system-ui;color:var(--violet);margin:0 0 11px;text-transform:uppercase;letter-spacing:.04em">The path your understanding took</h3>
       <div class="timeline">${path}</div></div>
     ${btBlock}
     ${nowBlock}
     ${openBlock}

     <button class="btn pink" onclick="go({name:'question',fid:'${f.id}',qid:'${q.id}'})">Explain it again — add a new version ›</button>`, "model");
}

function toggleBreakthrough(qid,at){
  const arr=DB.breakthroughs[qid]||[];
  DB.breakthroughs[qid]= arr.includes(at)? arr.filter(x=>x!==at) : arr.concat(at);
  persist(); renderTimeline();
}

/* ---- YOUR MODEL: every captured concept as a living node ---- */
function renderModel(){
  const nodes=[];
  let totalAns=0, totalRevisits=0, openCount=0;
  FIELDS.forEach(f=>f.questions.forEach(q=>{
    const vs=versions(q.id); if(!vs.length) return;
    totalAns++; totalRevisits+=Math.max(0,vs.length-1);
    openCount+=(DB.openQs[q.id]||[]).length;
    const rf=DB.refine[q.id]||{had:[],new:[]};
    nodes.push({f,q,vs,rf});
  }));

  if(!nodes.length){
    const seedLine = DB.profile.done
      ? `<button class="btn" onclick="go({name:'onboard',step:${onbSteps().length-1}})">See your first path ›</button>`
      : `<button class="btn" onclick="go({name:'onboard',step:0})">🌱 Plant The Seed ›</button>`;
    app.innerHTML=chrome(`<h1>🧠 Your model</h1>
      <div class="empty">Nothing captured yet.<br><span style="opacity:.8">Answer a discovery question and it becomes a living node here — your own map of what you understand, and how it changes.</span><br><br>
      ${seedLine}</div>`, "model");
    return;
  }

  // stat strip
  const stat=`<div style="display:flex;gap:9px;flex-wrap:wrap;margin-bottom:16px">
    ${[["nodes",nodes.length,"var(--blue)"],["revisits",totalRevisits,"var(--violet)"],["open questions",openCount,"var(--amber)"]]
      .map(([l,n,c])=>`<div style="flex:1;min-width:96px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 13px">
        <div style="font:800 22px system-ui;color:${c}">${n}</div><div style="font:700 11px system-ui;color:var(--dim)">${l}</div></div>`).join("")}
  </div>`;

  const cards=nodes.map(({f,q,vs,rf})=>{
    const latest=vs[vs.length-1];
    const first=vs[0];
    const evo = vs.length>1
      ? `<div style="margin-top:9px;font:600 12px system-ui;color:#cbd5e1;line-height:1.5">
           <span style="color:var(--dim)">then (${fmtDate(first.at)}):</span> “${esc(first.text.slice(0,120))}${first.text.length>120?"…":""}”<br>
           <span style="color:var(--violet)">now (${fmtDate(latest.at)}):</span> “${esc(latest.text.slice(0,120))}${latest.text.length>120?"…":""}”</div>`
      : `<div style="margin-top:9px;font:600 12px system-ui;color:#cbd5e1;line-height:1.5">“${esc(latest.text.slice(0,150))}${latest.text.length>150?"…":""}”</div>`;
    const had=rf.had.map(i=>q.reality.concepts[i]).filter(Boolean);
    const nw =rf.new.map(i=>q.reality.concepts[i]).filter(Boolean);
    const links = q.reality.concepts.map(c=>`<span class="lk">${esc(c)}</span>`).join("");
    const refined = (had.length||nw.length)? `<div style="margin-top:8px;font:700 11px system-ui">
        ${had.length?`<span style="color:var(--green)">✓ had: ${had.map(esc).join(", ")}</span>`:""}
        ${nw.length?`<span style="color:var(--amber);margin-left:8px">✦ new: ${nw.map(esc).join(", ")}</span>`:""}</div>`:"";
    const btN=(DB.breakthroughs[q.id]||[]).length;
    return `<button class="node" style="display:block;width:100%;text-align:left;cursor:pointer;color:var(--ink)" onclick="go({name:'timeline',fid:'${f.id}',qid:'${q.id}'})">
      <div class="nh"><span class="nn">${f.icon} ${esc(q.concept)}</span><span class="nc">${f.name} · ${vs.length>1?vs.length+" versions":"1 capture"}${btN?" · ✦"+btN:""}</span></div>
      ${evo}
      ${refined}
      <div class="links">${links}</div>
      <div style="margin-top:9px;font:700 11px system-ui;color:var(--violet)">📖 Read this concept's timeline ›</div>
    </button>`;
  }).join("");

  // where curiosity keeps returning + unresolved threads across every concept
  const returns = nodes.slice().filter(n=>n.vs.length>1).sort((a,b)=>b.vs.length-a.vs.length).slice(0,5);
  const allOpen=[]; nodes.forEach(n=>(DB.openQs[n.q.id]||[]).forEach(o=>allOpen.push({o, c:n.q.concept, f:n.f})));
  // shared user model: questions you routed through the Interpreter show up here too
  DB.captures.filter(c=>c.type==="question").forEach(c=>allOpen.push({o:c.text, c:"via 💬 Talk", f:{icon:"💬"}}));
  let curiosity="";
  if(returns.length){
    curiosity += `<div class="panel"><h3 style="font:800 12px system-ui;color:var(--violet);margin:0 0 9px;text-transform:uppercase;letter-spacing:.04em">Where your curiosity keeps returning</h3>
      ${returns.map(n=>`<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line);font:700 13px system-ui">
        <span>${n.f.icon} ${esc(n.q.concept)}</span><span style="color:var(--violet)">returned ${n.vs.length}×</span></div>`).join("")}</div>`;
  }
  if(allOpen.length){
    curiosity += `<div class="panel"><h3 style="font:800 12px system-ui;color:var(--amber);margin:0 0 9px;text-transform:uppercase;letter-spacing:.04em">Unresolved threads (${allOpen.length})</h3>
      <div class="hint" style="margin:0 0 8px">The questions you left open — where understanding can keep expanding.</div>
      ${allOpen.slice(0,10).map(t=>`<div class="openq">${esc(t.o)} <span style="color:var(--dim);font-weight:600">· ${esc(t.c)}</span></div>`).join("")}</div>`;
  }

  // "who you are" — carried from The Seed
  let seed="";
  if(DB.profile.done){
    const A=DB.profile.answers;
    const bits=[];
    if(A.m1&&A.m1.text) bits.push(["wants to understand",A.m1.text]);
    if(A.t1&&A.t1.choices&&A.t1.choices.length) bits.push(["learns best by",A.t1.choices.join(", ").toLowerCase()]);
    if(A.q2&&A.q2.text) bits.push(["dream to master",A.q2.text]);
    if(A.p3&&A.p3.text) bits.push(["lifelong thread",A.p3.text]);
    if(bits.length) seed=`<button class="node" style="display:block;width:100%;text-align:left;cursor:pointer;color:var(--ink);background:linear-gradient(135deg,rgba(167,139,250,.10),transparent);border-color:rgba(167,139,250,.35)" onclick="go({name:'onboard',step:${onbSteps().length-1}})">
      <div class="nh"><span class="nn" style="color:var(--violet)">🌱 Who you are, as a learner</span><span class="nc">from The Seed ›</span></div>
      ${bits.map(([k,v])=>`<div style="margin-top:6px;font:600 12px system-ui;color:#cbd5e1"><span style="color:var(--dim)">${k}:</span> ${esc(v)}</div>`).join("")}</button>`;
  }
  app.innerHTML=chrome(
    `<h1>🧠 Your model</h1>
     <p class="sub">Not what you know — <b>how you came to know it.</b> Every concept keeps its whole history: what you first thought, what changed it, and what's still open. Tap one to read its timeline.</p>
     ${seed}${stat}${curiosity}${cards}`, "model");
}

render();
</script>
</body>
</html>
