  <style>

    @font-face{font-family:"KaTeX_SansSerif";font-weight:400;font-style:italic;src:url(/vendor/mathlive/fonts/KaTeX_SansSerif-Italic.woff2?v=0110) format("woff2")}
    @font-face{font-family:"KaTeX_SansSerif";font-weight:400;font-style:normal;src:url(/vendor/mathlive/fonts/KaTeX_SansSerif-Regular.woff2?v=0110) format("woff2")}

    *{box-sizing:border-box}
    html,body{margin:0}
    body{
      font:400 16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      height:100dvh;display:flex;flex-direction:column;overflow:hidden;
      --bg:#0b0f1a;--surface:#121a2e;--line:rgba(255,255,255,.13);--text:#e6edf3;--muted:#8b949e;
      --pill:rgba(158,203,255,.16);--pilltx:#9ecbff;--earn:rgba(34,197,94,.16);--earntx:#4ade80;
      --ok:#22c55e;--bad:#ef4444;--accent:#5b9bf0;--grid:rgba(255,255,255,.09);--axis:rgba(255,255,255,.5);--curve:#5b9bf0;
      background:var(--bg);color:var(--text);
      padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)
    }
    body[data-theme=light]{--bg:#f4f7fc;--surface:#fff;--line:rgba(0,0,0,.13);--text:#0d1117;--muted:#5b6470;--pill:rgba(31,111,235,.12);--pilltx:#1f6feb;--earn:rgba(22,128,61,.12);--earntx:#15803d;--grid:rgba(0,0,0,.08);--axis:rgba(0,0,0,.45);--curve:#1f6feb}
    header{flex:0 0 auto;padding:12px 15px 10px;border-bottom:.5px solid var(--line)}
    .row{display:flex;align-items:flex-start;gap:10px}
    .ic{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:9px;border:.5px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer;font-size:17px;flex:0 0 auto}
    .title{flex:1;font-size:16px;font-weight:500;padding-top:7px}
    .badges{display:flex;flex-direction:column;gap:6px;align-items:flex-end;flex:0 0 auto}
    .pts{background:var(--pill);color:var(--pilltx);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:500;white-space:nowrap}
    .earned{background:var(--earn);color:var(--earntx);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:500;white-space:nowrap}
    .hdr-actions{display:flex;gap:6px;align-items:center}
    .ic.sm{width:30px;height:30px;font-size:14px;border-radius:8px}
    .ic.xbtn{border-color:rgba(255,90,90,.55);color:#ff7a7a;font-weight:700}
    .ic.xbtn:active{background:#ff5a5a;color:#fff}
    .sub{margin-top:11px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .setrow{margin-top:9px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
    .setrow .slbl{font-size:12px;opacity:.6;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
    .setbtn{background:var(--surface);border:.5px solid var(--line);border-radius:8px;padding:6px 13px;color:var(--text);font-size:13px;font-weight:600;cursor:pointer}
    .setbtn.active{background:var(--accent,#6ea8fe);border-color:var(--accent,#6ea8fe);color:#0b1220}
    .setbtn.newq{margin-left:auto;opacity:.85}
    .setbtn.tier{padding:5px 11px;font-size:12px;border-radius:7px}
    .tiergrp{display:inline-flex;gap:5px;flex-wrap:nowrap;align-items:center}
    .arrow{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:9px;border:.5px solid var(--line);background:var(--surface);color:var(--text);font:500 20px system-ui;cursor:pointer;flex:0 0 auto}
    .arrow[disabled]{opacity:.38;cursor:default}
    .seldrop{position:relative;display:inline-block}
    .sel{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:.5px solid var(--line);border-radius:9px;padding:8px 13px;color:var(--text);font-size:14px;font-weight:500;cursor:pointer}
    .menu{position:absolute;top:calc(100% + 6px);left:0;background:var(--surface);border:.5px solid var(--line);border-radius:11px;padding:6px;max-height:58vh;overflow-y:auto;z-index:50;min-width:130px;display:none;box-shadow:0 14px 34px rgba(0,0,0,.45)}
    .menu.open{display:block}
    .menu button{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;background:transparent;color:var(--text);border:0;border-radius:7px;padding:9px 12px;font:500 14px system-ui;cursor:pointer}
    .menu button.cur{background:var(--pill);color:var(--pilltx)}
    .menu .tag{font-size:11px;color:var(--muted)}
    main{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:15px}
    .prompt{margin:0 0 16px;font-size:15px;line-height:1.6}
    .opt{display:flex;align-items:center;gap:12px;padding:13px 13px;margin:9px 0;border:.5px solid var(--line);border-radius:11px;background:var(--surface)}
    .opt.ok{background:rgba(34,197,94,.12);box-shadow:inset 0 0 0 1.5px var(--ok);border-color:transparent}
    .opt.bad{background:rgba(239,68,68,.12);box-shadow:inset 0 0 0 1.5px var(--bad);border-color:transparent}
    .opt input{width:21px;height:21px;flex:0 0 auto;cursor:pointer;accent-color:var(--accent)}
    .otext{flex:1;font-size:16px}
    .qmedia{flex:0 0 auto;cursor:pointer}
    .qmedia.gfx{width:148px;background:var(--bg);border:.5px solid var(--line);border-radius:9px}
    .dt{border-collapse:collapse;font:500 14px system-ui}
    .dt th,.dt td{border:.5px solid var(--line);padding:5px 14px;text-align:center;min-width:34px}
    .dt th{font-style:italic;color:var(--muted);font-weight:500}
    .dt.plain th{font-style:normal;font-weight:600;color:var(--text)}
    .hgrid{display:grid;gap:10px;margin-top:4px}
    .hcell{display:flex;flex-direction:column;align-items:center;gap:9px;border:.5px solid var(--line);border-radius:11px;padding:10px 7px;background:var(--surface);min-width:0}
    .hcell.ok{background:rgba(34,197,94,.12);box-shadow:inset 0 0 0 1.5px var(--ok);border-color:transparent}
    .hcell.bad{background:rgba(239,68,68,.12);box-shadow:inset 0 0 0 1.5px var(--bad);border-color:transparent}
    .hcell .qmedia{width:100%}
    .hpick{display:flex;align-items:center;gap:6px}
    .hpick input{width:22px;height:22px;accent-color:var(--accent);cursor:pointer}
    .hgrid .dt{font-size:11.5px;width:100%}
    .hgrid .dt th,.hgrid .dt td{padding:3px 4px;min-width:0}
    .zoom{margin-left:auto;display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;border:.5px solid var(--line);background:var(--surface);color:var(--muted);font-size:15px;cursor:pointer;flex:0 0 auto}
    .mark{flex:0 0 auto;font-size:18px;width:20px;text-align:center}
    .empty{color:var(--muted);line-height:1.6;padding:20px 4px}
    .grow{display:flex;align-items:flex-start;gap:8px;margin:4px 0 16px}
    .grow .qmedia.gfx{background:var(--bg)}
    .tscroll{overflow-x:auto;margin:6px 0 16px}
    .matchwrap{display:flex;gap:20px;flex-wrap:wrap}
    .mleft{display:flex;flex-direction:column;gap:11px;flex:1;min-width:210px}
    .mright{display:flex;flex-direction:column;gap:9px;flex:1;min-width:160px;color:var(--muted)}
    .mrow{display:flex;align-items:center;gap:10px}
    .msel{font:500 14px system-ui;padding:7px 8px;border-radius:8px;border:.5px solid var(--line);background:var(--surface);color:var(--text);min-width:56px;cursor:pointer}
    .meq{font-size:16px;flex:1}
    .mopt{font-size:15px}
    .mgfx{display:flex;align-items:center;gap:8px}
    .mlbl{font-size:15px;min-width:16px;color:var(--text)}
    .mright .qmedia.gfx{width:120px;background:var(--bg);border:.5px solid var(--line);border-radius:8px}
    .mrow.ok .meq{color:var(--ok)} .mrow.bad .meq{color:var(--bad)}
    .lmrow{flex-direction:column;align-items:flex-start;gap:7px;margin-bottom:18px}
    .lmtop{display:flex;align-items:center;gap:8px}
    .lmrow .msel{min-width:140px;font-weight:500}
    .lmrow.ok .msel{box-shadow:inset 0 0 0 1.5px var(--ok);border-color:transparent}
    .lmrow.bad .msel{box-shadow:inset 0 0 0 1.5px var(--bad);border-color:transparent}
    .ask{font-size:15px;margin:0 0 10px}
    .inwrap{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .inlabel{font-size:16px}
    .ansin{font:500 16px system-ui;padding:9px 12px;border-radius:9px;border:.5px solid var(--line);background:var(--surface);color:var(--text);width:150px;outline:none}
    .ansin.ok{box-shadow:inset 0 0 0 1.5px var(--ok);border-color:transparent}
    .ansin.bad{box-shadow:inset 0 0 0 1.5px var(--bad);border-color:transparent}
    /* MathLive math-field answer boxes (2D math input) */
    math-field.mathfield{font-size:17px;min-width:150px;padding:7px 11px;border-radius:9px;border:.5px solid var(--line);background:var(--surface);color:var(--text);outline:none;display:inline-block;vertical-align:middle}
    math-field.mathfield:focus,math-field.mathfield:focus-within{border-color:var(--accent)}
    math-field.mathfield.ok{box-shadow:inset 0 0 0 1.5px var(--ok);border-color:transparent}
    math-field.mathfield.bad{box-shadow:inset 0 0 0 1.5px var(--bad);border-color:transparent}
    math-field.mathfield::part(virtual-keyboard-toggle),math-field.mathfield::part(menu-toggle){display:none}
    .fsel{font:500 15px system-ui;padding:8px 10px;border-radius:9px;border:.5px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer}
    .fsel.ok{box-shadow:inset 0 0 0 1.5px var(--ok);border-color:transparent}
    .fsel.bad{box-shadow:inset 0 0 0 1.5px var(--bad);border-color:transparent}
    .mathkb{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px;padding-top:13px;border-top:.5px solid var(--line)}
    .mathkb button{min-width:48px;height:42px;border:.5px solid var(--line);border-radius:9px;background:var(--surface);color:var(--text);font-size:16px;cursor:pointer}
    .mathkb button:active{background:var(--accent);color:#fff}
    .mathkb .kbtag{flex-basis:100%;font-size:12px;color:var(--muted);margin:-4px 0 2px}
    /* Standardized math keyboard (tabbed grid, mirrors the school MathQuill pad) */
    .mathpad{margin:10px 0 4px;padding-top:10px;border-top:.5px solid var(--line);max-width:420px}
    .mathpad.mp-closed{display:none}
    .mp-tabs{display:flex;align-items:center;gap:2px;flex-wrap:wrap;margin-bottom:9px;border-bottom:.5px solid var(--line)}
    .mp-x{margin-left:auto;border:none;background:none;color:var(--muted);font-size:18px;line-height:1;cursor:pointer;padding:4px 6px}
    .mp-x:active{color:var(--text)}
    .mp-tab{padding:6px 10px;border:none;background:none;color:var(--muted);font-size:14px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
    .mp-tab.on{color:var(--accent);border-bottom-color:var(--accent)}
    .mp-grid{display:none;gap:5px;grid-template-columns:repeat(var(--cols,6),1fr)}
    .mp-grid.on{display:grid}
    .mp-grid-abc.on{display:flex;flex-direction:column;gap:5px}
    .mp-row{display:flex;gap:5px}
    .mp-key{height:44px;border:.5px solid var(--line);border-radius:9px;background:var(--surface);color:var(--text);font-size:15px;line-height:1;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center}
    .mp-key:active{background:var(--accent);color:#fff}
    .mp-key sup{font-size:9px;vertical-align:super} .mp-key sub{font-size:9px;vertical-align:sub}
    .mp-row .mp-key{flex:1 1 0;min-width:0}
    .mp-space{flex:4 1 0}
    .mp-arrows{display:flex;gap:4px}
    .mp-arrows .mp-key{flex:1 1 0}
    .mp-fn{color:var(--accent);font-weight:600}
    footer{flex:0 0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 15px;border-top:.5px solid var(--line)}
    .btn{display:inline-flex;align-items:center;gap:6px;background:var(--surface);color:var(--text);border:.5px solid var(--line);border-radius:10px;padding:10px 17px;font-size:14px;font-weight:500;cursor:pointer}
    .btn.primary{background:var(--accent);color:#fff;border-color:transparent}
    .btn[disabled]{opacity:.38;cursor:default}
    .score{font-size:15px;font-weight:500;margin-left:2px}
    .zoomov{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.86);display:flex;align-items:center;justify-content:center;padding:22px}
    .zoombox{width:min(92vw,520px);background:var(--surface);border:.5px solid var(--line);border-radius:14px;padding:12px}
    em{font-style:italic}
    .genbtn{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(180deg,#a855f7,#7c3aed);border:0;border-radius:9px;padding:8px 13px;color:#fff;font-size:13px;font-weight:700;cursor:pointer}
    .genbtn:active{transform:scale(.96)}
    .genbar{margin-top:9px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .geninput{flex:1 1 220px;min-width:160px;height:38px;padding:0 12px;border-radius:10px;border:.5px solid var(--line);background:var(--surface);color:var(--text);font:500 14px system-ui;outline:none}
    .gengo{flex:0 0 auto;height:38px;padding:0 16px;border-radius:10px;border:0;background:linear-gradient(180deg,#a855f7,#7c3aed);color:#fff;font:800 13px system-ui;cursor:pointer}
    .gengo[disabled]{opacity:.5;cursor:default}
    .gennote{flex:1 1 100%;font-size:12px;color:var(--muted)}
    .gennote.err{color:#fca5a5}.gennote.ok{color:#86efac}
    /* Study-set home (boxes) — the landing view: one dismissible box per set. */
    #home{display:none;flex:1 1 auto;overflow-y:auto;padding:16px 16px 28px}
    body.quiz-home #home{display:block}
    body.quiz-home main,body.quiz-home footer,body.quiz-home .sub,body.quiz-home .setrow{display:none !important}
    .home-head{margin:2px 2px 14px}
    .home-title{font:800 22px system-ui;margin:0 0 4px}
    .home-sub{font-size:13px;color:var(--muted);margin:0;line-height:1.5}
    .home-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
    .homebox{position:relative;text-align:left;border:.5px solid var(--line);border-radius:14px;padding:14px 13px 13px;
      background:linear-gradient(160deg,rgba(124,58,237,.16),var(--surface));color:var(--text);cursor:pointer;
      display:flex;flex-direction:column;gap:5px;min-height:104px;transition:transform .1s ease,border-color .2s ease}
    .homebox:hover{border-color:var(--accent,#6ea8fe);transform:translateY(-2px)}
    .homebox--gen{background:linear-gradient(160deg,rgba(168,85,247,.22),var(--surface))}
    .homebox--add{align-items:center;justify-content:center;text-align:center;border-style:dashed;background:transparent;color:var(--muted);font-weight:700}
    .homebox--soon{opacity:.45;cursor:default;background:var(--surface)}
    .homebox--soon:hover{transform:none;border-color:var(--line)}
    /* AI explanation panel — a bottom sheet that pops up with the worked solution. */
    .explain-panel{position:fixed;left:0;right:0;bottom:0;z-index:300;display:flex;flex-direction:column;
      max-height:64vh;background:var(--surface);border-top:1px solid var(--line);
      border-radius:16px 16px 0 0;box-shadow:0 -14px 40px rgba(0,0,0,.5)}
    .explain-panel.hidden{display:none}
    .explain-head{display:flex;align-items:center;justify-content:space-between;padding:12px 15px;border-bottom:.5px solid var(--line);font:800 15px system-ui;color:var(--text)}
    .explain-x{border:0;background:transparent;color:var(--muted);font-size:18px;cursor:pointer;line-height:1}
    .explain-body{flex:1 1 auto;overflow-y:auto;padding:13px 15px;display:flex;flex-direction:column;gap:10px}
    .ex-msg{font:500 14px/1.55 system-ui;white-space:pre-wrap;border-radius:12px;padding:10px 12px;max-width:92%}
    .ex-msg--ai{background:rgba(124,58,237,.14);border:.5px solid rgba(168,85,247,.4);color:var(--text);align-self:flex-start}
    .ex-msg--me{background:var(--accent,#6ea8fe);color:#0b1220;align-self:flex-end;font-weight:600}
    .ex-msg--note{font-size:12px;color:var(--muted);align-self:flex-start;padding:0 2px;background:none;border:0}
    .explain-foot{display:flex;gap:8px;padding:10px 12px;border-top:.5px solid var(--line)}
    .explain-input{flex:1 1 auto;height:38px;padding:0 12px;border-radius:10px;border:.5px solid var(--line);background:var(--bg,#0b0f1a);color:var(--text);font:500 14px system-ui;outline:none}
    .explain-send{flex:0 0 auto;height:38px;padding:0 16px;border-radius:10px;border:0;background:linear-gradient(180deg,#a855f7,#7c3aed);color:#fff;font:800 13px system-ui;cursor:pointer}
    .explain-send[disabled]{opacity:.5;cursor:default}
    .homebox .hsec{font:800 17px system-ui}
    .homebox .htitle{font-size:12.5px;line-height:1.35;opacity:.92;flex:1 1 auto}
    .homebox .hmeta{font-size:11px;color:var(--muted);margin-top:2px}
    .homebox .hbar{height:5px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:3px}
    .homebox .hbar>i{display:block;height:100%;background:var(--accent,#6ea8fe)}
    .homebox .hx{position:absolute;top:6px;right:7px;width:22px;height:22px;border-radius:50%;border:0;
      background:rgba(0,0,0,.35);color:#e6edf3;font:700 12px system-ui;cursor:pointer;line-height:1;display:flex;align-items:center;justify-content:center}
    .homebox .hx:hover{background:#dc2626}
  </style>

  <!-- MathLive (self-hosted, pinned 0.110.0): 2D math input — stacked fractions, editable exponents.

  <script>
  (function () {

    function waveGraph(){
      var SX=15, SY=9, OX=22, OYzero=105; // y=0 line at 105, y=10 at 15
      function sx(x){ return (OX + x*SX).toFixed(1); } function sy(y){ return (OYzero - y*SY).toFixed(1); }
      var g="";

      for (var y=0;y<=10;y++){ g+='<line x1="'+sx(-1)+'" y1="'+sy(y)+'" x2="'+sx(5)+'" y2="'+sy(y)+'" style="stroke:var(--grid);stroke-width:.5"/>'; }

      g+='<line x1="'+sx(0)+'" y1="'+sy(0)+'" x2="'+sx(0)+'" y2="'+sy(10)+'" style="stroke:var(--axis);stroke-width:1"/>';
      for (var xn=-1;xn<=5;xn++){ if(xn===0) continue; g+='<text x="'+sx(xn)+'" y="'+(parseFloat(sy(0))+8).toFixed(1)+'" text-anchor="middle" style="fill:var(--muted);font:6.5px system-ui">'+xn+'</text>'; }
      for (var yn=1;yn<=10;yn++){ g+='<text x="'+(parseFloat(sx(0))-3).toFixed(1)+'" y="'+(parseFloat(sy(yn))+2.3).toFixed(1)+'" text-anchor="end" style="fill:var(--muted);font:6.5px system-ui">'+yn+'</text>'; }
      // Smooth curve through readable points (peak, valley, bump, valley, peak, descent). f(1)=1, f(5)=7.
      var pts=[[-1,9],[0,8],[1,1],[2,4],[3,1.5],[4,9],[5,7]], d="M "+sx(pts[0][0])+" "+sy(pts[0][1]);
      for (var i=0;i<pts.length-1;i++){
        var p0=pts[Math.max(0,i-1)], p1=pts[i], p2=pts[i+1], p3=pts[Math.min(pts.length-1,i+2)];
        var c1x=p1[0]+(p2[0]-p0[0])/6, c1y=p1[1]+(p2[1]-p0[1])/6;

        d+=" C "+sx(c1x)+" "+sy(c1y)+", "+sx(c2x)+" "+sy(c2y)+", "+sx(p2[0])+" "+sy(p2[1]);

      return '<svg viewBox="0 0 120 120" width="100%" style="display:block">'+g+'</svg>';
    }
    // Dedicated cubic with local max (-3,6) and local min (3,0); grid x -6..6, y -2..10.
    function cubicMaxMin(){
      var SX=9, SY=8.5, OX=64, OY0=97; // y=0 at 97 (y=10 -> 12, y=-2 -> 114)
      function sx(x){ return (OX + x*SX).toFixed(1); } function sy(y){ return (OY0 - y*SY).toFixed(1); }
      var g="";
      for (var x=-6;x<=6;x++){ g+='<line x1="'+sx(x)+'" y1="'+sy(-2)+'" x2="'+sx(x)+'" y2="'+sy(10)+'" style="stroke:var(--grid);stroke-width:.5"/>'; }
      for (var y=-2;y<=10;y++){ g+='<line x1="'+sx(-6)+'" y1="'+sy(y)+'" x2="'+sx(6)+'" y2="'+sy(y)+'" style="stroke:var(--grid);stroke-width:.5"/>'; }
      g+='<line x1="'+sx(-6)+'" y1="'+sy(0)+'" x2="'+sx(6)+'" y2="'+sy(0)+'" style="stroke:var(--axis);stroke-width:1"/>';

      for (var yn=-2;yn<=10;yn++){ if(yn===0)continue; g+='<text x="'+(parseFloat(sx(0))-3).toFixed(1)+'" y="'+(parseFloat(sy(yn))+2.2).toFixed(1)+'" text-anchor="end" style="fill:var(--muted);font:6px system-ui">'+yn+'</text>'; }
      var f=function(x){ return x*x*x/18 - 1.5*x + 3; }, d="", pen=true;

    }
    function graphSVG(kind) {

      var S = 9, O = 60, W = 120;

      var g = "";
      for (var i=-5;i<=5;i++){ g+='<line x1="'+sx(i)+'" y1="'+sy(-5)+'" x2="'+sx(i)+'" y2="'+sy(5)+'" style="stroke:var(--grid);stroke-width:.5"/>'; g+='<line x1="'+sx(-5)+'" y1="'+sy(i)+'" x2="'+sx(5)+'" y2="'+sy(i)+'" style="stroke:var(--grid);stroke-width:.5"/>'; }

      }
      function plot(f,a,b){ a=(a==null?-5:a); b=(b==null?5:b); var d="",pen=true; for(var x=a;x<=b+1e-9;x+=0.1){ var y=f(x); if(!isFinite(y)||y<-5.2||y>5.2){pen=true;continue;} d+=(pen?"M":"L")+sx(x)+" "+sy(y)+" "; pen=false; } return '<path d="'+d.trim()+'" style="fill:none;stroke:var(--curve);stroke-width:2"/>'; }
      function plotX(f,a,b){ a=(a==null?-5:a); b=(b==null?5:b); var d="",pen=true; for(var y=a;y<=b+1e-9;y+=0.1){ var x=f(y); if(!isFinite(x)||x<-5.2||x>5.2){pen=true;continue;} d+=(pen?"M":"L")+sx(x)+" "+sy(y)+" "; pen=false; } return '<path d="'+d.trim()+'" style="fill:none;stroke:var(--curve);stroke-width:2"/>'; }
      if(kind==="sine")g+=plot(function(x){return 2*Math.sin(Math.PI*x/2);});
      else if(kind==="line")g+=plot(function(x){return -2.8*x+1.7;});
      else if(kind==="cubic")g+=plot(function(x){return 6*x*x*x+9*x*x-2;},-1.7,1.05);
      else if(kind==="hline")g+=plot(function(){return -2;});
      else if(kind==="ellipse")g+='<ellipse cx="'+sx(-0.7)+'" cy="'+sy(-2)+'" rx="'+(1.2*S).toFixed(1)+'" ry="'+(1*S).toFixed(1)+'" style="fill:none;stroke:var(--curve);stroke-width:2"/>';
      else if(kind==="sideways")g+=plotX(function(y){return 0.6*y*y-2;});
      else if(kind==="wave")g+=plot(function(x){return 1.2*Math.sin(Math.PI*x/2);});
      else if(kind==="parabup")g+=plot(function(x){return 1.6*(x+2.5)*(x+2.5)+2.2;},-4.2,-0.8);
      else if(kind==="cubicS")g+=plot(function(x){return 0.12*x*x*x-0.7*x;},-4.3,4.3);
      else if(kind==="sqrtcurve")g+=plot(function(x){return Math.sqrt(x+1)+2;},-1,5);
      else if(kind==="ellipseR")g+='<ellipse cx="'+sx(2)+'" cy="'+sy(-1)+'" rx="'+(1*S).toFixed(1)+'" ry="'+(2*S).toFixed(1)+'" style="fill:none;stroke:var(--curve);stroke-width:2"/>';
      else if(kind==="linedown")g+=plot(function(x){return -x+2;});
      else if(kind==="steepneg")g+=plot(function(x){return -4*(x+1)-3;},-3,-0.5);
      else if(kind==="f8line")g+=plot(function(x){return -0.2*x+3.8;});
      else if(kind==="sq")g+=plot(function(x){return x*x;});
      else if(kind==="cube")g+=plot(function(x){return x*x*x;});
      else if(kind==="sqrt0")g+=plot(Math.sqrt,0,5);
      else if(kind==="recipsq")g+=plot(function(x){return 1/(x*x);});
      else if(kind==="recip")g+=plot(function(x){return 1/x;});
      else if(kind==="absv")g+=plot(function(x){return Math.abs(x);});
      else if(kind==="cbrt")g+=plot(function(x){return Math.cbrt(x);});
      else if(kind==="identity")g+=plot(function(x){return x;});
      else if(kind==="cubicTurns")g+=plot(function(x){return 0.25*x*x*x-3*x;});
      else if(kind==="parabMin")g+=plot(function(x){return x*x-4;});
      else if(kind==="decrCurve")g+=plot(function(x){return 0.12*x*x-1.0*x-1;},-4,4);

    function evalAnswer(s){
      s = String(s).replace(/−/g,"-").replace(/\s+/g,"");
      if (s === "") return null;
      if (/^-?\d+(\.\d+)?$/.test(s)) return parseFloat(s);
      var m = s.match(/^(-?\d+(?:\.\d+)?)\/(-?\d+(?:\.\d+)?)$/);
      if (m) { var d = parseFloat(m[2]); return d !== 0 ? parseFloat(m[1]) / d : null; }
      return null;
    }

    function normExpr(s){
      s = String(s).toLowerCase().replace(/\s+/g,"").replace(/\*/g,"").replace(/−/g,"-").replace(/²/g,"^2").replace(/³/g,"^3");
      if (s==="") return "";
      if (!/^[+-]/.test(s)) s = "+"+s;
      var t = s.match(/[+-][^+-]+/g) || [];
      t = t.map(function(term){
        var m = term.match(/^([+-])(\d*\.?\d*)(.*)$/);
        if (!m) return term;
        var f = (m[3].match(/[a-z](\^\d+)?/g) || []); f.sort();
        return m[1] + m[2] + f.join("");
      });
      t.sort();
      return t.join("");
    }
    function exprMatch(input, blank){
      var n = normExpr(input); if (n==="") return false;
      if (n === normExpr(blank.answer)) return true;
      if (blank.accept) for (var i=0;i<blank.accept.length;i++){ if (n===normExpr(blank.accept[i])) return true; }
      return false;
    }
    // Convert a math-y answer/input string into evaluable JS (implicit mult, ^, −, roots, π, |abs|).
    function toJsExpr(s){
      s = String(s).toLowerCase().replace(/\s+/g,"").replace(/−/g,"-").replace(/²/g,"^2").replace(/³/g,"^3").replace(/\^/g,"**");
      s = s.replace(/\|([^|]*)\|/g,"¢($1)");        // |expr| -> abs(expr)
      s = s.replace(/([0-9a-z)\]])([√∛π¢(])/g,"$1*$2"); // implicit mult before a root / π / abs / paren
      s = s.replace(/√\s*\(/g,"§(");                // protect sqrt(  from implicit-mult / letter rules
      s = s.replace(/∛\s*\(/g,"¤(");                // protect cbrt(
      s = s.replace(/π/g,"°");                      // protect pi

      s = s.replace(/([a-z)])(\()/g,"$1*$2");   // b( -> b*( , )( -> )*(
      s = s.replace(/(\))([a-z0-9])/g,"$1*$2"); // )b -> )*b , )2 -> )*2
      s = s.replace(/([a-z])([a-z])/g,"$1*$2"); // xh -> x*h

    // Numeric equivalence: do input & answer agree as functions of their variable?
    function exprEquiv(input, ans){

      var fi, fa;
      try { fi=new Function(v,"return ("+toJsExpr(input)+");"); fa=new Function(v,"return ("+toJsExpr(ans)+");"); } catch(e){ return false; }
      var samples=[0.37,1.13,2.71,3.59,-1.27,4.42,5.83], tot=0, ok=0;
      for (var i=0;i<samples.length;i++){
        var x=samples[i], yi, ya;
        try { yi=fi(x); ya=fa(x); } catch(e){ continue; }
        if (typeof yi!=="number"||typeof ya!=="number"||!isFinite(yi)||!isFinite(ya)) continue;

    // Plain word/term answers (e.g. "mitochondria", "natural selection") — used for

    function isWordAnswer(s){ return typeof s === "string" && /^[a-zA-Z][a-zA-Z\s'\-]*$/.test(s); }

    function grade(){
      var q=DECK[idx]; if(q.type==="placeholder") return;
      if (q.type==="input") {

        if (!(aval(inp)||"").trim()) { scoreEl.textContent="Type an answer"; return; }
        inp.classList.remove("ok","bad");

        finishGrade(correct?q.points:0, q.points);

      if (q.type==="tableinput" || q.type==="graphinput" || q.type==="multiinput") {
        var inps=optsEl.querySelectorAll(".ansin"), ok2=0, pendingWord=[];
        [].forEach.call(inps,function(inp,bi){
          inp.classList.remove("ok","bad");
          var ans=q.blanks[bi].answer, right, av=aval(inp);
          if (typeof ans === "number") { var p=evalAnswer(numText(inp)); right=(p!==null && Math.abs(p-ans)<1e-9); }
          else if (/[a-z]/i.test(ans)) { right = isWordAnswer(ans) ? wordMatch(av, ans) : (exprEquiv(av, ans) || exprMatch(av, q.blanks[bi])); }
          else { right = textMatch(av, q.blanks[bi]); }
          inp.classList.add(right?"ok":"bad");
          var mk=inp.nextElementSibling; if(mk&&mk.classList.contains("mark")) mk.textContent=right?"✓":"✗";
          if(right)ok2++;
          else if(isWordAnswer(ans) && (av||"").trim()) pendingWord.push({ inp:inp, bi:bi });
        });
        finishGrade(Math.round(ok2/q.blanks.length*q.points), q.points);
        if (pendingWord.length) llmRegrade(q, pendingWord);  // synonyms / phrasing → AI second opinion

      if (q.type==="graphform") {

          else {
            var ans=f.answer, av=aval(el);
            if (typeof ans==="number"){ var p=evalAnswer(numText(el)); right=(p!==null && Math.abs(p-ans)<1e-9); }
            else if (/[a-z]/i.test(ans)){ right = isWordAnswer(ans) ? wordMatch(av, ans) : (exprEquiv(av,ans)||exprMatch(av,{answer:ans})); }
            else { right=textMatch(av,{answer:ans}); }

        [].forEach.call(mrows,function(row,i){
          var sel=row.querySelector(".msel"); var v=(sel.value===""?-1:parseInt(sel.value,10));
          var right=(v===q.items[i].answer);

    // Group decks into sections; multiple decks sharing an id become Set 1, Set 2, ...
    var SECTIONS = [], secIndex = {};

    function rebuildSections(){
      SECTIONS = []; secIndex = {};
      DECKS.forEach(function(d,i){
        if (secIndex[d.id]==null){ secIndex[d.id]=SECTIONS.length; SECTIONS.push({sec:d.id, decks:[]}); }

    // ── Generated-deck ingestion (Inkling / Haiku → quiz format) ───────────────
    // A generated set is plain JSON. Supported question "types" (the internal
    // sorting structure for math questions):
    //   { "type":"mc", "prompt":"…", "options":["…","…",…], "correct":<index> }
    //   { "type":"multiinput", "prompt":"…",
    //     "blanks":[{ "label":"…", "answer":<number | "expr" | "interval">, "answerText":"…"? }] }
    // Answer routing at grade time: number→exact numeric; string with a letter→
    // algebraic equivalence (exprEquiv); else interval/text match. So the AI just
    // emits numbers for computed answers, expressions like "6x+12" for algebra, or
    // interval strings like "(-∞, 3]"/"[0, ∞)" for domains/ranges.
    // Pretty-print plain-text math for DISPLAY only (never the graded answer):
    // sqrt(…)→√(…), x^2→x², b^2→b², +/-→±, <=/>=→≤/≥, infinity→∞, pi→π.
    function prettyMath(s){
      if (s == null) return s;
      s = String(s);
      s = s.replace(/\bsqrt\s*\(/gi, "√(");
      s = s.replace(/\^(\d+)/g, function(_, d){ return d.replace(/\d/g, function(c){ return "⁰¹²³⁴⁵⁶⁷⁸⁹"[+c]; }); });
      s = s.replace(/\+\/-/g, "±");
      s = s.replace(/<=/g, "≤").replace(/>=/g, "≥").replace(/!=/g, "≠");
      s = s.replace(/\binfinity\b/gi, "∞").replace(/\bpi\b/gi, "π");
      return s;
    }
    function normalizeQuestion(q){
      if (!q || typeof q !== "object" || !q.prompt) return null;
      var points = (typeof q.points === "number" && q.points > 0) ? q.points : 10;
      var prompt = prettyMath(String(q.prompt));
      if (q.type === "mc") {
        var options = Array.isArray(q.options) ? q.options.map(function(o){ return prettyMath(String(o)); }) : [];
        if (options.length < 2) return null;
        var correct = (typeof q.correct === "number" && q.correct >= 0 && q.correct < options.length) ? q.correct : 0;
        return { type:"mc", prompt:prompt, options:options, correct:correct, points:points };
      }
      if (q.type === "multiinput" || q.type === "input" || q.type === "numeric" || q.type === "fill") {
        var src = Array.isArray(q.blanks) ? q.blanks
          : (q.answer != null ? [{ label:q.label, answer:q.answer, answerText:q.answerText }] : []);
        var blanks = [];
        src.forEach(function(b){
          if (b == null || b.answer == null) return;
          var ans = b.answer;
          if (typeof ans === "string" && /^-?\d+(\.\d+)?$/.test(ans.trim())) ans = parseFloat(ans);
          // answer stays RAW (graded); label + answerText are prettified (display).
          var nb = { label: prettyMath(String(b.label || "Answer =")), answer: ans };
          if (b.answerText != null) nb.answerText = prettyMath(String(b.answerText));
          blanks.push(nb);
        });
        if (!blanks.length) return null;
        return { type:"multiinput", prompt:prompt, blanks:blanks, points:points };
      }
      return null; // unsupported / unsafe type → skip
    }
    function normalizeDeck(raw){
      if (!raw || typeof raw !== "object") return null;
      var qsrc = Array.isArray(raw.questions) ? raw.questions : (Array.isArray(raw) ? raw : []);
      var questions = [];
      qsrc.forEach(function(q){ var nq = normalizeQuestion(q); if (nq) questions.push(nq); });
      if (!questions.length) return null;
      return {
        id: String(raw.id || raw.section || raw.title || raw.topic || "AI").slice(0, 40),
        title: String(raw.title || raw.topic || "Generated set").slice(0, 120),
        graded: {}, qcount: questions.length, total: questions.length * 10, generated: true,
        tier: raw.tier || null, questions: questions
      };
    }
    function addGeneratedDeck(raw){
      var d = normalizeDeck(raw);
      if (!d) return false;
      var existing = -1;
      DECKS.forEach(function(x,i){ if (x.generated && x.id === d.id) existing = i; });
      if (existing >= 0) DECKS[existing] = d; else DECKS.push(d);
      rebuildSections();
      var di = existing >= 0 ? existing : DECKS.length - 1;

      // its ✨ AI Set — switch right into it. A brand-new subject (biology…) lands
      // on the home as its own box.
      if (isPrecalc(d.id)) switchDeck(di);
      else if (typeof showHome === "function") showHome();
      else switchDeck(di);
      return true;
    }

        var tl = document.createElement("span"); tl.className = "slbl"; tl.textContent = aiDeck ? "↻ AI tier:" : "✨ Make AI set:"; setRow.appendChild(tl);
        var tg = document.createElement("span"); tg.className = "tiergrp";
        [["easy","Easy"],["medium","Medium"],["hard","Hard"]].forEach(function(t){
          var tb = document.createElement("button");
          tb.className = "setbtn tier" + (aiDeck && aiDeck.tier === t[0] ? " active" : "");
          tb.textContent = t[1];
          tb.addEventListener("click", function(){ makeSectionAiSet(tb, t[0]); });
          tg.appendChild(tb);
        });
        setRow.appendChild(tg);
      }
      setRow.style.display = show ? "flex" : "none";
    }
    function switchDeck(n){
      curDeck = n; DECK = DECKS[curDeck].questions; idx = 0;
      document.getElementById("deckTitle").textContent = DECKS[curDeck].title;
      scopeDeckPick();
      buildSetRow(); closeMenu(); setEarned(); render();
    }
    deckPick.addEventListener("change", function(){ switchDeck(SECTIONS[parseInt(this.value,10)].decks[0]); });

    rebuildSections();
    buildSetRow(); setEarned(); render();

    // ── Study-set home (dismissible boxes) — the landing view ────────────────
    var DISMISS_KEY = "inkling-quiz-dismissed";
    function getDismissed(){ try { return JSON.parse(localStorage.getItem(DISMISS_KEY) || "{}") || {}; } catch(_){ return {}; } }
    function setDismissed(o){ try { localStorage.setItem(DISMISS_KEY, JSON.stringify(o)); } catch(_){ } }
    function dismissSection(sec){ var d = getDismissed(); d[sec] = 1; setDismissed(d); buildHome(); }
    var homeGrid = document.getElementById("homeGrid");
    function makeSectionBox(s){
      var d0 = DECKS[s.decks[0]];
      var g = d0.graded || {}, earned = 0; for (var k in g) earned += g[k];
      var pct = d0.total ? Math.round(earned / d0.total * 100) : 0;
      var titleText = String(d0.title || s.sec).replace(/^\s*[^·]*·\s*/, "");
      var box = document.createElement("button");
      box.type = "button";
      box.className = "homebox" + (d0.generated ? " homebox--gen" : "");
      box.innerHTML =
        '<span class="hx" aria-label="Hide this set">✕</span>' +
        '<div class="hsec">' + (d0.generated ? "✨ " : "") + s.sec + '</div>' +
        '<div class="htitle">' + titleText + '</div>' +
        '<div class="hmeta">' + s.decks.length + (s.decks.length > 1 ? " sets" : " set") + ' · ' + d0.qcount + ' Q' + (earned ? ' · ' + pct + '%' : '') + '</div>' +
        '<div class="hbar"><i style="width:' + pct + '%"></i></div>';
      box.addEventListener("click", function(e){
        if (e.target.classList.contains("hx")) { e.stopPropagation(); dismissSection(s.sec); return; }
        hideHome(); switchDeck(s.decks[0]);
      });
      return box;
    }
    function makeMiscBox(label, icon, fn){
      var b = document.createElement("button");
      b.type = "button"; b.className = "homebox homebox--add";
      b.innerHTML = '<div style="font-size:24px">' + icon + '</div><div>' + label + '</div>';
      b.addEventListener("click", fn);
      return b;
    }
    function isPrecalc(sec){ return /^\d+\.\d+$/.test(sec); }     // 1.1, 1.2, … = section of chapter 1
    function chapterOf(sec){ return parseInt(String(sec).split(".")[0], 10); }
    function chapterSections(n){ return SECTIONS.filter(function(s){ return isPrecalc(s.sec) && chapterOf(s.sec) === n; }); }
    // A subject groups its sections. Precalc chapters share "precalc"; each
    // generated set (biology, etc.) is its OWN subject — so the section dropdown
    // never mixes biology in with the precalc sections.
    function subjectKey(sec){ return isPrecalc(sec) ? "precalc" : sec; }
    function scopeDeckPick(){
      var curKey = subjectKey(DECKS[curDeck].id);
      deckPick.innerHTML = "";
      SECTIONS.forEach(function(s, i){
        if (subjectKey(s.sec) !== curKey) return;
        var o = document.createElement("option"); o.value = i; o.textContent = s.sec; deckPick.appendChild(o);
      });
      deckPick.value = secIndex[DECKS[curDeck].id];
    }
    // OpenStax Precalculus — the 12 chapters. 1.1–1.7 are the SECTIONS of Ch. 1.
    var PRECALC_CHAPTERS = [
      "Functions", "Linear Functions", "Polynomial & Rational Functions",
      "Exponential & Logarithmic Functions", "Trigonometric Functions", "Periodic Functions",
      "Trigonometric Identities & Equations", "Further Applications of Trigonometry",
      "Systems of Equations & Inequalities", "Analytic Geometry",
      "Sequences, Probability & Counting", "Introduction to Calculus"
    ];
    var homeView = null;  // null = subjects | "precalc-chapters" | "precalc-ch-<N>"
    function buildHome(){
      if (!homeGrid) return;
      saveLocHome();   // remember the home level (runs before buildHome's early returns)
      homeGrid.innerHTML = "";
      var dismissed = getDismissed(), titleEl = document.querySelector(".home-title");
      var precalc = SECTIONS.filter(function(s){ return isPrecalc(s.sec); });
      var others  = SECTIONS.filter(function(s){ return !isPrecalc(s.sec); });

      // Level 3 — the sections inside a chosen chapter.
      var m = /^precalc-ch-(\d+)$/.exec(homeView || "");
      if (m){
        var cn = parseInt(m[1], 10);
        titleEl.textContent = "📐 Chapter " + cn + " · " + (PRECALC_CHAPTERS[cn - 1] || "");
        homeGrid.appendChild(makeMiscBox("Back to chapters", "←", function(){ homeView = "precalc-chapters"; buildHome(); }));
        chapterSections(cn).forEach(function(s){ if (!dismissed[s.sec]) homeGrid.appendChild(makeSectionBox(s)); });
        return;
      }

      // Level 2 — the 12 chapters of Precalculus (only built ones are clickable).
      if (homeView === "precalc-chapters"){
        titleEl.textContent = "📐 Precalculus · 12 chapters";
        homeGrid.appendChild(makeMiscBox("Back to subjects", "←", function(){ homeView = null; buildHome(); }));
        var built = {};
        precalc.forEach(function(s){ built[chapterOf(s.sec)] = (built[chapterOf(s.sec)] || 0) + 1; });
        PRECALC_CHAPTERS.forEach(function(name, i){
          var n = i + 1, count = built[n] || 0;
          var box = document.createElement("button");
          box.type = "button";
          box.className = "homebox" + (count ? "" : " homebox--soon");
          box.innerHTML =
            '<div class="hsec">Chapter ' + n + '</div>' +
            '<div class="htitle">' + name + '</div>' +
            '<div class="hmeta">' + (count ? count + " section" + (count > 1 ? "s" : "") + " →" : "Coming soon") + '</div>';
          if (count) box.addEventListener("click", function(){ homeView = "precalc-ch-" + n; buildHome(); });
          else box.disabled = true;
          homeGrid.appendChild(box);
        });
        return;
      }

      // Level 1 — subjects.
      titleEl.textContent = "📚 Study sets";
      if (precalc.length && !dismissed["__precalc"]){
        var chs = {}; precalc.forEach(function(s){ chs[chapterOf(s.sec)] = 1; });
        var readyList = Object.keys(chs).sort(function(a,b){ return a - b; }).join(", ");
        var pc = document.createElement("button");
        pc.type = "button"; pc.className = "homebox";
        pc.innerHTML =
          '<span class="hx" aria-label="Hide Precalculus">✕</span>' +
          '<div class="hsec">📐 Precalculus</div>' +
          '<div class="htitle">OpenStax · ' + PRECALC_CHAPTERS.length + ' chapters</div>' +
          '<div class="hmeta">Chapter ' + readyList + ' ready →</div>';
        pc.addEventListener("click", function(e){
          if (e.target.classList.contains("hx")) { e.stopPropagation(); dismissSection("__precalc"); return; }
          homeView = "precalc-chapters"; buildHome();
        });
        homeGrid.appendChild(pc);
      }
      others.forEach(function(s){ if (!dismissed[s.sec]) homeGrid.appendChild(makeSectionBox(s)); });
      homeGrid.appendChild(makeMiscBox("Generate a new set", "✨", function(){ hideHome(); if (genBar.style.display === "none") genBtn.click(); }));
      if (Object.keys(dismissed).length){
        homeGrid.appendChild(makeMiscBox("Restore hidden sets", "↩︎", function(){ setDismissed({}); buildHome(); }));
      }
    }
    function showHomeAt(view){ homeView = view || null; buildHome(); document.body.classList.add("quiz-home"); closeMenu(); }
    function showHome(){ showHomeAt(null); }
    function hideHome(){ document.body.classList.remove("quiz-home"); }
    // On load, reopen wherever the user last was (deck+question or home level) instead of always the home screen.
    function restoreLoc(){
      if (bootLoc && bootLoc.view === "deck"){
        var di = -1; for (var i=0;i<DECKS.length;i++){ if (DECKS[i].id === bootLoc.deckId){ di = i; break; } }
        if (di >= 0){
          hideHome(); switchDeck(di);
          if (typeof bootLoc.idx === "number" && bootLoc.idx >= 0 && bootLoc.idx < DECK.length){ idx = bootLoc.idx; render(); }
          closeMenu(); return;
        }
      }
      showHomeAt(bootLoc && bootLoc.view === "home" ? bootLoc.homeView : null);
    }
    document.getElementById("homeBtn").addEventListener("click", showHome);
    // Jump back to the knowledge graph (2D map / 3D spiral). In-app → ask the parent to
    // swap the surface; standalone → navigate directly.
    function goGraph(mode){
      var inApp = window.parent && window.parent !== window;
      if (inApp){ try {
        if (mode === "close") window.parent.postMessage({ type:"inkling-close-flashcard" }, "*");
        else window.parent.postMessage({ type:"inkling-open-graph", mode: mode }, "*");
        return;
      } catch(_){} }
      location.href = (mode === "3d") ? "wordweaver3d.html" : "wordweaver.html";
    }
    document.getElementById("graph2d").addEventListener("click", function(){ goGraph("2d"); });
    document.getElementById("graph3d").addEventListener("click", function(){ goGraph("3d"); });
    document.getElementById("graphClose").addEventListener("click", function(){ goGraph("close"); });
    // Deep link: ?q=1.2.11 opens that section's question directly (used by WordWeaver node links).
    function gotoDeepLink(){
      var qp; try { qp = new URLSearchParams(location.search).get("q"); } catch(_){ qp = null; }
      if (!qp) return false;
      var m = /^(\d+\.\d+)\.(\d+)$/.exec(qp.trim()); if (!m) return false;
      var sec = m[1], n = parseInt(m[2],10) - 1, di = -1;
      for (var i=0;i<DECKS.length;i++){ if (DECKS[i].id===sec && !DECKS[i].generated){ di=i; break; } }
      if (di<0) for (var j=0;j<DECKS.length;j++){ if (DECKS[j].id===sec){ di=j; break; } }
      if (di<0) return false;
      hideHome(); switchDeck(di);
      if (n>=0 && n<DECK.length){ idx=n; render(); }
      closeMenu(); return true;
    }
    if (!gotoDeepLink()) restoreLoc();

    // Receive generated decks from a host page (Inkling embeds this in an iframe).
    window.addEventListener("message", function(e){
      var msg = e && e.data;
      if (!msg || msg.type !== "inkling-quiz-deck" || !msg.deck) return;
      var ok = addGeneratedDeck(msg.deck);
      try { (e.source || window.parent)?.postMessage({ type:"inkling-quiz-deck-ack", ok: ok }, "*"); } catch(_){}
    });
    // localStorage handoff: host stashes a deck just before opening the page.
    try {
      var stashed = localStorage.getItem("inkling-quiz-incoming-deck");
      if (stashed) { localStorage.removeItem("inkling-quiz-incoming-deck"); addGeneratedDeck(JSON.parse(stashed)); }
    } catch(_){}
    // Direct link: ?deck=<base64-encoded JSON>.
    try {
      var dparam = new URLSearchParams(location.search).get("deck");
      if (dparam) addGeneratedDeck(JSON.parse(decodeURIComponent(escape(atob(dparam)))));
    } catch(_){}
    // Tell the host we're ready to receive a deck.
    try { if (window.parent && window.parent !== window) window.parent.postMessage({ type:"inkling-quiz-ready" }, "*"); } catch(_){}

    // ── ✨ Generate a new set via Inkling AI (Haiku backend) ──────────────────
    var genBtn=document.getElementById("genBtn"), genBar=document.getElementById("genBar"),
        genTopic=document.getElementById("genTopic"), genGo=document.getElementById("genGo"), genNote=document.getElementById("genNote");
    function apiBase(){
      try { if (window.__EUGENEOUS_API__) return String(window.__EUGENEOUS_API__).replace(/\/$/,""); } catch(_){}
      return "https://inkling-15yf.onrender.com";
    }
    function authToken(){
      try { var s=JSON.parse(localStorage.getItem("eugeneousxr:session")||"null"); return (s && s.token) || null; } catch(_){ return null; }
    }
    function setNote(msg, kind){ genNote.textContent=msg||""; genNote.className="gennote"+(kind?" "+kind:""); }
    genBtn.addEventListener("click", function(){
      var open = genBar.style.display==="none";
      genBar.style.display = open ? "flex" : "none";
      if (open){ setNote(""); genTopic.focus(); }
    });
    genTopic.addEventListener("keydown", function(e){ if(e.key==="Enter"){ e.preventDefault(); doGenerate(); } });
    genGo.addEventListener("click", doGenerate);
    function doGenerate(){
      var topic=(genTopic.value||"").trim();
      if (topic.length<2){ setNote("Type a topic first.", "err"); genTopic.focus(); return; }
      if (!authToken()){ setNote("Sign in to Inkling first, then reopen this to generate.", "err"); return; }
      genGo.disabled=true; var orig=genGo.textContent; genGo.textContent="Generating…";
      setNote("Asking Inkling… the AI can take a few seconds (longer if the server was asleep).");
      fetch(apiBase()+"/api/inkling/quiz-set", {
        method:"POST",
        headers:{ "Content-Type":"application/json", "Authorization":"Bearer "+authToken(), "X-Inkling-Client":"Inkling" },
        body: JSON.stringify({ topic: topic })
      }).then(function(res){ return res.json().catch(function(){ return null; }).then(function(d){ return { ok:res.ok, status:res.status, data:d }; }); })
        .then(function(r){
          genGo.disabled=false; genGo.textContent=orig;
          var data=r.data;
          if (!r.ok){ setNote("Couldn't generate — "+((data&&data.error)||("server "+r.status)), "err"); return; }
          var src = data && data.source;
          if (src==="guest"){ setNote("Sign in to Inkling to use the AI generator.", "err"); return; }
          if (src==="capped"){ setNote("You've hit today's AI limit — it resets tomorrow.", "err"); return; }
          if (!data || !Array.isArray(data.questions) || !data.questions.length){ setNote("Couldn't make a set — try a clearer topic.", "err"); return; }
          var deck = { id:"✨ "+topic, title:topic, topic:topic, questions:data.questions };
          if (addGeneratedDeck(deck)){
            setNote((src==="mock"?"(Demo set — live AI fills in once the server is deployed.) ":"")+"Done — showing your new set ↑", "ok");
            genBar.style.display="none"; genTopic.value="";
          } else { setNote("Got a response but couldn't build a set from it.", "err"); }
        })
        .catch(function(){ genGo.disabled=false; genGo.textContent=orig; setNote("Couldn't reach Inkling — check your connection and try again.", "err"); });
    }

    // Make an AI set FOR the current precalc section (joins it as the ✨ AI Set,
    // alongside your 📷 screenshot set). Generated on the section's own topic.
    function makeSectionAiSet(btn, difficulty){
      var sec = DECKS[curDeck].id, title = DECKS[curDeck].title;
      var topic = String(title || sec).replace(/^\s*[^·]*·\s*/, "") || sec;
      if (!authToken()){ btn.textContent = "Sign in first"; return; }
      btn.disabled = true; var orig = btn.textContent; btn.textContent = "✨ …";
      fetch(apiBase()+"/api/inkling/quiz-set", {
        method:"POST",
        headers:{ "Content-Type":"application/json", "Authorization":"Bearer "+authToken(), "X-Inkling-Client":"Inkling" },
        body: JSON.stringify({ topic: topic, section: sec, difficulty: difficulty || "" })
      }).then(function(res){ return res.json().catch(function(){ return null; }).then(function(d){ return { ok:res.ok, data:d }; }); })
        .then(function(r){
          btn.disabled = false; btn.textContent = orig;
          var d = r.data;
          if (!r.ok || !d){ btn.textContent = "retry"; return; }
          if (d.source === "guest"){ btn.textContent = "sign in"; return; }
          if (d.source === "capped"){ btn.textContent = "limit"; return; }
          if (!Array.isArray(d.questions) || !d.questions.length){ btn.textContent = "retry"; return; }
          addGeneratedDeck({ id: sec, title: title, topic: topic, tier: difficulty || null, questions: d.questions });
        })
        .catch(function(){ btn.disabled = false; btn.textContent = orig; });
    }

    // ── 🤖 Explain / 💡 Hint — AI tutor: progressive hints (nudge → step → full worked solution) ──
    var explainPanel=document.getElementById("explainPanel"), explainBody=document.getElementById("explainBody"),
        explainInput=document.getElementById("explainInput"), explainSend=document.getElementById("explainSend"),
        explainBtn=document.getElementById("explainBtn"), explainClose=document.getElementById("explainClose"),
        hintBtn=document.getElementById("hintBtn");
    var explainHistory=[], explainQIdx=null, explainBusy=false, hintLevel=0, fullShown=false, sessionQA=null;

    // Cache full worked solutions so reopening Explain on a question is instant + costs no API call.
    var EXPLAIN_CACHE_KEY="inkling-quiz-explain-cache";
    function explainKey(qa){ return (qa.prompt+"||"+qa.answer).toLowerCase().replace(/\s+/g," ").trim().slice(0,300); }
    function getExplainCache(qa){ try{ var m=JSON.parse(localStorage.getItem(EXPLAIN_CACHE_KEY)||"{}"); return m[explainKey(qa)]||null; }catch(e){ return null; } }
    function setExplainCache(qa, reply){ try{ var m=JSON.parse(localStorage.getItem(EXPLAIN_CACHE_KEY)||"{}"); var k=explainKey(qa); if(!(k in m)){ var ks=Object.keys(m); while(ks.length>=80){ delete m[ks.shift()]; } } m[k]=reply; localStorage.setItem(EXPLAIN_CACHE_KEY, JSON.stringify(m)); }catch(e){} }

    function exAdd(kind, text){
      var d=document.createElement("div"); d.className="ex-msg ex-msg--"+kind; d.textContent=text;
      explainBody.appendChild(d); explainBody.scrollTop=explainBody.scrollHeight; return d;
    }
    function currentQA(){
      var q=DECK[idx]||{};
      var prompt=String(q.prompt||"").replace(/<[^>]+>/g," ").replace(/&[a-z]+;/gi," ").replace(/\s+/g," ").trim();
      var ans="";
      if (q.type==="mc" && Array.isArray(q.options)) ans=String(q.options[q.correct]||"").replace(/<[^>]+>/g,"").trim();
      else if (Array.isArray(q.blanks)) ans=q.blanks.map(function(b){ return b.answerText!=null?b.answerText:b.answer; }).join("; ");
      else if (Array.isArray(q.fields)) ans=q.fields.map(function(f){ return f.kind==="select"?(f.choices&&f.choices[f.answer]):(f.answerText!=null?f.answerText:f.answer); }).join("; ");
      return { prompt:prompt, answer:ans };
    }
    function updateHintBtn(){
      if (!hintBtn) return;
      if (fullShown){ hintBtn.textContent="💡 Hint"; hintBtn.disabled=true; return; }
      hintBtn.disabled=false;
      hintBtn.textContent = hintLevel===0 ? "💡 Hint" : hintLevel===1 ? "💡 Another hint" : "💡 Show solution";
    }
    function resetTutorUI(){
      explainQIdx=null; hintLevel=0; fullShown=false;
      if (explainPanel) explainPanel.classList.add("hidden");
      updateHintBtn();
    }
    function ensureSession(){
      if (explainQIdx===idx) return;
      explainQIdx=idx; explainBody.innerHTML=""; explainHistory=[]; hintLevel=0; fullShown=false; sessionQA=currentQA();
    }
    function callExplain(mode, cacheQA){
      if (explainBusy) return;
      if (!authToken()){ exAdd("note","Sign in to Inkling to get AI help."); return; }
      explainBusy=true; explainSend.disabled=true; if(hintBtn) hintBtn.disabled=true;
      var thinking=exAdd("ai","…");
      fetch(apiBase()+"/api/inkling/explain",{ method:"POST",
        headers:{ "Content-Type":"application/json", "Authorization":"Bearer "+authToken() },
        body: JSON.stringify({ history: explainHistory, mode: mode||"" }) })
        .then(function(r){ return r.json().catch(function(){return null;}).then(function(d){ return {ok:r.ok,data:d}; }); })
        .then(function(r){
          thinking.remove();
          var d=r.data;
          if (!r.ok || !d){ exAdd("note","Couldn't reach Inkling — try again."); return; }
          if (d.source==="guest"){ exAdd("note","Sign in to Inkling for AI help."); return; }
          if (d.source==="capped"){ exAdd("note","You've hit today's AI limit — resets tomorrow."); return; }
          var reply=String(d.reply||"").trim() || "Hmm — I couldn't work that one out.";
          exAdd("ai", reply); explainHistory.push({ role:"assistant", content:reply });
          if (cacheQA) setExplainCache(cacheQA, reply);
        })
        .catch(function(){ thinking.remove(); exAdd("note","Couldn't reach Inkling — check your connection."); })
        .then(function(){ explainBusy=false; explainSend.disabled=false; updateHintBtn(); });
    }
    function showFull(){
      if (fullShown || explainBusy) return;
      fullShown=true;
      var qa=sessionQA, firstTurn=explainHistory.length===0;
      if (firstTurn){
        explainHistory.push({ role:"user", content:"Question: "+qa.prompt+(qa.answer?"\nThe correct answer is: "+qa.answer:"")+"\n\nWalk me through how to solve it." });
        var cached=getExplainCache(qa);
        if (cached){ exAdd("ai", cached); explainHistory.push({ role:"assistant", content:cached }); updateHintBtn(); return; }
        callExplain("", qa);   // clean full solution → cache it
      } else {
        explainHistory.push({ role:"user", content:"Now give me the full worked solution, step by step." });
        callExplain("");       // came after hints → don't cache (it may reference them)
      }
    }
    function openExplain(){
      ensureSession();
      explainPanel.classList.remove("hidden");
      showFull();
      explainInput.focus();
    }
    function requestHint(){
      ensureSession();
      explainPanel.classList.remove("hidden");
      if (fullShown || explainBusy){ explainInput.focus(); return; }
      var qa=sessionQA;
      if (hintLevel===0){
        hintLevel=1;
        explainHistory.push({ role:"user", content:"Question: "+qa.prompt+(qa.answer?"\n(The answer is "+qa.answer+" — do NOT reveal it.)":"")+"\n\nGive me a small hint to get started." });
        callExplain("nudge");
      } else if (hintLevel===1){
        hintLevel=2;
        explainHistory.push({ role:"user", content:"Give me the first concrete step, then stop." });
        callExplain("step");
      } else {
        showFull();
      }
    }
    function sendFollowup(){
      var t=(explainInput.value||"").trim(); if(!t || explainBusy) return;
      ensureSession();
      exAdd("me", t); explainHistory.push({ role:"user", content:t }); explainInput.value=""; callExplain("");
    }
    explainBtn.addEventListener("click", openExplain);
    if (hintBtn) hintBtn.addEventListener("click", requestHint);
    explainClose.addEventListener("click", function(){ explainPanel.classList.add("hidden"); });
    explainSend.addEventListener("click", sendFollowup);
    explainInput.addEventListener("keydown", function(e){ if(e.key==="Enter"){ e.preventDefault(); sendFollowup(); } });

    // AI second opinion on a missed WORD answer (synonyms / phrasing). Flips to ✓ if the LLM accepts it.
    function llmRegrade(q, pending){
      if (!authToken()) return;
      var atDeck=curDeck, atIdx=idx, total=q.blanks.length;
      var promptText=String(q.prompt||"").replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim();
      pending.forEach(function(p){
        var inp=p.inp, mk=inp.nextElementSibling, expected=q.blanks[p.bi].answer, given=aval(inp);
        fetch(apiBase()+"/api/inkling/grade",{ method:"POST",
          headers:{ "Content-Type":"application/json", "Authorization":"Bearer "+authToken() },
          body: JSON.stringify({ question:promptText, expected:expected, given:given }) })
          .then(function(r){ return r.json(); })
          .then(function(d){
            if (curDeck!==atDeck || idx!==atIdx) return;     // user moved on — don't touch
            if (d && d.correct){
              inp.classList.remove("bad"); inp.classList.add("ok");
              if (mk && mk.classList.contains("mark")) mk.textContent="✓";
              var ok=optsEl.querySelectorAll(".ansin.ok").length;
              finishGrade(Math.round(ok/total*q.points), q.points);
            }
          }).catch(function(){});
      });
    }
  })();
  </script>
</body>
