<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f1a" />
  <title>Flashcards — Inkling</title>
  <link rel="icon" href="/icons/inkling-icon.svg" type="image/svg+xml" />
  <style>
    /* Self-hosted KaTeX fonts for MathLive (pinned 0.110.0) — bundled so math input never depends on a CDN font fetch */
    @font-face{font-family:KaTeX_AMS;font-weight:400;font-style:normal;src:url(/vendor/mathlive/fonts/KaTeX_AMS-Regular.woff2?v=0110) format("woff2")}
    @font-face{font-family:KaTeX_Caligraphic;font-weight:700;font-style:normal;src:url(/vendor/mathlive/fonts/KaTeX_Caligraphic-Bold.woff2?v=0110) format("woff2")}
    @font-face{font-family:KaTeX_Caligraphic;font-weight:400;font-style:normal;src:url(/vendor/mathlive/fonts/KaTeX_Caligraphic-Regular.woff2?v=0110) format("woff2")}
    @font-face{font-family:KaTeX_Fraktur;font-weight:700;font-style:normal;src:url(/vendor/mathlive/fonts/KaTeX_Fraktur-Bold.woff2?v=0110) format("woff2")}
    @font-face{font-family:KaTeX_Fraktur;font-weight:400;font-style:normal;src:url(/vendor/mathlive/fonts/KaTeX_Fraktur-Regular.woff2?v=0110) format("woff2")}
    @font-face{font-family:KaTeX_Main;font-weight:700;font-style:normal;src:url(/vendor/mathlive/fonts/KaTeX_Main-Bold.woff2?v=0110) format("woff2")}
    @font-face{font-family:KaTeX_Main;font-weight:700;font-style:italic;src:url(/vendor/mathlive/fonts/KaTeX_Main-BoldItalic.woff2?v=0110) format("woff2")}
    @font-face{font-family:KaTeX_Main;font-weight:400;font-style:italic;src:url(/vendor/mathlive/fonts/KaTeX_Main-Italic.woff2?v=0110) format("woff2")}
    @font-face{font-family:KaTeX_Main;font-weight:400;font-style:normal;src:url(/vendor/mathlive/fonts/KaTeX_Main-Regular.woff2?v=0110) format("woff2")}
    @font-face{font-family:KaTeX_Math;font-weight:700;font-style:italic;src:url(/vendor/mathlive/fonts/KaTeX_Math-BoldItalic.woff2?v=0110) format("woff2")}
    @font-face{font-family:KaTeX_Math;font-weight:400;font-style:italic;src:url(/vendor/mathlive/fonts/KaTeX_Math-Italic.woff2?v=0110) format("woff2")}
    @font-face{font-family:"KaTeX_SansSerif";font-weight:700;font-style:normal;src:url(/vendor/mathlive/fonts/KaTeX_SansSerif-Bold.woff2?v=0110) format("woff2")}
    @font-face{font-family:"KaTeX_SansSerif";font-weight:400;font-style:italic;src:url(/vendor/mathlive/fonts/KaTeX_SansSerif-Italic.woff2?v=0110) format("woff2")}
    @font-face{font-family:"KaTeX_SansSerif";font-weight:400;font-style:normal;src:url(/vendor/mathlive/fonts/KaTeX_SansSerif-Regular.woff2?v=0110) format("woff2")}
    @font-face{font-family:KaTeX_Script;font-weight:400;font-style:normal;src:url(/vendor/mathlive/fonts/KaTeX_Script-Regular.woff2?v=0110) format("woff2")}
    @font-face{font-family:KaTeX_Size1;font-weight:400;font-style:normal;src:url(/vendor/mathlive/fonts/KaTeX_Size1-Regular.woff2?v=0110) format("woff2")}
    @font-face{font-family:KaTeX_Size2;font-weight:400;font-style:normal;src:url(/vendor/mathlive/fonts/KaTeX_Size2-Regular.woff2?v=0110) format("woff2")}
    @font-face{font-family:KaTeX_Size3;font-weight:400;font-style:normal;src:url(/vendor/mathlive/fonts/KaTeX_Size3-Regular.woff2?v=0110) format("woff2")}
    @font-face{font-family:KaTeX_Size4;font-weight:400;font-style:normal;src:url(/vendor/mathlive/fonts/KaTeX_Size4-Regular.woff2?v=0110) format("woff2")}
    @font-face{font-family:KaTeX_Typewriter;font-weight:400;font-style:normal;src:url(/vendor/mathlive/fonts/KaTeX_Typewriter-Regular.woff2?v=0110) format("woff2")}
    *{box-sizing:border-box}
    html,body{margin:0}
    body{
      font:400 16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      height:100dvh;display:flex;flex-direction:column;overflow:hidden;
      --bg:#0b0f1a;--surface:#121a2e;--line:rgba(255,255,255,.13);--text:#e6edf3;--muted:#8b949e;
      --pill:rgba(158,203,255,.16);--pilltx:#9ecbff;--earn:rgba(34,197,94,.16);--earntx:#4ade80;
      --ok:#22c55e;--bad:#ef4444;--accent:#5b9bf0;--grid:rgba(255,255,255,.09);--axis:rgba(255,255,255,.5);--curve:#5b9bf0;
      background:var(--bg);color:var(--text);
      padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)
    }
    body[data-theme=light]{--bg:#f4f7fc;--surface:#fff;--line:rgba(0,0,0,.13);--text:#0d1117;--muted:#5b6470;--pill:rgba(31,111,235,.12);--pilltx:#1f6feb;--earn:rgba(22,128,61,.12);--earntx:#15803d;--grid:rgba(0,0,0,.08);--axis:rgba(0,0,0,.45);--curve:#1f6feb}
    header{flex:0 0 auto;padding:12px 15px 10px;border-bottom:.5px solid var(--line)}
    .row{display:flex;align-items:flex-start;gap:10px}
    .ic{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:9px;border:.5px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer;font-size:17px;flex:0 0 auto}
    .title{flex:1;font-size:16px;font-weight:500;padding-top:7px}
    .badges{display:flex;flex-direction:column;gap:6px;align-items:flex-end;flex:0 0 auto}
    .pts{background:var(--pill);color:var(--pilltx);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:500;white-space:nowrap}
    .earned{background:var(--earn);color:var(--earntx);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:500;white-space:nowrap}
    .hdr-actions{display:flex;gap:6px;align-items:center}
    .ic.sm{width:30px;height:30px;font-size:14px;border-radius:8px}
    .ic.xbtn{border-color:rgba(255,90,90,.55);color:#ff7a7a;font-weight:700}
    .ic.xbtn:active{background:#ff5a5a;color:#fff}
    .sub{margin-top:11px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .setrow{margin-top:9px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
    .setrow .slbl{font-size:12px;opacity:.6;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
    .setbtn{background:var(--surface);border:.5px solid var(--line);border-radius:8px;padding:6px 13px;color:var(--text);font-size:13px;font-weight:600;cursor:pointer}
    .setbtn.active{background:var(--accent,#6ea8fe);border-color:var(--accent,#6ea8fe);color:#0b1220}
    .setbtn.newq{margin-left:auto;opacity:.85}
    .setbtn.tier{padding:5px 11px;font-size:12px;border-radius:7px}
    .tiergrp{display:inline-flex;gap:5px;flex-wrap:nowrap;align-items:center}
    /* graph-sketch answer widget */
    .skbar{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
    .sktool{display:flex;align-items:center;gap:5px;border:.5px solid var(--line);background:var(--surface);color:var(--text);border-radius:9px;padding:6px 9px;font-size:12px;font-weight:600;cursor:pointer}
    .sktool svg{width:22px;height:16px;flex:0 0 auto}
    .sktool[data-tool="closed"] svg,.sktool[data-tool="open"] svg{width:16px}
    .sktool.on{border-color:var(--accent);background:var(--pill,rgba(91,155,240,.18));color:var(--accent)}
    .sktool.skclear{color:#ef4444}
    .skwrap{width:100%;max-width:340px;margin:0 auto;aspect-ratio:1/1;border:.5px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
    .skplane{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
    .skhint{font-size:11px;color:var(--muted);margin-top:7px;line-height:1.4}
    .arrow{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:9px;border:.5px solid var(--line);background:var(--surface);color:var(--text);font:500 20px system-ui;cursor:pointer;flex:0 0 auto}
    .arrow[disabled]{opacity:.38;cursor:default}
    .seldrop{position:relative;display:inline-block}
    .sel{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:.5px solid var(--line);border-radius:9px;padding:8px 13px;color:var(--text);font-size:14px;font-weight:500;cursor:pointer}
    .menu{position:absolute;top:calc(100% + 6px);left:0;background:var(--surface);border:.5px solid var(--line);border-radius:11px;padding:6px;max-height:58vh;overflow-y:auto;z-index:50;min-width:130px;display:none;box-shadow:0 14px 34px rgba(0,0,0,.45)}
    .menu.open{display:block}
    .menu button{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;background:transparent;color:var(--text);border:0;border-radius:7px;padding:9px 12px;font:500 14px system-ui;cursor:pointer}
    .menu button.cur{background:var(--pill);color:var(--pilltx)}
    .menu .tag{font-size:11px;color:var(--muted)}
    main{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:15px}
    .prompt{margin:0 0 16px;font-size:15px;line-height:1.6}
    .opt{display:flex;align-items:center;gap:12px;padding:13px 13px;margin:9px 0;border:.5px solid var(--line);border-radius:11px;background:var(--surface)}
    .opt.ok{background:rgba(34,197,94,.12);box-shadow:inset 0 0 0 1.5px var(--ok);border-color:transparent}
    .opt.bad{background:rgba(239,68,68,.12);box-shadow:inset 0 0 0 1.5px var(--bad);border-color:transparent}
    .opt input{width:21px;height:21px;flex:0 0 auto;cursor:pointer;accent-color:var(--accent)}
    .otext{flex:1;font-size:16px}
    .qmedia{flex:0 0 auto;cursor:pointer}
    .qmedia.gfx{width:148px;background:var(--bg);border:.5px solid var(--line);border-radius:9px}
    .dt{border-collapse:collapse;font:500 14px system-ui}
    .dt th,.dt td{border:.5px solid var(--line);padding:5px 14px;text-align:center;min-width:34px}
    .dt th{font-style:italic;color:var(--muted);font-weight:500}
    .dt.plain th{font-style:normal;font-weight:600;color:var(--text)}
    .hgrid{display:grid;gap:10px;margin-top:4px}
    .hcell{display:flex;flex-direction:column;align-items:center;gap:9px;border:.5px solid var(--line);border-radius:11px;padding:10px 7px;background:var(--surface);min-width:0}
    .hcell.ok{background:rgba(34,197,94,.12);box-shadow:inset 0 0 0 1.5px var(--ok);border-color:transparent}
    .hcell.bad{background:rgba(239,68,68,.12);box-shadow:inset 0 0 0 1.5px var(--bad);border-color:transparent}
    .hcell .qmedia{width:100%}
    .hpick{display:flex;align-items:center;gap:6px}
    .hpick input{width:22px;height:22px;accent-color:var(--accent);cursor:pointer}
    .hgrid .dt{font-size:11.5px;width:100%}
    .hgrid .dt th,.hgrid .dt td{padding:3px 4px;min-width:0}
    .zoom{margin-left:auto;display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;border:.5px solid var(--line);background:var(--surface);color:var(--muted);font-size:15px;cursor:pointer;flex:0 0 auto}
    .mark{flex:0 0 auto;font-size:18px;width:20px;text-align:center}
    .empty{color:var(--muted);line-height:1.6;padding:20px 4px}
    .grow{display:flex;align-items:flex-start;gap:8px;margin:4px 0 16px}
    .grow .qmedia.gfx{background:var(--bg)}
    .tscroll{overflow-x:auto;margin:6px 0 16px}
    .matchwrap{display:flex;gap:20px;flex-wrap:wrap}
    .mleft{display:flex;flex-direction:column;gap:11px;flex:1;min-width:210px}
    .mright{display:flex;flex-direction:column;gap:9px;flex:1;min-width:160px;color:var(--muted)}
    .mrow{display:flex;align-items:center;gap:10px}
    .msel{font:500 14px system-ui;padding:7px 8px;border-radius:8px;border:.5px solid var(--line);background:var(--surface);color:var(--text);min-width:56px;cursor:pointer}
    .meq{font-size:16px;flex:1}
    .mopt{font-size:15px}
    .mgfx{display:flex;align-items:center;gap:8px}
    .mlbl{font-size:15px;min-width:16px;color:var(--text)}
    .mright .qmedia.gfx{width:120px;background:var(--bg);border:.5px solid var(--line);border-radius:8px}
    .mrow.ok .meq{color:var(--ok)} .mrow.bad .meq{color:var(--bad)}
    .lmrow{flex-direction:column;align-items:flex-start;gap:7px;margin-bottom:18px}
    .lmtop{display:flex;align-items:center;gap:8px}
    .lmrow .msel{min-width:140px;font-weight:500}
    .lmrow.ok .msel{box-shadow:inset 0 0 0 1.5px var(--ok);border-color:transparent}
    .lmrow.bad .msel{box-shadow:inset 0 0 0 1.5px var(--bad);border-color:transparent}
    .ask{font-size:15px;margin:0 0 10px}
    .inwrap{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .inlabel{font-size:16px}
    .ansin{font:500 16px system-ui;padding:9px 12px;border-radius:9px;border:.5px solid var(--line);background:var(--surface);color:var(--text);width:150px;outline:none}
    .ansin.ok{box-shadow:inset 0 0 0 1.5px var(--ok);border-color:transparent}
    .ansin.bad{box-shadow:inset 0 0 0 1.5px var(--bad);border-color:transparent}
    /* MathLive math-field answer boxes (2D math input) */
    math-field.mathfield{font-size:17px;min-width:150px;padding:7px 11px;border-radius:9px;border:.5px solid var(--line);background:var(--surface);color:var(--text);outline:none;display:inline-block;vertical-align:middle}
    math-field.mathfield:focus,math-field.mathfield:focus-within{border-color:var(--accent)}
    math-field.mathfield.ok{box-shadow:inset 0 0 0 1.5px var(--ok);border-color:transparent}
    math-field.mathfield.bad{box-shadow:inset 0 0 0 1.5px var(--bad);border-color:transparent}
    math-field.mathfield::part(virtual-keyboard-toggle),math-field.mathfield::part(menu-toggle){display:none}
    .fsel{font:500 15px system-ui;padding:8px 10px;border-radius:9px;border:.5px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer}
    .fsel.ok{box-shadow:inset 0 0 0 1.5px var(--ok);border-color:transparent}
    .fsel.bad{box-shadow:inset 0 0 0 1.5px var(--bad);border-color:transparent}
    .mathkb{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px;padding-top:13px;border-top:.5px solid var(--line)}
    .mathkb button{min-width:48px;height:42px;border:.5px solid var(--line);border-radius:9px;background:var(--surface);color:var(--text);font-size:16px;cursor:pointer}
    .mathkb button:active{background:var(--accent);color:#fff}
    .mathkb .kbtag{flex-basis:100%;font-size:12px;color:var(--muted);margin:-4px 0 2px}
    /* Standardized math keyboard (tabbed grid, mirrors the school MathQuill pad) */
    .mathpad{margin:10px 0 4px;padding-top:10px;border-top:.5px solid var(--line);max-width:420px}
    .mathpad.mp-closed{display:none}
    .mp-tabs{display:flex;align-items:center;gap:2px;flex-wrap:wrap;margin-bottom:9px;border-bottom:.5px solid var(--line)}
    .mp-x{margin-left:auto;border:none;background:none;color:var(--muted);font-size:18px;line-height:1;cursor:pointer;padding:4px 6px}
    .mp-x:active{color:var(--text)}
    .mp-tab{padding:6px 10px;border:none;background:none;color:var(--muted);font-size:14px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
    .mp-tab.on{color:var(--accent);border-bottom-color:var(--accent)}
    .mp-grid{display:none;gap:5px;grid-template-columns:repeat(var(--cols,6),1fr)}
    .mp-grid.on{display:grid}
    .mp-grid-abc.on{display:flex;flex-direction:column;gap:5px}
    .mp-row{display:flex;gap:5px}
    .mp-key{height:44px;border:.5px solid var(--line);border-radius:9px;background:var(--surface);color:var(--text);font-size:15px;line-height:1;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center}
    .mp-key:active{background:var(--accent);color:#fff}
    .mp-key sup{font-size:9px;vertical-align:super} .mp-key sub{font-size:9px;vertical-align:sub}
    .mp-row .mp-key{flex:1 1 0;min-width:0}
    .mp-space{flex:4 1 0}
    .mp-arrows{display:flex;gap:4px}
    .mp-arrows .mp-key{flex:1 1 0}
    .mp-fn{color:var(--accent);font-weight:600}
    footer{flex:0 0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 15px;border-top:.5px solid var(--line)}
    .btn{display:inline-flex;align-items:center;gap:6px;background:var(--surface);color:var(--text);border:.5px solid var(--line);border-radius:10px;padding:10px 17px;font-size:14px;font-weight:500;cursor:pointer}
    .btn.primary{background:var(--accent);color:#fff;border-color:transparent}
    .btn[disabled]{opacity:.38;cursor:default}
    .score{font-size:15px;font-weight:500;margin-left:2px}
    .zoomov{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.86);display:flex;align-items:center;justify-content:center;padding:22px}
    .zoombox{width:min(92vw,520px);background:var(--surface);border:.5px solid var(--line);border-radius:14px;padding:12px}
    em{font-style:italic}
    .genbtn{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(180deg,#a855f7,#7c3aed);border:0;border-radius:9px;padding:8px 13px;color:#fff;font-size:13px;font-weight:700;cursor:pointer}
    .genbtn:active{transform:scale(.96)}
    .genbar{margin-top:9px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .geninput{flex:1 1 220px;min-width:160px;height:38px;padding:0 12px;border-radius:10px;border:.5px solid var(--line);background:var(--surface);color:var(--text);font:500 14px system-ui;outline:none}
    .gengo{flex:0 0 auto;height:38px;padding:0 16px;border-radius:10px;border:0;background:linear-gradient(180deg,#a855f7,#7c3aed);color:#fff;font:800 13px system-ui;cursor:pointer}
    .gengo[disabled]{opacity:.5;cursor:default}
    .gennote{flex:1 1 100%;font-size:12px;color:var(--muted)}
    .gennote.err{color:#fca5a5}.gennote.ok{color:#86efac}
    /* Study-set home (boxes) — the landing view: one dismissible box per set. */
    #home{display:none;flex:1 1 auto;overflow-y:auto;padding:16px 16px 28px}
    body.quiz-home #home{display:block}
    body.quiz-home main,body.quiz-home footer,body.quiz-home .sub,body.quiz-home .setrow{display:none !important}
    .home-head{margin:2px 2px 14px}
    .home-title{font:800 22px system-ui;margin:0 0 4px}
    .home-sub{font-size:13px;color:var(--muted);margin:0;line-height:1.5}
    .home-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
    .homebox{position:relative;text-align:left;border:.5px solid var(--line);border-radius:14px;padding:14px 13px 13px;
      background:linear-gradient(160deg,rgba(124,58,237,.16),var(--surface));color:var(--text);cursor:pointer;
      display:flex;flex-direction:column;gap:5px;min-height:104px;transition:transform .1s ease,border-color .2s ease}
    .homebox:hover{border-color:var(--accent,#6ea8fe);transform:translateY(-2px)}
    .homebox--gen{background:linear-gradient(160deg,rgba(168,85,247,.22),var(--surface))}
    .homebox--add{align-items:center;justify-content:center;text-align:center;border-style:dashed;background:transparent;color:var(--muted);font-weight:700}
    .homebox--soon{opacity:.45;cursor:default;background:var(--surface)}
    .homebox--soon:hover{transform:none;border-color:var(--line)}
    /* AI explanation panel — a bottom sheet that pops up with the worked solution. */
    .explain-panel{position:fixed;left:0;right:0;bottom:0;z-index:300;display:flex;flex-direction:column;
      max-height:64vh;background:var(--surface);border-top:1px solid var(--line);
      border-radius:16px 16px 0 0;box-shadow:0 -14px 40px rgba(0,0,0,.5)}
    .explain-panel.hidden{display:none}
    .explain-head{display:flex;align-items:center;justify-content:space-between;padding:12px 15px;border-bottom:.5px solid var(--line);font:800 15px system-ui;color:var(--text)}
    .explain-x{border:0;background:transparent;color:var(--muted);font-size:18px;cursor:pointer;line-height:1}
    .explain-body{flex:1 1 auto;overflow-y:auto;padding:13px 15px;display:flex;flex-direction:column;gap:10px}
    .ex-msg{font:500 14px/1.55 system-ui;white-space:pre-wrap;border-radius:12px;padding:10px 12px;max-width:92%}
    .ex-msg--ai{background:rgba(124,58,237,.14);border:.5px solid rgba(168,85,247,.4);color:var(--text);align-self:flex-start}
    .ex-msg--me{background:var(--accent,#6ea8fe);color:#0b1220;align-self:flex-end;font-weight:600}
    .ex-msg--note{font-size:12px;color:var(--muted);align-self:flex-start;padding:0 2px;background:none;border:0}
    .explain-foot{display:flex;gap:8px;padding:10px 12px;border-top:.5px solid var(--line)}
    .explain-input{flex:1 1 auto;height:38px;padding:0 12px;border-radius:10px;border:.5px solid var(--line);background:var(--bg,#0b0f1a);color:var(--text);font:500 14px system-ui;outline:none}
    .explain-send{flex:0 0 auto;height:38px;padding:0 16px;border-radius:10px;border:0;background:linear-gradient(180deg,#a855f7,#7c3aed);color:#fff;font:800 13px system-ui;cursor:pointer}
    .explain-send[disabled]{opacity:.5;cursor:default}
    .homebox .hsec{font:800 17px system-ui}

    // One hand-built "My set" per section: merge any non-generated decks that
    // share a section id into a single deck (e.g. 1.3's OpenStax + school WebWork
    // questions become one My set). Generated AI sets stay separate.
    (function mergeMySets(){
      var first = {}, out = [];
      DECKS.forEach(function(d){
        if (!d.generated && first[d.id]) {
          // a deck flagged `front` (your WebWork set) goes to the FRONT so its questions are 1.x.1, 1.x.2, …
          first[d.id].questions = d.front ? d.questions.concat(first[d.id].questions) : first[d.id].questions.concat(d.questions);
          return;
        }
        if (!d.generated) first[d.id] = d;
        out.push(d);
      });
      out.forEach(function(d){ if (!d.generated) { d.qcount = d.questions.length; d.total = d.qcount * 10; } });

    /* ── Interactive piecewise SKETCH widget (the graph-answer tool) ──
       Renders a coordinate plane + draw tools into #opts; the student plots
       lattice points and connects them (segment / ray / line, closed / open
       dots). Graded by SAMPLING: does the drawing pass through (x, f(x)) across
       the domain? Partial credit by the fraction of sample points covered. ── */
    var SKETCH = null;
    var SKICON = {
      line:'<svg viewBox="0 0 30 20"><polygon points="2,18 9,13 7,17" fill="currentColor"/><polygon points="28,2 21,7 23,3" fill="currentColor"/><line x1="4" y1="16" x2="26" y2="4" stroke="currentColor" stroke-width="2"/></svg>',
      ray:'<svg viewBox="0 0 30 20"><line x1="4" y1="16" x2="26" y2="4" stroke="currentColor" stroke-width="2"/><polygon points="28,2 21,7 23,3" fill="currentColor"/><circle cx="5" cy="16" r="2.6" fill="currentColor"/></svg>',
      segment:'<svg viewBox="0 0 30 20"><line x1="5" y1="16" x2="25" y2="4" stroke="currentColor" stroke-width="2"/><circle cx="5" cy="16" r="2.6" fill="currentColor"/><circle cx="25" cy="4" r="2.6" fill="currentColor"/></svg>',
      closed:'<svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="6.5" fill="currentColor"/></svg>',
      open:'<svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="6" fill="none" stroke="currentColor" stroke-width="2.4"/></svg>'
    };
    function mountSketch(q){
      var dom=q.domain||[-8,8], R0=dom[0], R1=dom[1], BOX=320, PAD=22, U=(BOX-2*PAD)/(R1-R0);
      function sx(x){ return (PAD+(x-R0)*U).toFixed(1); }
      function sy(y){ return (PAD+(R1-y)*U).toFixed(1); }
      var tools=[["line","Line"],["ray","Ray"],["segment","Segment"],["closed","Closed"],["open","Open"]];
      var bar='<div class="skbar">'+tools.map(function(t){ return '<button class="sktool" data-tool="'+t[0]+'">'+SKICON[t[0]]+'<span>'+t[1]+'</span></button>'; }).join('')
            +'<button class="sktool skact" data-act="undo" title="Undo">⤺</button><button class="sktool skact skclear" data-act="clear" title="Clear">Clear</button></div>';
      var svg='<div class="skwrap"><svg class="skplane" viewBox="0 0 '+BOX+' '+BOX+'" xmlns="http://www.w3.org/2000/svg">'
            +'<defs><marker id="skar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--curve)"/></marker></defs>'
            +'<g class="skgrid"></g><g class="skdraw"></g></svg></div>';
      optsEl.innerHTML = bar + svg + '<div class="skhint">Pick a tool, then tap two lattice points. Ray extends past the 2nd point; line goes both ways. Drop an open dot at a break. <b>Drag a dot or line off the grid to delete it.</b></div>';
      var svgEl=optsEl.querySelector(".skplane"), gGrid=svgEl.querySelector(".skgrid"), gDraw=svgEl.querySelector(".skdraw"), gg="", i;
      for(i=Math.ceil(R0);i<=R1;i++){ gg+='<line x1="'+sx(i)+'" y1="'+sy(R0)+'" x2="'+sx(i)+'" y2="'+sy(R1)+'" stroke="var(--grid)" stroke-width="1"/>'; gg+='<line x1="'+sx(R0)+'" y1="'+sy(i)+'" x2="'+sx(R1)+'" y2="'+sy(i)+'" stroke="var(--grid)" stroke-width="1"/>'; }
      gg+='<line x1="'+sx(R0)+'" y1="'+sy(0)+'" x2="'+sx(R1)+'" y2="'+sy(0)+'" stroke="var(--axis)" stroke-width="1.4"/><line x1="'+sx(0)+'" y1="'+sy(R0)+'" x2="'+sx(0)+'" y2="'+sy(R1)+'" stroke="var(--axis)" stroke-width="1.4"/>';
      for(i=Math.ceil(R0);i<=R1;i+=2){ if(i===0)continue; gg+='<text x="'+sx(i)+'" y="'+(parseFloat(sy(0))+9)+'" text-anchor="middle" fill="var(--muted)" font-size="8">'+i+'</text>'; }
      gGrid.innerHTML=gg;
      SKETCH={shapes:[], tool:"closed", pending:null};
      function exitPt(px,py,dx,dy){ var ts=[]; if(dx>0)ts.push((R1-px)/dx); else if(dx<0)ts.push((R0-px)/dx); if(dy>0)ts.push((R1-py)/dy); else if(dy<0)ts.push((R0-py)/dy); ts=ts.filter(function(t){return t>1e-9;}); var t=ts.length?Math.min.apply(null,ts):0; return [px+dx*t, py+dy*t]; }
      function dotSvg(x,y,open){ return '<circle cx="'+sx(x)+'" cy="'+sy(y)+'" r="'+(open?5:5.5)+'" '+(open?'fill="var(--surface)" stroke="var(--curve)" stroke-width="2.4"':'fill="var(--curve)"')+'/>'; }
      function draw(){
        var d="";
        SKETCH.shapes.forEach(function(s, idx){
          var del = !!(SKETCH.grab && SKETCH.grab.moved && SKETCH.grab.off && idx===SKETCH.grab.idx), sd="";
          if(s.t==="point"){ sd=dotSvg(s.x,s.y,s.open); }
          else {
            var a,b,extra="";
            if(s.t==="segment"){ a=[s.x1,s.y1]; b=[s.x2,s.y2]; }
            else if(s.t==="ray"){ a=[s.x1,s.y1]; b=exitPt(s.x2,s.y2,s.x2-s.x1,s.y2-s.y1); extra=' marker-end="url(#skar)"'; }
            else { a=exitPt(s.x1,s.y1,s.x1-s.x2,s.y1-s.y2); b=exitPt(s.x2,s.y2,s.x2-s.x1,s.y2-s.y1); extra=' marker-start="url(#skar)" marker-end="url(#skar)"'; }
            sd='<line x1="'+sx(a[0])+'" y1="'+sy(a[1])+'" x2="'+sx(b[0])+'" y2="'+sy(b[1])+'" stroke="var(--curve)" stroke-width="2.5" stroke-linecap="round"'+extra+'/>'+dotSvg(s.x1,s.y1,false);
            if(s.t==="segment") sd+=dotSvg(s.x2,s.y2,false);   // ray's 2nd point is only a direction → no dot there
          }
          d += del ? '<g opacity="0.3">'+sd+'</g>' : sd;
        });
        if(SKETCH.pending) d+='<circle cx="'+sx(SKETCH.pending.x)+'" cy="'+sy(SKETCH.pending.y)+'" r="6" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="3 3"/>';
        gDraw.innerHTML=d;
      }
      function setTool(t){ SKETCH.tool=t; SKETCH.pending=null; [].forEach.call(optsEl.querySelectorAll(".sktool"),function(b){ b.classList.toggle("on", b.dataset.tool===t); }); draw(); }
      function worldOf(e){ var r=svgEl.getBoundingClientRect(), px=(e.clientX-r.left)/r.width*BOX, py=(e.clientY-r.top)/r.height*BOX; return {x:(px-PAD)/U+R0, y:R1-(py-PAD)/U}; }   // raw world (unsnapped)
      function locate(e){ var w=worldOf(e); return {x:Math.max(R0,Math.min(R1,Math.round(w.x))), y:Math.max(R0,Math.min(R1,Math.round(w.y)))}; }
      function distSh(s,px,py){ if(s.t==="point") return Math.hypot(s.x-px,s.y-py); var dx=s.x2-s.x1,dy=s.y2-s.y1,L2=dx*dx+dy*dy; if(L2<1e-9) return Math.hypot(px-s.x1,py-s.y1); var t=((px-s.x1)*dx+(py-s.y1)*dy)/L2; if(s.t==="segment")t=Math.max(0,Math.min(1,t)); else if(s.t==="ray")t=Math.max(0,t); return Math.hypot(px-(s.x1+t*dx),py-(s.y1+t*dy)); }
      function hitSh(px,py){ var i; for(i=SKETCH.shapes.length-1;i>=0;i--) if(SKETCH.shapes[i].t==="point"&&distSh(SKETCH.shapes[i],px,py)<0.6) return i; for(i=SKETCH.shapes.length-1;i>=0;i--) if(SKETCH.shapes[i].t!=="point"&&distSh(SKETCH.shapes[i],px,py)<0.45) return i; return -1; }
      function moveSh(s,o,dx,dy){ if(s.t==="point"){ s.x=o.x+dx; s.y=o.y+dy; } else { s.x1=o.x1+dx; s.y1=o.y1+dy; s.x2=o.x2+dx; s.y2=o.y2+dy; } }
      function snapSh(s){ if(s.t==="point"){ s.x=Math.round(s.x); s.y=Math.round(s.y); } else { s.x1=Math.round(s.x1); s.y1=Math.round(s.y1); s.x2=Math.round(s.x2); s.y2=Math.round(s.y2); } }
      svgEl.addEventListener("pointerdown", function(e){ e.preventDefault(); var w=worldOf(e), hi=hitSh(w.x,w.y);
        if(hi>=0){ SKETCH.grab={idx:hi,x0:w.x,y0:w.y,moved:false,off:false,orig:JSON.parse(JSON.stringify(SKETCH.shapes[hi]))}; try{ svgEl.setPointerCapture(e.pointerId); }catch(_){} } else SKETCH.grab=null;
      });
      svgEl.addEventListener("pointermove", function(e){ if(!SKETCH.grab) return; var w=worldOf(e), dx=w.x-SKETCH.grab.x0, dy=w.y-SKETCH.grab.y0; if(Math.abs(dx)+Math.abs(dy)>0.25) SKETCH.grab.moved=true; if(SKETCH.grab.moved){ SKETCH.grab.off=(w.x<R0||w.x>R1||w.y<R0||w.y>R1); moveSh(SKETCH.shapes[SKETCH.grab.idx],SKETCH.grab.orig,dx,dy); draw(); } });
      svgEl.addEventListener("pointerup", function(e){ e.preventDefault(); var w=worldOf(e);
        if(SKETCH.grab && SKETCH.grab.moved){ if(w.x<R0||w.x>R1||w.y<R0||w.y>R1) SKETCH.shapes.splice(SKETCH.grab.idx,1); else snapSh(SKETCH.shapes[SKETCH.grab.idx]); SKETCH.grab=null; draw(); return; }
        SKETCH.grab=null;
        var p=locate(e), T=SKETCH.tool;
        if(T==="closed"||T==="open"){ SKETCH.shapes.push({t:"point",x:p.x,y:p.y,open:T==="open"}); }
        else if(!SKETCH.pending){ SKETCH.pending=p; }
        else { if(!(SKETCH.pending.x===p.x&&SKETCH.pending.y===p.y)) SKETCH.shapes.push({t:T,x1:SKETCH.pending.x,y1:SKETCH.pending.y,x2:p.x,y2:p.y}); SKETCH.pending=null; }
        draw();
      });
      optsEl.querySelector(".skbar").addEventListener("click", function(e){ var b=e.target.closest(".sktool"); if(!b) return; if(b.dataset.act==="undo"){ SKETCH.shapes.pop(); SKETCH.pending=null; draw(); } else if(b.dataset.act==="clear"){ SKETCH.shapes=[]; SKETCH.pending=null; draw(); } else if(b.dataset.tool){ setTool(b.dataset.tool); } });
      // "Show answer" → draw the correct piecewise graph: each piece as a ray (if it runs to a
      // grid edge) or segment, plus the closed/open dots at the breaks (q.answerDots).
      SKETCH.reveal = function(){
        var shapes=[];
        (q.pieces||[]).forEach(function(p){
          var y0=p.m*p.x0+p.b, y1=p.m*p.x1+p.b;
          if(p.x0<=R0+1e-9) shapes.push({t:"ray", x1:p.x1, y1:y1, x2:p.x0, y2:y0});        // endpoint at the break, ray off the left edge
          else if(p.x1>=R1-1e-9) shapes.push({t:"ray", x1:p.x0, y1:y0, x2:p.x1, y2:y1});   // endpoint at the break, ray off the right edge
          else shapes.push({t:"segment", x1:p.x0, y1:y0, x2:p.x1, y2:y1});
        });
        (q.answerDots||[]).forEach(function(dt){ shapes.push({t:"point", x:dt.x, y:dt.y, open:!!dt.open}); });
        SKETCH.shapes=shapes; SKETCH.pending=null; draw();   // draw the answer ONTO the graph (and it submits to 10/10)
      };
      setTool("closed");
    }
    // sample the drawing against f(x) defined by q.pieces ({m,b,x0,x1}); fraction covered → score
    function gradeSketch(q){
      var shapes=(SKETCH&&SKETCH.shapes)||[], dom=q.domain||[-8,8], P=q.pieces;
      function fval(x){ for(var i=0;i<P.length;i++){ if(x>=P[i].x0-1e-9 && x<=P[i].x1+1e-9) return P[i].m*x+P[i].b; } return null; }
      function shapeY(s,x){ if(s.t==="point"||s.x1===s.x2) return null; var m=(s.y2-s.y1)/(s.x2-s.x1), y=s.y1+m*(x-s.x1);
        if(s.t==="segment"){ var lo=Math.min(s.x1,s.x2),hi=Math.max(s.x1,s.x2); return (x>=lo-1e-9&&x<=hi+1e-9)?y:null; }
        if(s.t==="ray"){ var dir=s.x2-s.x1; if(dir>0) return x>=s.x1-1e-9?y:null; if(dir<0) return x<=s.x1+1e-9?y:null; return null; }
        return y;
      }
      var hit=0, tot=0;
      for(var x=dom[0]; x<=dom[1]+1e-9; x+=0.5){ var ey=fval(x); if(ey===null) continue; tot++;
        if(shapes.some(function(s){ var y=shapeY(s,x); return y!==null && Math.abs(y-ey)<0.2; })) hit++;
      }
      return tot? Math.round(hit/tot*q.points) : 0;
    }
    function render(){
      var q = DECK[idx];
      if (typeof resetTutorUI==="function") resetTutorUI();
      if (typeof clearSuggest==="function") clearSuggest();   // drop the prior question's remediation nudge

      selEl.textContent = qnum(idx) + " ▾";
      optsEl.innerHTML="";

      var ph = (q.type==="placeholder");

      if (ph) {

        optsEl.innerHTML = '<div class="empty">This question hasn’t been built yet.<br>Send it over and it’ll drop right into this slot.</div>';

      } else if (q.type==="graphform") {

        if (hasTextInput) {

    function clearMarks(){ [].forEach.call(optsEl.querySelectorAll("[data-i]"),function(r){ r.classList.remove("ok","bad"); r.querySelector(".mark").textContent=""; }); }
    // Per-question attempt counts (correct vs incorrect guesses) → relayed to the knowledge canvas.
    var STATS_KEY = "inkling-quiz-stats";
    function bumpStats(correct){
      try {
        if (DECKS[curDeck].generated) return;          // don't track AI/generated sets
        var sec = DECKS[curDeck].id;
        var s = JSON.parse(localStorage.getItem(STATS_KEY) || "{}") || {};
        if (!s[sec]) s[sec] = {};
        var c = s[sec][idx] || { p:0, f:0 };
        if (correct) c.p = Math.min(100, c.p + 1); else c.f = Math.min(100, c.f + 1);
        s[sec][idx] = c;
        localStorage.setItem(STATS_KEY, JSON.stringify(s));

    }
    function finishGrade(pts,max){
      DECKS[curDeck].graded[idx]=pts; setEarned(); persistProgress(); bumpStats(pts===max);
      scoreEl.textContent = pts+" / "+max+" ("+Math.round((pts/max)*100)+"%)";
      scoreEl.style.color = (pts===max)?"var(--ok)":"var(--text)";
      if (typeof showPrereqSuggestion==="function") showPrereqSuggestion(pts,max);  // missed → graph-driven remediation
    }
    function grade(){
      var q=DECK[idx]; if(q.type==="placeholder") return;
      if (q.type==="graphsketch") { finishGrade(gradeSketch(q), q.points); return; }
      if (q.type==="input") {
        var inp=optsEl.querySelector(".ansin"), mk=optsEl.querySelector(".mark");
        if (!(aval(inp)||"").trim()) { scoreEl.textContent="Type an answer"; return; }
        inp.classList.remove("ok","bad");
        var parsed=evalAnswer(numText(inp));
        var correct=(parsed!==null && Math.abs(parsed-q.answer)<1e-9);
        inp.classList.add(correct?"ok":"bad"); if(mk) mk.textContent=correct?"✓":"✗";
        finishGrade(correct?q.points:0, q.points);
        return;
      }
      if (q.type==="tableinput" || q.type==="graphinput" || q.type==="multiinput") {
        var inps=optsEl.querySelectorAll(".ansin"), ok2=0, pendingWord=[];
        [].forEach.call(inps,function(inp,bi){
          inp.classList.remove("ok","bad");
          var ans=q.blanks[bi].answer, right, av=aval(inp);
          if (typeof ans === "number") { var p=evalAnswer(numText(inp)); right=(p!==null && Math.abs(p-ans)<1e-9); }
          else if (/[a-z]/i.test(ans)) { right = isWordAnswer(ans) ? wordMatch(av, ans) : (exprEquiv(av, ans) || exprMatch(av, q.blanks[bi])); }
          else { right = textMatch(av, q.blanks[bi]); }
          inp.classList.add(right?"ok":"bad");
          var mk=inp.nextElementSibling; if(mk&&mk.classList.contains("mark")) mk.textContent=right?"✓":"✗";
          if(right)ok2++;
          else if(isWordAnswer(ans) && (av||"").trim()) pendingWord.push({ inp:inp, bi:bi });
        });
        finishGrade(Math.round(ok2/q.blanks.length*q.points), q.points);
        if (pendingWord.length) llmRegrade(q, pendingWord);  // synonyms / phrasing → AI second opinion
        return;
      }
      if (q.type==="graphform") {
        var ffs=optsEl.querySelectorAll(".ffield"), okf=0;
        [].forEach.call(ffs,function(el){
          var f=q.fields[parseInt(el.getAttribute("data-f"),10)], right;
          el.classList.remove("ok","bad");
          if (f.kind==="select"){ var v=(el.value===""?-1:parseInt(el.value,10)); right=(v===f.answer); }
          else {
            var ans=f.answer, av=aval(el);
            if (typeof ans==="number"){ var p=evalAnswer(numText(el)); right=(p!==null && Math.abs(p-ans)<1e-9); }
            else if (/[a-z]/i.test(ans)){ right = isWordAnswer(ans) ? wordMatch(av, ans) : (exprEquiv(av,ans)||exprMatch(av,{answer:ans})); }
            else { right=textMatch(av,{answer:ans}); }
          }
          el.classList.add(right?"ok":"bad");
          var mk=el.nextElementSibling; if(mk&&mk.classList.contains("mark")) mk.textContent=right?"✓":"✗";
          if(right)okf++;
        });
        finishGrade(Math.round(okf/q.fields.length*q.points), q.points);
        return;
      }
      if (q.type==="match" || q.type==="labelmatch") {
        var mrows=optsEl.querySelectorAll(".mrow"), ok3=0;
        [].forEach.call(mrows,function(row,i){
          var sel=row.querySelector(".msel"); var v=(sel.value===""?-1:parseInt(sel.value,10));
          var right=(v===q.items[i].answer);
          row.classList.remove("ok","bad"); row.classList.add(right?"ok":"bad");
          row.querySelector(".mark").textContent=right?"✓":"✗"; if(right)ok3++;
        });
        finishGrade(Math.round(ok3/q.items.length*q.points), q.points);
        return;
      }
      var rows=optsEl.querySelectorAll("[data-i]"); clearMarks();
      if (q.type==="mc") {
        var sel=-1; [].forEach.call(rows,function(r,i){ if(r.querySelector("input").checked) sel=i; });
        if (sel<0){ scoreEl.textContent="Pick an answer"; return; }
        [].forEach.call(rows,function(row,i){
          if(i===q.correct){row.classList.add("ok");row.querySelector(".mark").textContent="✓";}
          else if(i===sel){row.classList.add("bad");row.querySelector(".mark").textContent="✗";}
        });
        finishGrade(sel===q.correct?q.points:0, q.points);
      } else if (q.type==="select") {
        var tc=q.answer.filter(Boolean).length, ti=q.answer.length-tc, cs=0, is=0;
        [].forEach.call(rows,function(row,i){
          var checked=row.querySelector("input").checked, right=(checked===q.answer[i]);
          if(q.answer[i]&&checked)cs++; if(!q.answer[i]&&checked)is++;
          row.classList.add(right?"ok":"bad"); row.querySelector(".mark").textContent=right?"✓":"✗";
        });
        var frac=Math.max(0, cs/tc - (ti?is/ti:0));
        finishGrade(Math.round(frac*q.points), q.points);
      }
    }

      if (q.type==="match" || q.type==="labelmatch") {
        [].forEach.call(optsEl.querySelectorAll(".mrow"),function(row,i){

        else if (q.type==="select"){ input.checked=!!q.answer[i]; if(q.answer[i]){row.classList.add("ok");row.querySelector(".mark").textContent="✓";} }
      });
      scoreEl.textContent="Answer key"; scoreEl.style.color="var(--ok)";
    }

    // ── Generated-deck ingestion (Inkling / Haiku → quiz format) ───────────────
    // A generated set is plain JSON. Supported question "types" (the internal
    // sorting structure for math questions):
    //   { "type":"mc", "prompt":"…", "options":["…","…",…], "correct":<index> }
    //   { "type":"multiinput", "prompt":"…",
    //     "blanks":[{ "label":"…", "answer":<number | "expr" | "interval">, "answerText":"…"? }] }
    // Answer routing at grade time: number→exact numeric; string with a letter→
    // algebraic equivalence (exprEquiv); else interval/text match. So the AI just
    // emits numbers for computed answers, expressions like "6x+12" for algebra, or
    // interval strings like "(-∞, 3]"/"[0, ∞)" for domains/ranges.
    // Pretty-print plain-text math for DISPLAY only (never the graded answer):
    // sqrt(…)→√(…), x^2→x², b^2→b², +/-→±, <=/>=→≤/≥, infinity→∞, pi→π.
    function prettyMath(s){
      if (s == null) return s;
      s = String(s);
      s = s.replace(/\bsqrt\s*\(/gi, "√(");
      s = s.replace(/\^(\d+)/g, function(_, d){ return d.replace(/\d/g, function(c){ return "⁰¹²³⁴⁵⁶⁷⁸⁹"[+c]; }); });
      s = s.replace(/\+\/-/g, "±");
      s = s.replace(/<=/g, "≤").replace(/>=/g, "≥").replace(/!=/g, "≠");
      s = s.replace(/\binfinity\b/gi, "∞").replace(/\bpi\b/gi, "π");
      return s;
    }
    function normalizeQuestion(q){
      if (!q || typeof q !== "object" || !q.prompt) return null;
      var points = (typeof q.points === "number" && q.points > 0) ? q.points : 10;
      var prompt = prettyMath(String(q.prompt));
      if (q.type === "mc") {
        var options = Array.isArray(q.options) ? q.options.map(function(o){ return prettyMath(String(o)); }) : [];
        if (options.length < 2) return null;
        var correct = (typeof q.correct === "number" && q.correct >= 0 && q.correct < options.length) ? q.correct : 0;
        return { type:"mc", prompt:prompt, options:options, correct:correct, points:points };
      }
      if (q.type === "multiinput" || q.type === "input" || q.type === "numeric" || q.type === "fill") {
        var src = Array.isArray(q.blanks) ? q.blanks
          : (q.answer != null ? [{ label:q.label, answer:q.answer, answerText:q.answerText }] : []);
        var blanks = [];
        src.forEach(function(b){
          if (b == null || b.answer == null) return;
          var ans = b.answer;
          if (typeof ans === "string" && /^-?\d+(\.\d+)?$/.test(ans.trim())) ans = parseFloat(ans);
          // answer stays RAW (graded); label + answerText are prettified (display).
          var nb = { label: prettyMath(String(b.label || "Answer =")), answer: ans };
          if (b.answerText != null) nb.answerText = prettyMath(String(b.answerText));
          blanks.push(nb);
        });
        if (!blanks.length) return null;
        return { type:"multiinput", prompt:prompt, blanks:blanks, points:points };
      }
      return null; // unsupported / unsafe type → skip
    }
    function normalizeDeck(raw){
      if (!raw || typeof raw !== "object") return null;
      var qsrc = Array.isArray(raw.questions) ? raw.questions : (Array.isArray(raw) ? raw : []);
      var questions = [];
      qsrc.forEach(function(q){ var nq = normalizeQuestion(q); if (nq) questions.push(nq); });
      if (!questions.length) return null;
      return {
        id: String(raw.id || raw.section || raw.title || raw.topic || "AI").slice(0, 40),
        title: String(raw.title || raw.topic || "Generated set").slice(0, 120),
        graded: {}, qcount: questions.length, total: questions.length * 10, generated: true,
        tier: raw.tier || null, questions: questions
      };
    }
    function addGeneratedDeck(raw){
      var d = normalizeDeck(raw);
      if (!d) return false;
      var existing = -1;
      DECKS.forEach(function(x,i){ if (x.generated && x.id === d.id) existing = i; });
      if (existing >= 0) DECKS[existing] = d; else DECKS.push(d);
      rebuildSections();
      var di = existing >= 0 ? existing : DECKS.length - 1;
      // An AI set made FOR a precalc section (id like "1.1") joins that section as
      // its ✨ AI Set — switch right into it. A brand-new subject (biology…) lands
      // on the home as its own box.
      if (isPrecalc(d.id)) switchDeck(di);
      else if (typeof showHome === "function") showHome();
      else switchDeck(di);
      return true;
    }

    function showHomeAt(view){ homeView = view || null; buildHome(); document.body.classList.add("quiz-home"); closeMenu(); }

    function restoreLoc(){
      if (bootLoc && bootLoc.view === "deck"){
        var di = -1; for (var i=0;i<DECKS.length;i++){ if (DECKS[i].id === bootLoc.deckId){ di = i; break; } }

          hideHome(); switchDeck(di);

    function goGraph(mode){
      var inApp = window.parent && window.parent !== window;
      if (inApp){ try {
        if (mode === "close") window.parent.postMessage({ type:"inkling-close-flashcard" }, "*");
        else window.parent.postMessage({ type:"inkling-open-graph", mode: mode }, "*");

      } catch(_){} }

    }
    document.getElementById("graph2d").addEventListener("click", function(){ goGraph("2d"); });

    // Deep link: ?q=1.2.11 opens that section's question directly (used by WordWeaver node links).
    function gotoDeepLink(){
      var qp; try { qp = new URLSearchParams(location.search).get("q"); } catch(_){ qp = null; }
      if (!qp) return false;
      var m = /^(\d+\.\d+)\.(\d+)$/.exec(qp.trim()); if (!m) return false;
      var sec = m[1], n = parseInt(m[2],10) - 1, di = -1;
      for (var i=0;i<DECKS.length;i++){ if (DECKS[i].id===sec && !DECKS[i].generated){ di=i; break; } }
      if (di<0) for (var j=0;j<DECKS.length;j++){ if (DECKS[j].id===sec){ di=j; break; } }
      if (di<0) return false;
      hideHome(); switchDeck(di);
      if (n>=0 && n<DECK.length){ idx=n; render(); }

    });

    // ── ✨ Generate a new set via Inkling AI (Haiku backend) ──────────────────
    var genBtn=document.getElementById("genBtn"), genBar=document.getElementById("genBar"),
        genTopic=document.getElementById("genTopic"), genGo=document.getElementById("genGo"), genNote=document.getElementById("genNote");
    function apiBase(){
      try { if (window.__EUGENEOUS_API__) return String(window.__EUGENEOUS_API__).replace(/\/$/,""); } catch(_){}
      return "https://inkling-15yf.onrender.com";
    }
    function authToken(){
      try { var s=JSON.parse(localStorage.getItem("eugeneousxr:session")||"null"); return (s && s.token) || null; } catch(_){ return null; }
    }
    function setNote(msg, kind){ genNote.textContent=msg||""; genNote.className="gennote"+(kind?" "+kind:""); }
    genBtn.addEventListener("click", function(){
      var open = genBar.style.display==="none";

    });
    genTopic.addEventListener("keydown", function(e){ if(e.key==="Enter"){ e.preventDefault(); doGenerate(); } });
    genGo.addEventListener("click", doGenerate);
    function doGenerate(){
      var topic=(genTopic.value||"").trim();
      if (topic.length<2){ setNote("Type a topic first.", "err"); genTopic.focus(); return; }
      if (!authToken()){ setNote("Sign in to Inkling first, then reopen this to generate.", "err"); return; }
      genGo.disabled=true; var orig=genGo.textContent; genGo.textContent="Generating…";
      setNote("Asking Inkling… the AI can take a few seconds (longer if the server was asleep).");
      fetch(apiBase()+"/api/inkling/quiz-set", {
        method:"POST",
        headers:{ "Content-Type":"application/json", "Authorization":"Bearer "+authToken(), "X-Inkling-Client":"Inkling" },
        body: JSON.stringify({ topic: topic })
      }).then(function(res){ return res.json().catch(function(){ return null; }).then(function(d){ return { ok:res.ok, status:res.status, data:d }; }); })
        .then(function(r){
          genGo.disabled=false; genGo.textContent=orig;
          var data=r.data;
          if (!r.ok){ setNote("Couldn't generate — "+((data&&data.error)||("server "+r.status)), "err"); return; }
          var src = data && data.source;
          if (src==="guest"){ setNote("Sign in to Inkling to use the AI generator.", "err"); return; }
          if (src==="capped"){ setNote("You've hit today's AI limit — it resets tomorrow.", "err"); return; }
          if (!data || !Array.isArray(data.questions) || !data.questions.length){ setNote("Couldn't make a set — try a clearer topic.", "err"); return; }
          var deck = { id:"✨ "+topic, title:topic, topic:topic, questions:data.questions };
          if (addGeneratedDeck(deck)){
            setNote((src==="mock"?"(Demo set — live AI fills in once the server is deployed.) ":"")+"Done — showing your new set ↑", "ok");
            genBar.style.display="none"; genTopic.value="";
          } else { setNote("Got a response but couldn't build a set from it.", "err"); }
        })
        .catch(function(){ genGo.disabled=false; genGo.textContent=orig; setNote("Couldn't reach Inkling — check your connection and try again.", "err"); });
    }

    // Make an AI set FOR the current precalc section (joins it as the ✨ AI Set,
    // alongside your 📷 screenshot set). Generated on the section's own topic.
    function makeSectionAiSet(btn, difficulty){
      var sec = DECKS[curDeck].id, title = DECKS[curDeck].title;
      var topic = String(title || sec).replace(/^\s*[^·]*·\s*/, "") || sec;
      if (!authToken()){ btn.textContent = "Sign in first"; return; }
      btn.disabled = true; var orig = btn.textContent; btn.textContent = "✨ …";
      fetch(apiBase()+"/api/inkling/quiz-set", {
        method:"POST",
        headers:{ "Content-Type":"application/json", "Authorization":"Bearer "+authToken(), "X-Inkling-Client":"Inkling" },
        body: JSON.stringify({ topic: topic, section: sec, difficulty: difficulty || "" })
      }).then(function(res){ return res.json().catch(function(){ return null; }).then(function(d){ return { ok:res.ok, data:d }; }); })
        .then(function(r){
          btn.disabled = false; btn.textContent = orig;
          var d = r.data;
          if (!r.ok || !d){ btn.textContent = "retry"; return; }
          if (d.source === "guest"){ btn.textContent = "sign in"; return; }
          if (d.source === "capped"){ btn.textContent = "limit"; return; }
          if (!Array.isArray(d.questions) || !d.questions.length){ btn.textContent = "retry"; return; }
          addGeneratedDeck({ id: sec, title: title, topic: topic, tier: difficulty || null, questions: d.questions });
        })
        .catch(function(){ btn.disabled = false; btn.textContent = orig; });
    }

    // ── 🤖 Explain / 💡 Hint — AI tutor: progressive hints (nudge → step → full worked solution) ──
    var explainPanel=document.getElementById("explainPanel"), explainBody=document.getElementById("explainBody"),
        explainInput=document.getElementById("explainInput"), explainSend=document.getElementById("explainSend"),
        explainBtn=document.getElementById("explainBtn"), explainClose=document.getElementById("explainClose"),
        hintBtn=document.getElementById("hintBtn");
    var explainHistory=[], explainQIdx=null, explainBusy=false, hintLevel=0, fullShown=false, sessionQA=null;

    // Cache full worked solutions so reopening Explain on a question is instant + costs no API call.
    var EXPLAIN_CACHE_KEY="inkling-quiz-explain-cache";
    function explainKey(qa){ return (qa.prompt+"||"+qa.answer).toLowerCase().replace(/\s+/g," ").trim().slice(0,300); }
    function getExplainCache(qa){ try{ var m=JSON.parse(localStorage.getItem(EXPLAIN_CACHE_KEY)||"{}"); return m[explainKey(qa)]||null; }catch(e){ return null; } }
    function setExplainCache(qa, reply){ try{ var m=JSON.parse(localStorage.getItem(EXPLAIN_CACHE_KEY)||"{}"); var k=explainKey(qa); if(!(k in m)){ var ks=Object.keys(m); while(ks.length>=80){ delete m[ks.shift()]; } } m[k]=reply; localStorage.setItem(EXPLAIN_CACHE_KEY, JSON.stringify(m)); }catch(e){} }

    function exAdd(kind, text){
      var d=document.createElement("div"); d.className="ex-msg ex-msg--"+kind; d.textContent=text;
      explainBody.appendChild(d); explainBody.scrollTop=explainBody.scrollHeight; return d;
    }
    function currentQA(){
      var q=DECK[idx]||{};
      var prompt=String(q.prompt||"").replace(/<[^>]+>/g," ").replace(/&[a-z]+;/gi," ").replace(/\s+/g," ").trim();
      var ans="";
      if (q.type==="mc" && Array.isArray(q.options)) ans=String(q.options[q.correct]||"").replace(/<[^>]+>/g,"").trim();
      else if (Array.isArray(q.blanks)) ans=q.blanks.map(function(b){ return b.answerText!=null?b.answerText:b.answer; }).join("; ");
      else if (Array.isArray(q.fields)) ans=q.fields.map(function(f){ return f.kind==="select"?(f.choices&&f.choices[f.answer]):(f.answerText!=null?f.answerText:f.answer); }).join("; ");
      return { prompt:prompt, answer:ans };
    }
    function updateHintBtn(){
      if (!hintBtn) return;
      if (fullShown){ hintBtn.textContent="💡 Hint"; hintBtn.disabled=true; return; }
      hintBtn.disabled=false;
      hintBtn.textContent = hintLevel===0 ? "💡 Hint" : hintLevel===1 ? "💡 Another hint" : "💡 Show solution";
    }
    function resetTutorUI(){
      explainQIdx=null; hintLevel=0; fullShown=false;
      if (explainPanel) explainPanel.classList.add("hidden");
      updateHintBtn();
    }
    function ensureSession(){
      if (explainQIdx===idx) return;
      explainQIdx=idx; explainBody.innerHTML=""; explainHistory=[]; hintLevel=0; fullShown=false; sessionQA=currentQA();
    }
    function callExplain(mode, cacheQA){
      if (explainBusy) return;
      if (!authToken()){ exAdd("note","Sign in to Inkling to get AI help."); return; }
      explainBusy=true; explainSend.disabled=true; if(hintBtn) hintBtn.disabled=true;
      var thinking=exAdd("ai","…");
      fetch(apiBase()+"/api/inkling/explain",{ method:"POST",
        headers:{ "Content-Type":"application/json", "Authorization":"Bearer "+authToken() },
        body: JSON.stringify({ history: explainHistory, mode: mode||"" }) })
        .then(function(r){ return r.json().catch(function(){return null;}).then(function(d){ return {ok:r.ok,data:d}; }); })
        .then(function(r){
          thinking.remove();
          var d=r.data;

    var KG_PRINCIPLE = {
      "functions":"The rule makes a strict promise — one input can't give two different outputs. That single-valued-ness is what lets you predict, reverse, and build on it: every input has one definite answer.",
      "linear-functions":"The rate of change never varies. Add the same amount to x and y always moves by the same step — and 'the same step every time' is exactly what draws a straight line.",
      "quadratics":"x is multiplied by itself, so the output grows faster and faster. That squaring bends the straight line into a curve that rises, turns exactly once, and falls — which is why there's always a single highest or lowest point.",
      "factoring":"Multiplication can be run backwards: any expression is the product of smaller pieces. Finding those pieces exposes the values that make it zero — its roots.",
      "derivatives":"Zoom in until the interval you measure over is a single instant, and the average rate of change becomes the exact rate at that point — the slope of the curve right there.",
      "trigonometry":"Similar right triangles keep the same side ratios no matter their size, so one angle always pins down sin, cos, and tan — turning a direction into numbers.",
      "complex-numbers":"Invent one new number, i, whose square is −1. That single rule gives every equation a solution and quietly turns multiplication into rotation.",
      "exponential-functions":"You multiply each step instead of adding, so growth is proportional to how big it already is — the bigger it gets, the faster it moves.",
      "logarithms":"It asks the reverse of an exponent — 'what power makes this number?' — which turns multiplying into adding and squeezes huge ranges into small, countable steps.",
      "probability":"Split every possible outcome into equally likely pieces and count the ones you care about. The fraction that match is how likely the event is.",
      "limits":"You never have to arrive — you only have to get arbitrarily close. Pinning down the value a function approaches is enough to define slopes and areas exactly.",
      "gcf":"Every term is built from shared factors; pulling out the biggest shared one leaves a simpler expression that means exactly the same thing.",
      "distributive-property":"Multiplying by a group is the same as multiplying each member and adding — which is why it can be run forward (expand) or backward (factor).",
      "artificial-intelligence":"It works by turning 'being smart' into a concrete goal — take the action that best achieves a measurable objective given the information available.",
      "intelligent-agents":"Define what success means (a performance measure), and rational behavior is just picking the action expected to score highest on it.",
      "search-algorithms":"Every problem becomes a graph of states; exploring that graph in a disciplined order is guaranteed to find a goal if one exists.",
      "heuristic-search":"Adding an estimate of the distance left steers effort toward the goal — and never overestimating keeps the answer optimal.",
      "machine-learning":"Learning is optimization: define an error, then adjust the model's numbers until that error is as small as possible on the examples.",
      "neural-networks":"Because each layer is differentiable, you can measure how every weight affects the error and nudge them all downhill — over millions of examples that composes into intelligence.",
      "electric-current":"Charge always flows from high potential to low, and the rate it flows is set by how hard it's pushed against how much the path resists — push and resistance fully determine flow.",
      "ohms-law":"Voltage, current, and resistance aren't three separate facts — they're one relationship (V = I·R), so any two always pin down the third.",

        door("① What is it","#a5b4fc",whatBody,true);
        var princ=KG_PRINCIPLE[slug];
        if (princ) door("⚙️ Why it works","#a5b4fc",'<div style="font:500 13px/1.55 system-ui;color:var(--text)">'+kgEsc(princ)+'</div>',false);
        if (c.why) door("② Why it matters","#f0abfc",'<div style="font:500 13.5px/1.55 system-ui;color:var(--text)">'+kgEsc(c.why)+'</div>',false);
      } else {
        door("① What is it","#a5b4fc",'<div style="font:500 13px/1.5 system-ui;color:var(--muted,#9aa3bd)">This card is an entry point — the concept graph for this topic is still being mapped.</div>',true);
      }

      // 🔀 The same idea, elsewhere (cross-domain equivalences)
      var same = slug ? kgEdges(slug,"sameIdea") : [];
      if (same.length){
        door("🔀 The same idea, elsewhere","#e879f9", same.map(function(e){
          return '<div style="font:500 13px/1.55 system-ui;color:var(--text);margin-top:6px"><b style="color:#f0abfc">'+kgEsc(kgLabel(e.to))+'</b> — '+kgEsc(e.reason||"")+kgConfBadge(e)+'</div>';
        }).join(''), false);
      }

      // 💼 Where it's used (Relevance Engine)
      if (rel){
        var useBody='<div style="font:500 13.5px/1.55 system-ui;color:var(--text)">'+rel.text+'</div>'
          + ((rel.careers&&rel.careers.length)?'<div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:6px">'+rel.careers.map(function(x){ return '<span style="background:rgba(56,189,248,.15);border:1px solid rgba(56,189,248,.35);border-radius:999px;padding:3px 10px;font:700 11px system-ui;color:#7dd3fc">'+kgEsc(x)+'</span>'; }).join("")+'</div>':'');
        door("💼 Where it's used","#38bdf8",useBody,false);
      }

      // 🧭 Where it fits — before & after path
      if (c){
        var arrow=function(chain,hereIdx){
          return '<div style="font:600 13px/1.7 system-ui">'+chain.map(function(s,i){
            var here=i===hereIdx;
            var node='<span style="'+(here?'background:rgba(165,180,252,.22);border:1px solid rgba(165,180,252,.5);color:#c7d2fe;font-weight:800;':'color:var(--text);')+'border-radius:7px;padding:2px 9px;display:inline-block">'+kgEsc(kgLabel(s))+'</span>';
            return node+(i<chain.length-1?'<div style="color:#64748b;font-size:12px;line-height:1.1">↓</div>':'');
          }).join("")+'</div>';
        };
        var pre=kgChain(slug,"prerequisite",3), nxt=kgChain(slug,"next",3);
        var pathBody=
            '<div style="font:800 10.5px system-ui;color:#fca5a5;margin-bottom:3px">WHAT TO KNOW FIRST</div>'
          + (pre.length>1?arrow(pre,pre.length-1):'<div style="font:500 13px system-ui;color:var(--muted,#9aa3bd)">Foundational — no prerequisites.</div>')
          + '<div style="font:800 10.5px system-ui;color:#86efac;margin:11px 0 3px">WHAT IT LEADS TO</div>'
          + (nxt.length>1?arrow(nxt,0):'<div style="font:500 13px system-ui;color:var(--muted,#9aa3bd)">You\'re near the frontier of this track.</div>');
        door("🧭 Where it fits (before & after)","#fca5a5",pathBody,false);
      }

      // 🔗 How it connects (typed relationship chips)
      if (c){
        var connectTypes=["related","career","industry","project","history"], rows="";
        connectTypes.forEach(function(t){
          var es=kgEdges(slug,t); if(!es.length) return;
          var meta=KG_TYPES[t]||{label:t};
          rows+='<div style="margin-top:8px"><div style="font:800 10.5px system-ui;color:var(--muted,#9aa3bd);letter-spacing:.3px;margin-bottom:4px">'+(meta.icon?meta.icon+" ":"")+kgEsc((meta.label||t).toUpperCase())+'</div>';
          rows+='<div style="display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center">'+es.map(function(e){
            return '<span style="display:inline-flex;align-items:center;background:rgba(148,163,184,.12);border:1px solid rgba(148,163,184,.28);border-radius:999px;padding:3px 9px;font:700 11.5px system-ui;color:var(--text)">'+kgEsc(kgLabel(e.to))+kgConfBadge(e)+'</span>';
          }).join("")+'</div></div>';
        });
        if (rows) door("🔗 How it connects","#fdba74",'<div style="font:500 11px system-ui;color:var(--muted,#9aa3bd);margin:0 0 2px">Human-verified vs AI-suggested (with confidence).</div>'+rows,false);
      }

      var html=secs.map(function(s){
        return '<div class="kgsec">'
          + '<button type="button" class="kgsec-h" style="width:100%;text-align:left;background:none;border:none;border-top:1px solid rgba(148,163,184,.16);cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 2px;font:800 12px system-ui;color:'+s.color+';letter-spacing:.2px">'
          +   '<span>'+s.label+'</span><span class="kgsec-chev" style="color:var(--muted,#9aa3bd);font-size:11px">'+(s.open?'▾':'▸')+'</span>'
          + '</button>'
          + '<div class="kgsec-b" style="display:'+(s.open?'block':'none')+';padding:0 2px 10px">'+s.body+'</div>'
        + '</div>';
      }).join('');

      var d=document.createElement("div");
      d.id="kgPortal";
      d.style.cssText="background:linear-gradient(180deg,rgba(99,102,241,.08),rgba(56,189,248,.05));border:1px solid rgba(129,140,248,.30);border-radius:14px;padding:12px 14px 8px;margin-bottom:6px";
      d.innerHTML='<div style="font:900 12.5px system-ui;color:#c7d2fe;letter-spacing:.5px;display:flex;align-items:center;gap:6px">📘 ABOUT THIS CONCEPT'+
        (c?'<span style="font:700 11px system-ui;color:var(--muted,#9aa3bd)">· '+kgEsc(c.title)+(c.difficulty?' · difficulty '+c.difficulty+'/5':'')+'</span>':'')+'</div>'+
        '<div style="font:500 11px system-ui;color:var(--muted,#9aa3bd);margin:3px 0 4px">Tap a section to open it 👇</div>'+html;
      // One delegated toggle for every collapsible door.
      d.addEventListener("click",function(ev){
        var h=ev.target && ev.target.closest ? ev.target.closest(".kgsec-h") : null;
        if(!h || !d.contains(h)) return;
        var body=h.nextElementSibling, chev=h.querySelector(".kgsec-chev");
        if(!body) return;
        var isOpen=body.style.display!=="none";
        body.style.display=isOpen?"none":"block";
        if(chev) chev.textContent=isOpen?"▸":"▾";
      });
      if (opts.override){
        var back=document.createElement("button");
        back.type="button"; back.textContent="← back to your question";
        back.style.cssText="cursor:pointer;background:none;border:none;color:#93c5fd;font:800 12px system-ui;padding:0;margin-bottom:4px;text-decoration:underline;display:block";
        back.addEventListener("click",function(){ explainBody.innerHTML=""; showKnowledgePortal(); });
        d.insertBefore(back, d.firstChild);
      }
      explainBody.insertBefore(d, explainBody.firstChild);
      explainBody.scrollTop=0;
    }
    // The current question's portal (once per question, opened by Explain/Hint).
    function showKnowledgePortal(){
      if (!explainBody || document.getElementById("kgPortal")) return;
      var slug=kgSlugFor(DECKS[curDeck].id, DECKS[curDeck].title, sessionQA && sessionQA.prompt);
      if (!slug) return;   // no genuine concept match → no concept card (avoids subject-only noise)
      renderPortalFor(slug, { deckId:DECKS[curDeck].id, title:DECKS[curDeck].title, prompt: sessionQA && sessionQA.prompt });
    }
    // Open the panel focused on a prerequisite concept the student chose to review.
    function openConceptPortal(slug){
      if (!explainPanel || !explainBody) return;
      explainPanel.classList.remove("hidden");
      explainBody.innerHTML="";
      renderPortalFor(slug, { deckId:"", override:true });
    }
    /* ── AI Suggestion Engine ────────────────────────────────────────────────
       A missed question is a signal, not just a score. Resolve the question's
       concept, walk its prerequisite EDGES, and surface the building blocks to
       shore up first — turning the graph from a display into remediation. Every
       chip opens that prerequisite's own Knowledge Portal. ───────────────────*/
    function clearSuggest(){ var s=document.getElementById("kgSuggest"); if(s) s.remove(); }
    function showPrereqSuggestion(pts, max){
      clearSuggest();
      if (pts>=max) return;                        // full credit → no nudge
      var qa=currentQA();
      var slug=kgSlugFor(DECKS[curDeck].id, DECKS[curDeck].title, qa.prompt);
      if (!slug) return;                           // unmapped topic → stay quiet
      var pre=kgEdges(slug,"prerequisite"), c=KG.concepts[slug];
      var mainEl=document.querySelector("main"); if (!mainEl) return;
      var d=document.createElement("div"); d.id="kgSuggest";
      d.style.cssText="margin:14px 0 4px;background:linear-gradient(180deg,rgba(251,113,133,.09),rgba(129,140,248,.06));border:1px solid rgba(251,113,133,.32);border-radius:13px;padding:11px 13px";
      var head='<div style="font:800 11.5px system-ui;color:#fca5a5;letter-spacing:.3px;margin-bottom:6px">🧭 SHORE UP THE BASICS FIRST</div>';
      if (pre.length){
        d.innerHTML=head+
          '<div style="font:500 13px/1.5 system-ui;color:var(--text);margin-bottom:8px">Struggling with <b>'+kgEsc(c?c.title:kgLabel(slug))+'</b>? It builds on these — tap one to review:</div>'+
          '<div style="display:flex;flex-wrap:wrap;gap:7px">'+pre.map(function(e){
            return '<button type="button" class="kg-pre" data-slug="'+kgEsc(e.to)+'" style="cursor:pointer;display:inline-flex;align-items:center;background:rgba(129,140,248,.14);border:1px solid rgba(129,140,248,.42);border-radius:999px;padding:4px 11px;font:700 12px system-ui;color:#c7d2fe">'+kgEsc(kgLabel(e.to))+kgConfBadge(e)+'</button>';
          }).join("")+'</div>';
      } else if (c){
        d.innerHTML=head+'<div style="font:500 13px/1.5 system-ui;color:var(--text)">This is a foundational concept with no prerequisites. <button type="button" id="kgReview" style="cursor:pointer;background:none;border:none;color:#c7d2fe;font:800 13px system-ui;text-decoration:underline;padding:0">Open its Knowledge Portal →</button></div>';
      } else { return; }
      mainEl.appendChild(d);
      [].forEach.call(d.querySelectorAll(".kg-pre"),function(b){ b.addEventListener("click",function(){ openConceptPortal(b.getAttribute("data-slug")); }); });
      var rv=d.querySelector("#kgReview"); if (rv) rv.addEventListener("click",function(){ openConceptPortal(slug); });
    }
    /* ── Real-world scenario for THIS specific problem ───────────────────────
       Concept cards are the same across a section; a student wants to know what
       THIS exact question maps to in the real world. Two layers: a free, instant
       scenario keyed to the problem's SHAPE (line, parabola, growth, angle…) that
       varies per question and works for guests, plus a "tailor with AI" button
       that writes a bespoke scenario for the precise problem (signed-in, cached). */
    var SCENARIO_CACHE_KEY="inkling-quiz-scenario-cache";
    function scenarioGet(qa){ try{ var m=JSON.parse(localStorage.getItem(SCENARIO_CACHE_KEY)||"{}"); return m[explainKey(qa)]||null; }catch(e){ return null; } }
    function scenarioSet(qa,txt){ try{ var m=JSON.parse(localStorage.getItem(SCENARIO_CACHE_KEY)||"{}"); var k=explainKey(qa); if(!(k in m)){ var ks=Object.keys(m); while(ks.length>=80){ delete m[ks.shift()]; } } m[k]=txt; localStorage.setItem(SCENARIO_CACHE_KEY, JSON.stringify(m)); }catch(e){} }
    // Shape/topic detectors → a concrete real-world framing. First match wins.
    function localScenario(qa){
      var t=((qa.prompt||"")+" "+(qa.answer||"")).toLowerCase();
      if (/imaginary|complex number|a\s*\+\s*bi/.test(t)) return "Picture an AC power line: engineers write the voltage as a complex number, where the imaginary part tracks how far the current lags behind — the same a + bi you're working with here keeps a city's grid in phase.";
      if (/x\s*²|x\s*\^\s*2|quadratic|parabola/.test(t)) return "A parabola is worth more than its curve. Its single focus point is why satellite dishes, headlights, and telescope mirrors are shaped this way (every ray meets at one spot); its single peak is how a business finds max profit or an engineer finds max height. Something like 3x²+2x could be the area of a panel whose length is 2 more than 3× its width — set it to your target size and solve. And doubling a car's speed quadruples its braking distance for this exact reason: the square.";
      if (/exponential|half-life|compound|\bdecay\b|growth factor|\bb\s*\^\s*x|2\s*\^|e\s*\^/.test(t)) return "This is the shape of $500 compounding in a savings account, a rumor doubling each retelling, or a radioactive sample fading by half — slow at first, then racing away (or vanishing) faster and faster.";
      if (/sine|cosine|tangent|radian|angle|trig/.test(t)) return "Think of a Ferris wheel or a piston: as the angle turns, your height traces a sine wave. The same math points a satellite dish, spins a game character, and shapes a sound wave.";
      if (/slope|linear|point-slope|\bm\s*x\b|y\s*=\s*-?\d*\.?\d*\s*x/.test(t)) return "Treat this line as a road's incline or a phone plan: the slope is how steep the climb — or how much each extra mile or gigabyte costs — and the starting value is the height you set out from, or the flat monthly base.";
      if (/\b[a-z]\(\s*-?\d/i.test(t)) return "Plugging a number into the function is like setting a machine's dial: feed in a value (hours parked, items in the cart, miles driven) and read the single output it returns — the price, the total, the distance.";
      if (/probab|likelihood|\bodds\b|\bdice\b|\bcoin\b/.test(t)) return "This is the math a meteorologist uses for '70% chance of rain,' an insurer uses to price your premium, and a self-driving car uses to decide how sure it is that shape ahead is a pedestrian.";
      return null;
    }
    function showScenario(){
      if (!explainBody || document.getElementById("kgScenario")) return;
      var qa=sessionQA || currentQA();
      var box=document.createElement("div"); box.id="kgScenario";
      box.style.cssText="background:linear-gradient(180deg,rgba(52,211,153,.11),rgba(56,189,248,.05));border:1px solid rgba(52,211,153,.32);border-radius:12px;padding:11px 13px;margin-bottom:8px";
      box.innerHTML='<div style="font:800 11px system-ui;color:#34d399;letter-spacing:.4px;margin-bottom:5px">🌍 THIS PROBLEM IN THE REAL WORLD</div><div id="kgScenarioBody" style="font:500 13.5px/1.55 system-ui;color:var(--text)"></div>';
      explainBody.insertBefore(box, explainBody.firstChild);
      var body=box.querySelector("#kgScenarioBody");
      var cached=scenarioGet(qa), local=localScenario(qa);
      if (cached){ body.innerHTML=cached; return; }
      if (local) body.innerHTML=local;
      else if (!authToken()){ body.innerHTML='<span style="color:var(--muted,#9aa3bd)">Sign in to Inkling for a real-world scenario tailored to this exact problem.</span>'; return; }
      if (authToken()){
        var btn=document.createElement("button");
        btn.type="button"; btn.textContent="✨ Tailor this to the exact problem";
        btn.style.cssText="margin-top:8px;cursor:pointer;background:rgba(52,211,153,.14);border:1px solid rgba(52,211,153,.4);border-radius:999px;padding:4px 12px;font:700 12px system-ui;color:#6ee7b7";
        btn.addEventListener("click",function(){
          btn.disabled=true; body.textContent="…";
          var ask="In 2–3 vivid sentences, describe a specific real-world scenario where THIS exact problem's math shows up. Invent concrete, plausible details — real objects, quantities, units. If it involves a line, curve, graph, or points, say what they could physically represent (a road's incline, a thrown ball's arc, a motor's RPM in a given gear, a pricing plan). Do NOT solve it or restate the question. Problem: "+qa.prompt+(qa.answer?" (the answer is "+qa.answer+")":"");
          fetch(apiBase()+"/api/inkling/explain",{ method:"POST", headers:{ "Content-Type":"application/json","Authorization":"Bearer "+authToken() }, body:JSON.stringify({ history:[{role:"user",content:ask}], mode:"scenario" }) })
            .then(function(r){ return r.json().catch(function(){return null;}); })
            .then(function(d){
              if(!d){ body.textContent="Couldn't reach Inkling — try again."; return; }
              if(d.source==="guest"){ body.innerHTML='<span style="color:var(--muted,#9aa3bd)">Sign in to Inkling for a tailored scenario.</span>'; return; }
              if(d.source==="capped"){ body.textContent="You've hit today's AI limit — resets tomorrow."; return; }
              var reply=String(d.reply||"").trim(); if(!reply){ body.textContent=local||"Hmm — couldn't picture one this time."; return; }
              var safe=reply.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\n/g,"<br>");
              body.innerHTML=safe; scenarioSet(qa, safe);
            })
            .catch(function(){ body.textContent=local||"Couldn't reach Inkling — check your connection."; });
        });
        box.appendChild(btn);
      }
    }
    function openExplain(){
      ensureSession();
      explainPanel.classList.remove("hidden");
      showKnowledgePortal();
      showScenario();
      showFull();
      explainInput.focus();
    }
    function requestHint(){
      ensureSession();
      explainPanel.classList.remove("hidden");
      showKnowledgePortal();
      showScenario();
      if (fullShown || explainBusy){ explainInput.focus(); return; }
      var qa=sessionQA;
      if (hintLevel===0){
        hintLevel=1;
        explainHistory.push({ role:"user", content:"Question: "+qa.prompt+(qa.answer?"\n(The answer is "+qa.answer+" — do NOT reveal it.)":"")+"\n\nGive me a small hint to get started." });
        callExplain("nudge");
      } else if (hintLevel===1){
        hintLevel=2;
        explainHistory.push({ role:"user", content:"Give me the first concrete step, then stop." });
        callExplain("step");
      } else {
        showFull();
      }
    }
    function sendFollowup(){
      var t=(explainInput.value||"").trim(); if(!t || explainBusy) return;
      ensureSession();
      exAdd("me", t); explainHistory.push({ role:"user", content:t }); explainInput.value=""; callExplain("");
    }
    explainBtn.addEventListener("click", openExplain);
    if (hintBtn) hintBtn.addEventListener("click", requestHint);
    explainClose.addEventListener("click", function(){ explainPanel.classList.add("hidden"); });
    explainSend.addEventListener("click", sendFollowup);
    explainInput.addEventListener("keydown", function(e){ if(e.key==="Enter"){ e.preventDefault(); sendFollowup(); } });

    // AI second opinion on a missed WORD answer (synonyms / phrasing). Flips to ✓ if the LLM accepts it.
    function llmRegrade(q, pending){
      if (!authToken()) return;
      var atDeck=curDeck, atIdx=idx, total=q.blanks.length;
      var promptText=String(q.prompt||"").replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim();
      pending.forEach(function(p){
        var inp=p.inp, mk=inp.nextElementSibling, expected=q.blanks[p.bi].answer, given=aval(inp);
        fetch(apiBase()+"/api/inkling/grade",{ method:"POST",
          headers:{ "Content-Type":"application/json", "Authorization":"Bearer "+authToken() },
          body: JSON.stringify({ question:promptText, expected:expected, given:given }) })
          .then(function(r){ return r.json(); })
          .then(function(d){
            if (curDeck!==atDeck || idx!==atIdx) return;     // user moved on — don't touch
            if (d && d.correct){
              inp.classList.remove("bad"); inp.classList.add("ok");
              if (mk && mk.classList.contains("mark")) mk.textContent="✓";
              var ok=optsEl.querySelectorAll(".ansin.ok").length;
              finishGrade(Math.round(ok/total*q.points), q.points);
            }
          }).catch(function(){});
      });
    }
  })();
  </script>
</body>
</html>
