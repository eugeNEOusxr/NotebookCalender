<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>WordWeaver — Knowledge Canvas</title>
<style>
  :root{
    --bg:#070912; --panel:#0e1320; --line:#1f2740; --text:#e8ecf6; --muted:#8a93ad; --accent:#7c5cff;
    --domain:#ffcf5c; --chapter:#b48bff; --section:#5aa9ff; --subsection:#3fe0d0; --problem:#ff8a4c; --step:#7be08a; --answer:#ffd66b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-user-select:none;user-select:none}
  #cv{display:block;width:100vw;height:100vh;touch-action:none;cursor:grab}
  #cv.drag{cursor:grabbing}
  /* HUD */
  .hud{position:fixed;z-index:5;pointer-events:none}
  #crumb{top:12px;left:14px;right:14px;display:flex;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
  #crumb .cb{pointer-events:auto;cursor:pointer;padding:3px 9px;border:.5px solid var(--line);border-radius:999px;background:rgba(14,19,32,.7);backdrop-filter:blur(6px);color:var(--text);white-space:nowrap;max-width:42vw;overflow:hidden;text-overflow:ellipsis}
  #crumb .cb:hover{border-color:var(--accent)}
  #crumb .sep{align-self:center;opacity:.5}
  #title{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:4;font-weight:700;letter-spacing:.5px;font-size:15px;color:#fff;opacity:.85;pointer-events:none}
  #title small{font-weight:500;color:var(--muted)}
  /* node card */
  #card{position:fixed;left:14px;bottom:14px;z-index:6;width:min(330px,86vw);background:rgba(14,19,32,.92);backdrop-filter:blur(10px);border:.5px solid var(--line);border-radius:16px;padding:14px 15px;box-shadow:0 18px 50px rgba(0,0,0,.5);transform:translateY(140%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
  #card.show{transform:translateY(0)}
  #card .kind{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
  #card h2{margin:3px 0 6px;font-size:18px;line-height:1.2}
  #card p{margin:0 0 12px;font-size:13.5px;line-height:1.5;color:#c7cee0}
  #card .row{display:flex;gap:8px;flex-wrap:wrap}
  .btn{pointer-events:auto;border:none;border-radius:10px;padding:9px 13px;font-size:13px;font-weight:600;cursor:pointer;background:#1a2236;color:var(--text)}
  .btn:hover{background:#23304c}
  .btn.acc{background:var(--accent);color:#fff}
  .btn.acc:hover{filter:brightness(1.08)}
  .btn:disabled{opacity:.5;cursor:default}
  /* hover preview of a flashcard question */
  #peek{position:fixed;z-index:7;max-width:300px;background:rgba(12,17,30,.96);backdrop-filter:blur(10px);border:.5px solid var(--problem);border-radius:13px;padding:10px 12px;box-shadow:0 14px 40px rgba(0,0,0,.55);pointer-events:none;opacity:0;transform:translateY(6px);transition:opacity .14s,transform .14s;display:none}
  #peek.show{opacity:1;transform:translateY(0)}
  #peek .peek-h{font-size:11px;letter-spacing:.5px;color:var(--problem);font-weight:700;margin-bottom:5px}
  #peekBody{font-size:13.5px;line-height:1.45;color:#e9edf8}
  #peek .peek-go{margin-top:7px;font-size:11px;color:var(--muted)}
  /* controls */
  #ctl{right:14px;bottom:14px;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
  #ctl button{pointer-events:auto;width:42px;height:42px;border-radius:12px;border:.5px solid var(--line);background:rgba(14,19,32,.85);color:var(--text);font-size:19px;cursor:pointer}
  #ctl button:hover{border-color:var(--accent)}
  #hint{left:50%;bottom:16px;transform:translateX(-50%);font-size:12px;color:var(--muted);background:rgba(14,19,32,.6);padding:5px 12px;border-radius:999px;white-space:nowrap}
  /* legend */
  #topright{position:fixed;right:14px;top:12px;z-index:6;display:flex;gap:8px;align-items:center}
  #to3d{pointer-events:auto;border:.5px solid var(--accent);background:rgba(124,92,255,.18);color:#cdbcff;font-weight:700;font-size:13px;padding:7px 12px;border-radius:999px;cursor:pointer;backdrop-filter:blur(6px)}
  #to3d:active{background:var(--accent);color:#fff}
  #exitCanvas{pointer-events:auto;width:34px;height:34px;border-radius:50%;border:.5px solid rgba(255,90,90,.55);background:rgba(14,19,32,.85);color:#ff7a7a;font-size:15px;font-weight:700;cursor:pointer}
  #exitCanvas:active{background:#ff5a5a;color:#fff}
  #legend{right:14px;top:50px;display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--muted);text-align:right}
  #legend .lg{display:flex;align-items:center;gap:6px;justify-content:flex-end}
  #legend .dot{width:9px;height:9px;border-radius:50%}
  .spin{display:inline-block;width:12px;height:12px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-1px;margin-right:6px}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="title">Word<span style="color:var(--accent)">Weaver</span> &nbsp;<small>knowledge canvas</small></div>
<div id="crumb" class="hud"></div>
<div id="legend" class="hud">
  <div class="lg"><span>Domain</span><span class="dot" style="background:var(--domain)"></span></div>
  <div class="lg"><span>Chapter</span><span class="dot" style="background:var(--chapter)"></span></div>
  <div class="lg"><span>Section</span><span class="dot" style="background:var(--section)"></span></div>
  <div class="lg"><span>Subsection</span><span class="dot" style="background:var(--subsection)"></span></div>
  <div class="lg"><span>Problem</span><span class="dot" style="background:var(--problem)"></span></div>
  <div class="lg"><span>Solution step</span><span class="dot" style="background:var(--step)"></span></div>
</div>
<div id="topright" class="hud">
  <button id="to3d" title="Open the 3D Study Map">🌀 3D Study Map</button>
  <button id="exitCanvas" title="Exit the knowledge canvas">✕</button>
</div>
<div id="ctl" class="hud">
  <button id="zin" title="Zoom in">+</button>
  <button id="zout" title="Zoom out">−</button>
  <button id="home" title="Reset view">⌂</button>
</div>
<div id="hint" class="hud">Scroll / pinch to zoom · drag to pan · tap a topic to dive · tap a 📇 question to open it</div>
<div id="peek"><div class="peek-h"><span id="peekTag">📇 Flashcard question</span></div><div id="peekBody"></div><div class="peek-go">click to open in flashcards →</div></div>
<div id="card">
  <div class="kind" id="cardKind"></div>
  <h2 id="cardTitle"></h2>
  <p id="cardDesc"></p>
  <div class="row">
    <button class="btn acc" id="cardExpand">✨ Break it down</button>
    <button class="btn" id="cardOpen" style="display:none">📇 Open flashcard →</button>
    <button class="btn" id="cardUp">↑ Parent</button>
  </div>
</div>

  /* ── Build the node model: id, title, description, parentId, children[], depthLevel, contentType ── */
  var NODES = [], byId = {}, _uid = 0;
  function build(raw, parent, depth){
    var node = {
      id: "n" + (_uid++),
      title: raw.t,
      description: raw.d || "",
      contentType: raw.k,
      parentId: parent ? parent.id : null,
      depthLevel: depth,
      children: [],
      q: raw.q || null,              // deep link into the flashcards (e.g. "1.2.11")
      prev: raw.prev || null,        // hover preview = the flashcard question itself
      done: false,                   // completed in the quiz (learning trajectory)
      pass: 0, fail: 0,              // correct vs incorrect guess counts (from the quiz)
      _expanded: false, _aiKids: false,
      appear: parent ? 0 : 1            // grow-in animation progress
    };
    NODES.push(node); byId[node.id] = node;
    if (parent) parent.children.push(node);
    (raw.ch || []).forEach(function(c){ build(c, node, depth + 1); });

  /* ─────────────────────────────────────────────────────────────────────────
     LAYOUT — a GROWING SPIRAL with Precalculus at the core. The 12 chapters are
     laid head-to-tail along an Archimedean spiral: each owns an angular span
     sized by how much lives beneath it, and the spiral radius grows with the
     running angle. While the built-out chapters still fit inside one turn they
     simply sit side by side on the circumference (Ch.2 extends just past Ch.1);
     once they overflow 2π the spiral keeps looping outward around the core, so
     every chapter keeps its own room no matter how large the map grows. Each
     chapter's subtree (sections → topics → questions) fans outward from the
     chapter within its own angular span — the familiar sunburst, re-anchored.
  ───────────────────────────────────────────────────────────────────────── */
  var SIZE  = [120, 52, 30, 13, 11, 8, 6];          // node radius per depth (question orbs trimmed so the
                                                    // dense Ch.1 ring stops overlapping — a hair of gap)
  var RSTEP = [0, 0, 600, 600, 280, 200, 150];      // radius a child sits beyond its parent, by child depth
                                                    // (question ring pushed out so the orbs spread apart
                                                    //  radially — more circumference, same wedge → no bleed
                                                    //  into the neighbouring chapter's angular slice)
  // Concentric rings first, spiral later: chapters share ONE radius (so every chapter's
  // sections line up on the blue ring and questions line up on the outer ring) for the whole
  // first turn; only as the arc nears a full circle back to 1.1.1 does the radius ease outward,
  // gracefully clearing 1.1.1 and opening into a spiral for the next loop.
  var SPIRAL = { r0:540, grow:170, start:-Math.PI/2 - 0.25, apw:0.108, minSpan:0.12, maxSpan:2.6, gap:0.06, ramp:1.15, tail:0.15 };
  function sizeAt(d){ return SIZE[Math.min(d, SIZE.length-1)]; }
  function stepAt(d){ return RSTEP[Math.min(d, RSTEP.length-1)]; }
  function countLeaves(n){ if(!n.children.length){ n._leaves=1; return 1; } var s=0; n.children.forEach(function(c){ s+=countLeaves(c); }); n._leaves=s; return s; }
  var _LCX=0, _LCY=0;   // center of the domain currently being laid out
  function place(n, angle, radius){ n.angle=angle; n._r=radius; n.x=_LCX+Math.cos(angle)*radius; n.y=_LCY+Math.sin(angle)*radius; n.size=sizeAt(n.depthLevel); }
  // fan a node's children across [a0,a1], each on the ring just beyond the parent
  function fanChildren(n, a0, a1){
    if (!n.children.length) return;
    // give every child at least a small slice so deep branches stay clickable;
    // soften huge leaf-count imbalances (a 152-question chapter shouldn't eat its whole arc)
    var span = a1 - a0, n2 = n.children.length, minFrac = 0.5 / n2;
    var weights = n.children.map(function(c){ return Math.pow(Math.max(c._leaves, 1), 0.6); });
    var tot = weights.reduce(function(s,w){ return s+w; }, 0) || 1;
    var fr = weights.map(function(w){ return Math.max(w/tot, minFrac); });
    var frSum = fr.reduce(function(s,x){ return s+x; }, 0);   // normalize so slices fill [a0,a1]
    var a = a0;
    n.children.forEach(function(c, i){
      var cspan = span * (fr[i] / frSum), mid = a + cspan/2;
      place(c, mid, n._r + stepAt(c.depthLevel));
      fanChildren(c, a, a + cspan);
      a += cspan;
    });
  }
  // lay out ONE domain's spiral around (cx,cy); returns its outer radius
  function layoutOne(RT, dom, cx, cy){
    _LCX = cx; _LCY = cy;
    countLeaves(RT);
    place(RT, SPIRAL.start, 0);              // this domain's core at its own center
    var cursor = SPIRAL.start, overCap = null, maxR = SPIRAL.r0;
    RT.children.forEach(function(ch, idx){
      var w = Math.pow(Math.max(ch._leaves, 1), 0.6);
      var span = Math.max(SPIRAL.minSpan, Math.min(SPIRAL.maxSpan, w * SPIRAL.apw));
      var a0 = cursor, a1 = cursor + span, mid = (a0 + a1) / 2;
      var theta = mid - SPIRAL.start;
      var over  = Math.max(0, theta - (2*Math.PI - SPIRAL.ramp));
      if (idx === 7) overCap = over;
      // small maps (Precalc, 12 ch) plateau after ch.8 so late chapters ring in close;
      // big maps (Biology, 47 ch) keep growing so the spiral simply loops outward.
      var overEff = (dom.plateau && overCap != null && idx > 7 && over > overCap)
        ? overCap + (over - overCap) * SPIRAL.tail
        : over;
      var radius = SPIRAL.r0 + SPIRAL.grow * overEff;
      place(ch, mid, radius);
      fanChildren(ch, a0, a1);
      cursor = a1 + SPIRAL.gap;
      if (radius > maxR) maxR = radius;
    });
    RT._maxR = maxR + stepAt(2) + stepAt(3);   // outer extent (incl. section/question rings)
    return RT._maxR;
  }
  // place EVERY domain, packed left-to-right by measured size so the spirals never collide
  function layoutSpiral(){
    var radii = ROOTS.map(function(RT, di){ return layoutOne(RT, DOMAINS[di], 0, 0); });   // measure each
    var GAP = 1000, cx = 0;
    ROOTS.forEach(function(RT, di){
      if (di > 0) cx += radii[di-1] + GAP + radii[di];   // edge-to-edge gap between neighbours
      DOMAINS[di].center = { x: cx, y: 0 };
      layoutOne(RT, DOMAINS[di], cx, 0);                 // final placement at the packed center
    });
  }
  // shallow→deep paint order; only changes when nodes are added, so cache it
  var drawOrder = [];
  function rebuildDrawOrder(){ drawOrder = NODES.slice().sort(function(a,b){ return a.depthLevel-b.depthLevel; }); }

    if (n.children.length && !n._aiKids){ focusNode(n); return; }   // already has real children → just dive in
    var made = synth(n); n._aiKids = true;
    made.forEach(function(c){ build(c, n, n.depthLevel+1); c=n.children[n.children.length-1]; c.appear=0; });
    relayout();
    focusNode(n);
  }
  // (To use the real Inkling backend instead of synth(), POST {title,contentType}
  //  to a decomposition route and map the returned items through build(); the
  //  layout + render below need no changes.)

  cardExpand.onclick = function(){
    var n = byId[this.dataset.id]; if(!n) return;
    if (n.children.length && !n._aiKids){ focusNode(n); return; }
    var html = this.innerHTML; this.disabled=true; this.innerHTML='<span class="spin"></span>weaving…';
    var btn=this;
    setTimeout(function(){ decompose(n); btn.disabled=false; btn.innerHTML=html; updateCard(byId[n.id]); }, 260); // tiny delay = "thinking"
  };
  cardUp.onclick = function(){ var n=byId[cardExpand.dataset.id]; if(n&&n.parentId) focusNode(byId[n.parentId]); };

  /* ── Hit-testing (topmost = smallest visible circle under the cursor) ── */
  function hit(sx, sy){
    var best=null, bestR=1e9;
    for (var i=0;i<NODES.length;i++){
      var n=NODES[i]; if (vis(n)<=0) continue;
      var sc=w2s(n.x,n.y); var rad=Math.max(n.size*cam.s, 7);
      var dx=sx-sc[0], dy=sy-sc[1];
      if (dx*dx+dy*dy <= rad*rad && rad<bestR){ best=n; bestR=rad; }
    }
    return best;
  }

  /* ── Pointer: drag to pan, click to focus, wheel/pinch to zoom ── */
  var down=false, moved=false, lastX=0, lastY=0, downX=0, downY=0;
  cv.addEventListener("pointerdown", function(e){ down=true; moved=false; lastX=downX=e.clientX; lastY=downY=e.clientY; cv.setPointerCapture(e.pointerId); cv.classList.add("drag"); maybeRequestGyro(); });
  cv.addEventListener("pointermove", function(e){
    if (!down){ var h=hit(e.clientX,e.clientY); hoverId = h?h.id:null; cv.style.cursor = h?"pointer":"grab";
      if (!gyroOn) tilt(e.clientX/W*2-1, e.clientY/H*2-1);   // desktop: cursor drives the sky parallax
      showPeek(h, e.clientX, e.clientY);
      return; }
    hidePeek();
    var dx=e.clientX-lastX, dy=e.clientY-lastY; lastX=e.clientX; lastY=e.clientY;
    if (Math.abs(e.clientX-downX)+Math.abs(e.clientY-downY) > 4) moved=true;
    cam.x -= dx/cam.s; cam.y -= dy/cam.s; camT.x=cam.x; camT.y=cam.y;
  });
  cv.addEventListener("pointerleave", function(){ hidePeek(); });
  cv.addEventListener("pointerup", function(e){
    down=false; cv.classList.remove("drag"); cv.style.cursor="grab";
    if (!moved){ var n=hit(e.clientX,e.clientY); if (n){ if (n.q) openFlashcard(n); else focusNode(n); } }
  });
  // ── Hover preview of a flashcard question; click a question-node to open it ──
  var peek=document.getElementById("peek"), peekBody=document.getElementById("peekBody");
  function showPeek(n, x, y){
    if (!n || !n.prev){ hidePeek(); return; }
    peekBody.textContent = n.prev;
    peek.style.display="block";
    var pw=Math.min(300, W-24), px=Math.min(x+16, W-pw-10), py=y+18;
    if (py > H-130) py = y - 130;
    peek.style.left=Math.max(10,px)+"px"; peek.style.top=Math.max(10,py)+"px";
    requestAnimationFrame(function(){ peek.classList.add("show"); });
  }
  function hidePeek(){ peek.classList.remove("show"); peek.style.display="none"; }
  function openFlashcard(n){
    if (!n.q) return;
    hidePeek();
    // Embedded in the Inkling app → ask the app to open the flashcard overlay (stay in-app).
    if (window.parent && window.parent !== window){
      try { window.parent.postMessage({ type:"inkling-open-flashcard", q:n.q }, "*"); return; } catch(_){}
    }
    var url = "quiz.html?q=" + encodeURIComponent(n.q);
    try { (window.top || window).location.href = url; } catch(_){ window.location.href = url; }
  }
  function zoomAt(sx, sy, factor){
    var before = s2w(sx, sy);
    camT.s = Math.max(0.04, Math.min(5, camT.s*factor)); cam.s = camT.s;   // apply now for anchor math
    var after = s2w(sx, sy);
    camT.x += before[0]-after[0]; camT.y += before[1]-after[1]; cam.x=camT.x; cam.y=camT.y;
  }
  cv.addEventListener("wheel", function(e){ e.preventDefault(); zoomAt(e.clientX, e.clientY, e.deltaY<0?1.12:1/1.12); }, {passive:false});
  // pinch
  var pinch=null;
  cv.addEventListener("touchmove", function(e){
    if (e.touches.length===2){ e.preventDefault();
      var a=e.touches[0], b=e.touches[1], d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY), mx=(a.clientX+b.clientX)/2, my=(a.clientY+b.clientY)/2;
      if (pinch) zoomAt(mx,my, d/pinch); pinch=d;
    }
  }, {passive:false});
  cv.addEventListener("touchend", function(){ pinch=null; });

  document.getElementById("zin").onclick=function(){ zoomAt(W/2,H/2,1.5); };
  document.getElementById("zout").onclick=function(){ zoomAt(W/2,H/2,1/1.5); };
  document.getElementById("home").onclick=function(){ frameAll(); };
  // switch to the 3D spiral — in-app asks the panel to swap the Mind surface, standalone navigates
  document.getElementById("to3d").onclick=function(){
    if (window.parent && window.parent !== window){ try { window.parent.postMessage({ type:"inkling-open-graph", mode:"3d" }, "*"); return; } catch(_){} }
    location.href = "wordweaver3d.html";
  };
  // exit the knowledge canvas — in-app closes the Mind overlay, standalone returns to the app
  document.getElementById("exitCanvas").onclick=function(){
    if (window.parent && window.parent !== window){ try { window.parent.postMessage({ type:"inkling-close-graph" }, "*"); return; } catch(_){} }
    location.href = "/";
  };

  // frame BOTH domain cores so every subject's yellow orb is on the map
  function frameAll(){
    // frame the cores themselves (+ a ring of breathing room) so both yellow orbs
    // sit on screen WITH their subject labels; the spiral arms run off-screen to explore.
    var xs=ROOTS.map(function(r){return r.x;}), ys=ROOTS.map(function(r){return r.y;});
    var minx=Math.min.apply(null,xs), maxx=Math.max.apply(null,xs);
    var miny=Math.min.apply(null,ys), maxy=Math.max.apply(null,ys);
    var pad=SPIRAL.r0*1.4;
    cam.x=camT.x=(minx+maxx)/2; cam.y=camT.y=(miny+maxy)/2;
    var s=Math.min(W/((maxx-minx)+pad*2), H/((maxy-miny)+pad*2));
    cam.s=camT.s=Math.max(0.03, Math.min(0.6, s));
    focusId=null; HL=null; updateCard(ROOTS[0]); updateCrumb(ROOTS[0]);
  }
  frameAll();
})();
</script>
</body>
</html>
