<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>WordWeaver — 3D Study Map</title>
<style>
  :root{ --accent:#7c5cff; --text:#eef1fa; --muted:#9aa3bd; --panel:rgba(12,17,30,.92); --line:#222b46; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#04050d;color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-user-select:none;user-select:none}
  #app{position:fixed;inset:0}
  canvas{display:block}
  .hud{position:fixed;z-index:5}
  #top{top:10px;left:10px;right:10px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  #title{font-weight:700;opacity:.9;font-size:14px}
  #title small{color:var(--muted);font-weight:500}
  .tab{pointer-events:auto;border:.5px solid var(--line);background:rgba(12,17,30,.8);color:var(--text);font-size:13px;font-weight:600;padding:6px 10px;border-radius:999px;cursor:pointer;text-decoration:none}
  #spacer{flex:1}
  #hint{left:50%;bottom:14px;transform:translateX(-50%);font-size:12px;color:var(--muted);background:rgba(12,17,30,.6);padding:5px 12px;border-radius:999px;white-space:nowrap}
  #legend{left:12px;bottom:14px;display:flex;flex-direction:column;gap:5px;background:rgba(12,17,30,.72);border:.5px solid var(--line);border-radius:12px;padding:8px 12px;font-size:12px}
  #legend .row{display:flex;align-items:center;gap:7px}
  #legend .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
  .clabel{font:800 13px system-ui;color:#eef1fa;background:rgba(10,14,26,.6);padding:3px 10px;border-radius:10px;border:.5px solid rgba(255,255,255,.15);white-space:nowrap;text-shadow:0 1px 4px #000;pointer-events:none}
  #tip{position:fixed;left:50%;bottom:70px;transform:translate(-50%,0);z-index:6;max-width:340px;width:88vw;background:var(--panel);backdrop-filter:blur(10px);border:.5px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:0 18px 50px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s ease, transform .2s ease}
  #tip.show{opacity:1;pointer-events:auto;transform:translate(-50%,-6px)}
  #tip .tk{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
  #tip h2{margin:3px 0 6px;font-size:16px}
  #tip .m{font-size:13px;color:#c9d0e6}
  #tipClose{background:none;border:none;color:var(--muted);font-size:17px;position:absolute;top:8px;right:10px;cursor:pointer}
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;z-index:9;background:#04050d}
</style>
</head>
<body>
<div id="app"></div>
<div id="loading">Raising the towers…</div>
<div id="top" class="hud">
  <div id="title">3D <span style="color:var(--accent)">Study Map</span> <small>— every subject, at a glance</small></div>
  <div id="spacer"></div>
  <a href="wordweaver.html" class="tab" id="to2d">🗺 2D</a>
  <button class="tab" id="exit3d" style="border-color:rgba(255,90,90,.55);color:#ff7a7a;font-weight:700" title="Exit the knowledge skyline">✕</button>
</div>
<div id="legend" class="hud"></div>
<div id="hint" class="hud">Drag to orbit · scroll to zoom · click a tower for its chapter</div>
<div id="tip">
  <button id="tipClose" aria-label="Close">✕</button>
  <div class="tk" id="tipDomain"></div>
  <h2 id="tipTitle"></h2>
  <div class="m" id="tipMastery"></div>
</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.164.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.164.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { CSS2DRenderer, CSS2DObject } from "three/addons/renderers/CSS2DRenderer.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";

/* ── the five subjects, as skylines you view from a distance rather than fly through.
   Tower height = mastery (answered/correct in that chapter's flashcards) — most towers
   are short stubs today since content is thin outside Precalc Ch.1-3 and Biology Ch.1.
   idPrefix is the localStorage section-id convention (quiz.html): Precalc sections are
   bare "N.M", Biology is "bio N.M". Chemistry/Physics/AI have no decks yet, so "chem N.M" /
   "phys N.M" / "ai N.M" are a forward-compatible guess matching Biology's pattern — once
   those subjects get real flashcard content under those ids, their towers light up for free. */
const DOMAINS = [
  { key:"precalc", name:"Precalculus", emoji:"📐", hue:265, idPrefix:"", center:{x:0,z:0},
    chapters:["Functions","Linear Functions","Polynomial & Rational Functions","Exponential & Logarithmic Functions",
      "Trigonometric Functions","Periodic Functions","Trigonometric Identities and Equations","Further Applications of Trigonometry",
      "Systems of Equations and Inequalities","Analytic Geometry","Sequences, Probability, and Counting Theory","Introduction to Calculus"] },
  { key:"biology", name:"Biology", emoji:"🧬", hue:140, idPrefix:"bio ", center:{x:34,z:0},
    chapters:["The Study of Life","The Chemical Foundation of Life","Biological Macromolecules","Cell Structure",
      "Structure and Function of Plasma Membranes","Metabolism","Cellular Respiration","Photosynthesis","Cell Communication",
      "Cell Reproduction","Meiosis and Sexual Reproduction","Mendel's Experiments and Heredity","Modern Understanding of Inheritance",
      "DNA Structure and Function","Genes and Proteins","Gene Expression","Biotechnology and Genomics",
      "Evolution and the Origin of Species","The Evolution of Populations","Phylogenies and the History of Life","Viruses",
      "Prokaryotes: Bacteria and Archaea","Protists","Fungi","Seedless Plants","Seed Plants","Introduction to Animal Diversity",
      "Invertebrates","Vertebrates","Plant Form and Physiology","Soil and Plant Nutrition","Plant Reproduction",
      "The Animal Body: Basic Form and Function","Animal Nutrition and the Digestive System","The Nervous System",
      "Sensory Systems","The Endocrine System","The Musculoskeletal System","The Respiratory System","The Circulatory System",
      "Osmotic Regulation and Excretion","The Immune System","Animal Reproduction and Development","Ecology and the Biosphere",
      "Population and Community Ecology","Ecosystems","Conservation Biology and Biodiversity"] },
  { key:"chemistry", name:"Chemistry", emoji:"⚗️", hue:32, idPrefix:"chem ", center:{x:-34,z:0},
    chapters:["Essential Ideas","Atoms, Molecules, and Ions","Composition of Substances and Solutions",
      "Stoichiometry of Chemical Reactions","Thermochemistry","Electronic Structure and Periodic Properties of Elements",
      "Chemical Bonding and Molecular Geometry","Advanced Theories of Covalent Bonding","Gases","Liquids and Solids",
      "Solutions and Colloids","Kinetics","Fundamental Equilibrium Concepts","Acid-Base Equilibria",
      "Equilibria of Other Reaction Classes","Thermodynamics","Electrochemistry",
      "Representative Metals, Metalloids, and Nonmetals","Transition Metals and Coordination Chemistry",
      "Organic Chemistry","Nuclear Chemistry"] },
  { key:"physics", name:"Physics", emoji:"🌀", hue:194, idPrefix:"phys ", center:{x:0,z:-42},
    chapters:["The Nature of Science and Physics","One-Dimensional Kinematics","Two-Dimensional Kinematics",
      "Dynamics: Force and Newton's Laws of Motion","Further Applications of Newton's Laws: Friction, Drag, and Elasticity",
      "Uniform Circular Motion and Gravitation","Work, Energy, and Energy Resources","Linear Momentum and Collisions",
      "Statics and Torque","Rotational Motion and Angular Momentum","Fluid Statics",
      "Fluid Dynamics and Its Biological and Medical Applications","Temperature, Kinetic Theory, and the Gas Laws",
      "Heat and Heat Transfer Methods","Thermodynamics","Oscillatory Motion and Waves","Physics of Hearing",
      "Electric Charge and Electric Field","Electric Potential and Electric Field","Electric Current, Resistance, and Ohm's Law",
      "Circuits and DC Instruments","Magnetism","Electromagnetic Induction, AC Circuits, and Electrical Technologies",
      "Electromagnetic Waves","Geometric Optics","Vision and Optical Instruments","Wave Optics","Special Relativity",
      "Introduction to Quantum Physics","Atomic Physics","Radioactivity and Nuclear Physics",
      "Medical Applications of Nuclear Physics","Particle Physics","Frontiers of Physics"] },
  { key:"ai", name:"Artificial Intelligence", emoji:"🤖", hue:322, idPrefix:"ai ", center:{x:0,z:42},
    chapters:["Introduction to AI","Intelligent Agents","Solving Problems by Searching","Beyond Classical Search",
      "Adversarial Search and Games","Constraint Satisfaction Problems","Logical Agents","First-Order Logic",
      "Inference in First-Order Logic","Knowledge Representation","Automated Planning","Quantifying Uncertainty",
      "Probabilistic Reasoning","Making Simple Decisions","Making Complex Decisions","Machine Learning: Learning from Examples",
      "Learning Probabilistic Models","Deep Learning","Reinforcement Learning","Natural Language Processing",
      "Computer Vision","Robotics","Philosophy, Ethics, and Safety of AI"] }
];
const GAP = 3.1;          // spacing between neighboring towers in a cluster
const MINH = 0.6, UNIT = 1.15, MAXADD = 8.2;   // height curve: stub → capped skyscraper

/* ── stats (shared with the flashcards, same-origin localStorage) ── */
function loadJSON(k){ try{ return JSON.parse(localStorage.getItem(k)||"{}")||{}; }catch(_){ return {}; } }
function masteryOf(prefix, chNum){
  const stats = loadJSON("inkling-quiz-stats");
  const re = new RegExp("^" + prefix + chNum + "\\.\\d+$");
  let pass = 0, fail = 0;
  Object.keys(stats).forEach(k => {
    if (!re.test(k)) return;
    (stats[k] || []).forEach(q => { if (q){ pass += q.p || 0; fail += q.f || 0; } });
  });
  return { pass, fail };
}
function heightFor(pass, fail){ return MINH + Math.min(MAXADD, Math.log2(1 + pass + fail) * UNIT); }
function colorFor(hue, pass, fail){
  const total = pass + fail;
  if (!total) return { color:new THREE.Color().setHSL(hue/360, 0.22, 0.14), glow:0.05 };
  const acc = pass / total;
  return { color:new THREE.Color().setHSL(hue/360, 0.5+0.4*acc, 0.30+0.28*acc), glow:0.3+0.65*acc };
}

/* ── three.js scene ── */
const app = document.getElementById("app");
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace; app.appendChild(renderer.domElement);
const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
labelRenderer.domElement.style.position = "fixed"; labelRenderer.domElement.style.top = "0";
labelRenderer.domElement.style.pointerEvents = "none"; app.appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x05060d, 0.0075);
const camera = new THREE.PerspectiveCamera(52, innerWidth/innerHeight, 0.1, 500);
camera.position.set(6, 58, 96);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 6, 0);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.minDistance = 32; controls.maxDistance = 155;
controls.maxPolarAngle = Math.PI * 0.49;
controls.autoRotate = true; controls.autoRotateSpeed = 0.35;
controls.addEventListener("start", () => { controls.autoRotate = false; });

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.65, 0.55, 0.42);
composer.addPass(bloom);

scene.add(new THREE.AmbientLight(0x8899ff, 0.55));
const key = new THREE.DirectionalLight(0xffffff, 1.0); key.position.set(20, 60, 30); scene.add(key);
const rim = new THREE.PointLight(0x7c5cff, 70, 160); rim.position.set(-20, 30, -20); scene.add(rim);

/* galaxy dome sky */
new THREE.TextureLoader().load("assets/wordweaver/galaxy.webp", (tex) => {
  tex.colorSpace = THREE.SRGBColorSpace;
  const dome = new THREE.Mesh(new THREE.SphereGeometry(220, 48, 32),
    new THREE.MeshBasicMaterial({ map: tex, side: THREE.BackSide, depthWrite:false }));
  scene.add(dome);
  document.getElementById("loading").style.display = "none";
});
setTimeout(() => { document.getElementById("loading").style.display = "none"; }, 2500);

(function(){ const g=new THREE.BufferGeometry(), n=1400, pos=new Float32Array(n*3);
  for (let i=0;i<n;i++){ const r=90+Math.random()*110, th=Math.random()*Math.PI*2, ph=Math.acos(2*Math.random()-1);
    pos[i*3]=r*Math.sin(ph)*Math.cos(th); pos[i*3+1]=Math.abs(r*Math.cos(ph)); pos[i*3+2]=r*Math.sin(ph)*Math.sin(th); }
  g.setAttribute("position", new THREE.BufferAttribute(pos,3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color:0xaab6ff, size:0.5, transparent:true, opacity:.7 })));
})();

/* ground */
const floor = new THREE.Mesh(new THREE.CircleGeometry(105, 64),
  new THREE.MeshStandardMaterial({ color:0x0a1020, metalness:0.85, roughness:0.4 }));
floor.rotation.x = -Math.PI/2; scene.add(floor);
const grid = new THREE.GridHelper(210, 84, 0x2a3560, 0x141c34); grid.position.y = 0.02; scene.add(grid);

/* ── towers ── */
const unitBox = new THREE.BoxGeometry(1.7, 1, 1.7);
const unitEdges = new THREE.EdgesGeometry(unitBox);
const capGeo = new THREE.BoxGeometry(1.9, 0.12, 1.9);
const towers = [];   // { mesh, hue, pass, fail, domainKey, domainName, chapterNum, chapterTitle }

DOMAINS.forEach(dom => {
  const n = dom.chapters.length;
  const cols = Math.ceil(Math.sqrt(n));
  const rows = Math.ceil(n / cols);
  const originX = dom.center.x - ((cols-1)*GAP)/2;
  const originZ = dom.center.z - ((rows-1)*GAP)/2;
  dom.chapters.forEach((title, idx) => {
    const chNum = idx + 1;
    const col = idx % cols, row = Math.floor(idx / cols);
    const { pass, fail } = masteryOf(dom.idPrefix, chNum);
    const h = heightFor(pass, fail);
    const { color, glow } = colorFor(dom.hue, pass, fail);
    const mesh = new THREE.Mesh(unitBox, new THREE.MeshStandardMaterial({
      color, emissive: color, emissiveIntensity: glow, metalness:0.55, roughness:0.35 }));
    mesh.scale.set(1, h, 1);
    mesh.position.set(originX + col*GAP, h/2, originZ + row*GAP);
    const edges = new THREE.LineSegments(unitEdges, new THREE.LineBasicMaterial({
      color: new THREE.Color().setHSL(dom.hue/360, 0.85, 0.68), transparent:true, opacity:0.85 }));
    mesh.add(edges);
    const cap = new THREE.Mesh(capGeo, new THREE.MeshStandardMaterial({
      color: 0xffffff, emissive: color, emissiveIntensity: glow*1.3, metalness:0.4, roughness:0.25 }));
    cap.position.set(0, 0.5, 0);
    mesh.add(cap);
    scene.add(mesh);
    towers.push({ mesh, hue:dom.hue, pass, fail, domainKey:dom.key, domainName:dom.name, emoji:dom.emoji, chapterNum:chNum, chapterTitle:title });
  });
  // floating cluster label above the whole neighborhood
  const labelDiv = document.createElement("div");
  labelDiv.className = "clabel";
  labelDiv.textContent = dom.emoji + " " + dom.name + " · " + n + " ch";
  const label = new CSS2DObject(labelDiv);
  label.position.set(dom.center.x, 12, dom.center.z);
  scene.add(label);
});

function refreshMastery(){
  towers.forEach(t => {
    const dom = DOMAINS.find(d => d.key === t.domainKey);
    const { pass, fail } = masteryOf(dom.idPrefix, t.chapterNum);
    if (pass === t.pass && fail === t.fail) return;
    t.pass = pass; t.fail = fail;
    const h = heightFor(pass, fail);
    const { color, glow } = colorFor(t.hue, pass, fail);
    t.mesh.scale.y = h; t.mesh.position.y = h/2;
    t.mesh.material.color.copy(color); t.mesh.material.emissive.copy(color); t.mesh.material.emissiveIntensity = glow;
    t.mesh.children[1].material.emissive.copy(color); t.mesh.children[1].material.emissiveIntensity = glow*1.3;
  });
}
window.addEventListener("storage", e => { if (!e.key || /inkling-quiz-(progress|stats)/.test(e.key)) refreshMastery(); });
window.addEventListener("message", e => { if (e.data && e.data.type === "inkling-refresh-progress") refreshMastery(); });
window.addEventListener("focus", refreshMastery);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refreshMastery(); });

/* legend */
const legend = document.getElementById("legend");
DOMAINS.forEach(dom => {
  const row = document.createElement("div"); row.className = "row";
  const dot = document.createElement("span"); dot.className = "dot";
  dot.style.background = "hsl(" + dom.hue + ",70%,55%)";
  const label = document.createElement("span"); label.textContent = dom.emoji + " " + dom.name;
  row.appendChild(dot); row.appendChild(label); legend.appendChild(row);
});

/* click a tower → tooltip */
const raycaster = new THREE.Raycaster(); const pointer = new THREE.Vector2();
const tip = document.getElementById("tip");
function showTip(t){
  document.getElementById("tipDomain").textContent = t.emoji + " " + t.domainName + " · Chapter " + t.chapterNum;
  document.getElementById("tipTitle").textContent = t.chapterTitle;
  const total = t.pass + t.fail;
  document.getElementById("tipMastery").textContent = total
    ? total + " question" + (total===1?"":"s") + " answered · " + Math.round(100*t.pass/total) + "% correct"
    : "Not started yet — no graded questions here.";
  tip.classList.add("show");
}
document.getElementById("tipClose").onclick = () => tip.classList.remove("show");
renderer.domElement.addEventListener("click", (e) => {
  const rect = renderer.domElement.getBoundingClientRect();
  pointer.x = ((e.clientX - rect.left)/rect.width)*2 - 1;
  pointer.y = -((e.clientY - rect.top)/rect.height)*2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hit = raycaster.intersectObjects(towers.map(t => t.mesh), false)[0];
  if (hit){ const t = towers.find(x => x.mesh === hit.object); if (t) showTip(t); }
  else tip.classList.remove("show");
});

/* resize */
addEventListener("resize", () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); labelRenderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight); bloom.setSize(innerWidth, innerHeight);
});

/* exit — in-app closes the Mind overlay, standalone returns to the app */
document.getElementById("exit3d").onclick = () => {
  if (window.parent && window.parent !== window){ try { window.parent.postMessage({ type:"inkling-close-graph" }, "*"); return; } catch(_){} }
  location.href = "/";
};
/* switch to 2D — in-app routes through the panel so the Mind iframe's src stays in sync */
document.getElementById("to2d").addEventListener("click", (e) => {
  if (window.parent && window.parent !== window){
    e.preventDefault();
    try { window.parent.postMessage({ type:"inkling-open-graph", mode:"2d" }, "*"); } catch(_){}
  }
});

/* render loop */
(function animate(){
  requestAnimationFrame(animate);
  controls.update();
  labelRenderer.render(scene, camera);
  composer.render();
})();
</script>
</body>
</html>
